function lifeRender(){
 const s={...lifecycleScenes[lifeKey],...(lifeKey==='stopping'?lifeStopContext:null)};
 const target=s.target||'秋雨东京.md';
 return '<div class="hw-owner">'+esc(s.message||'写一首关于东京秋雨的诗，保存到文件里。')+'</div>'+assistant(
 '<section class="life-result" aria-label="本轮执行状态"><h2 id="life-status" role="status">'+esc(s.title)+'</h2><p class="life-description">'+esc(s.description)+'</p>'+
 (s.card?'<section class="hw-approval" aria-label="本次文件操作"><h3>本次操作</h3><dl><dt>文件</dt><dd>'+esc(target)+'</dd><dt>操作</dt><dd>新建文件，不覆盖已有内容</dd><dt>范围</dt><dd>仅此文件、仅此操作</dd></dl></section>':'')+
 '<div class="hw-actions">'+(s.actions||[]).map(([label,to])=>'<button class="hw-secondary" data-life="'+to+'" '+(lifeOffline?'disabled':'')+'>'+esc(label)+'</button>').join('')+'</div>'+
 (s.file?'<button class="hw-file" data-life="file">'+icon('file-text')+'<span>秋雨东京.md<small>查看已保存内容</small></span></button>':'')+
 '<details class="life-details"><summary>查看过程 <span>'+esc(s.phase)+'</span></summary><div class="life-tool">'+icon(s.toolIcon||'file-plus-2')+'<code>'+esc(s.toolName||'write')+'</code><span>'+esc(s.tool)+'</span></div><p class="life-path">'+esc(target)+'</p><ul>'+s.times.map(t=>'<li>'+esc(t)+'</li>').join('')+'<p class="hw-small hw-muted">时间来源：持久化事件的阶段起止时间；并行执行取区间并集。此页数值均为演示。</p></details></section>')+
 '<p class="life-review-note"><strong>审核说明：</strong>'+esc(s.note)+'</p>';
}
function lifeControls(){
 const s={...lifecycleScenes[lifeKey],...(lifeKey==='stopping'?lifeStopContext:null)};
 const send=q('.hw-send');send.dataset.life=s.stop||'draft';send.removeAttribute('data-act');send.disabled=lifeOffline||s.stop==='pending';send.setAttribute('aria-label',s.stop==='pending'?'正在停止':s.stop?'停止本轮':'发送消息');send.innerHTML=icon(s.stop?'square':'arrow-up');
 q('.hw-banner').hidden=!lifeOffline;q('.hw-banner').textContent='暂时无法获取最新进度，输入内容已保留。下方为最后确认的状态。';
 q('[data-act=demo-recover]').hidden=true;q('.hw-input-status').hidden=true;icons();
}
const baseChangeScene=changeScene;
changeScene=function(value){
 if(!value.startsWith('lifecycle:')){q('.hw-send').removeAttribute('data-life');q('.hw-send').dataset.act='send';q('.hw-send').setAttribute('aria-label','发送消息');q('.hw-send').innerHTML=icon('arrow-up');baseChangeScene(value);return}
 saveDraft();closeModelPicker();closeDialog();q('.hw-preview').hidden=true;lifeKey=value.slice('lifecycle:'.length);current='lifecycle-demo';scene=value;network=lifeOffline?'offline':'online';lifeThread.pending=!!lifecycleScenes[lifeKey].attention;q('#hw-scene').value=value;renderList();renderContent();
};
root.addEventListener('click',e=>{
 const b=e.target.closest('[data-life]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const to=b.dataset.life;
 if(to==='diff'||to==='file'){
  openDialog('lifecycle','<header class="hw-dialog-head"><h2>'+(to==='diff'?'查看候选差异':'秋雨东京.md')+'</h2><button data-act="close" aria-label="关闭预览">'+icon('x')+'</button></header><div class="hw-simple-body"><p class="hw-note">演示内容，不读取真实文件。</p>'+(to==='diff'?'<pre>当前版本：\n雨落东京，街灯映水。\n\n候选修改：\n雨落东京，街灯映水。\n把归人的脚步写进秋声。</pre><p>候选内容已保留。根据最新版重新生成时仍会重新检查权限与目标，不直接覆盖。</p>':'<pre>秋雨落在东京的窗，\n街灯把夜色慢慢照亮。</pre>')+'</div>',true);q('.hw-dialog').setAttribute('aria-label',to==='diff'?'查看候选差异':'查看已保存文件');return;
 }
 if(to==='draft'){notify('这是交互审核稿，输入内容不会发送给模型或服务。');return}
 if(to==='pending')return;
 if(to==='stopping'){const previous=lifecycleScenes[lifeKey];lifeStopContext={toolName:previous.toolName,toolIcon:previous.toolIcon,target:previous.target,message:previous.message}}
 changeScene('lifecycle:'+to);
},true);
root.addEventListener('keydown',e=>{if(current==='lifecycle-demo'&&e.target===q('textarea')&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.stopImmediatePropagation();notify('这是交互审核稿，草稿不会发送。')}},true);
root.addEventListener('input',()=>{if(current==='lifecycle-demo')lifeControls()});
document.documentElement.style.backgroundColor=document.body.style.backgroundColor='#1e1e1e';
changeScene('lifecycle:review');

if(globalThis.Tweak){const knobs={scene:'model',density:40};const tweak=new Tweak({container:root,onChange:()=>{changeScene(knobs.scene);qa('.hw-row').forEach(el=>el.style.minHeight=knobs.density+'px')}});tweak.addSelect(knobs,'scene',{label:'审核场景',options:[{label:'模型与强度',value:'model'},{label:'工具与计时',value:'process'},{label:'新对话',value:'home'},{label:'统一设置',value:'settings'},{label:'会话内确认',value:'approval'},{label:'首次搜索授权',value:'search'},{label:'服务尚未就绪',value:'connecting'},{label:'连接中断',value:'offline'},{label:'进度无法确认',value:'unknown'}]});tweak.addSlider(knobs,'density',{label:'会话行高',min:36,max:46,unit:'px'})}
})();
</script>
