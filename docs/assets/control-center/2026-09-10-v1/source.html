<script>
(() => {
const root=document.getElementById('hm-prototype');
const q=s=>root.querySelector(s);const all=s=>[...root.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const prefs={theme:'dark',accent:'purple',density:'comfortable',scene:'complete'};
const S={turnIndex:0,currentTurn:null,scene:'complete',model:'GPT-5.5',runModel:'GPT-5.5',effort:'标准',mode:'执行',running:false,offline:false,waiting:false,stopped:false,phase:'',activeMs:0,started:0,waitStarted:0,timer:null,toastTimer:null,threadTitle:'修复任务完成通知',drafts:{},scrollFollow:true,attachment:'',seq:0};
const titles={complete:'修复任务完成通知',reading:'了解 Agent 的执行过程',running:'整理本周的项目进展',approval:'查阅接口迁移文档',offline:'检查远程工作区',notes:'关于记忆管理的几个想法',notes2:'整理我的阅读笔记',new:'新对话'};
const modelFixtures=[{name:'GPT-5.5',vendor:'OpenAI',mark:'O',description:'通用任务与代码工作'},{name:'Claude Sonnet 4.6',vendor:'Anthropic',mark:'A',description:'日常协作与快速迭代'},{name:'Claude Opus 4.6',vendor:'Anthropic',mark:'A',description:'复杂问题与深入分析'}];
const accentColors={purple:{label:'紫罗兰',light:'#87539c',dark:'#d38ce2'},blue:{label:'海蓝',light:'#3269b5',dark:'#87b5f3'},green:{label:'青绿',light:'#34725b',dark:'#85c5a5'},amber:{label:'琥珀',light:'#876218',dark:'#d9b562'},rose:{label:'玫瑰',light:'#a44c6a',dark:'#e89db6'},gray:{label:'石墨',light:'#555555',dark:'#bdbdbd'}};
function appearance(){root.style.colorScheme=prefs.theme;root.dataset.appearance=prefs.theme;const color=accentColors[prefs.accent]||accentColors.purple;root.style.setProperty('--hm-accent',`light-dark(${color.light},${color.dark})`);root.style.setProperty('--hm-accent-bg','light-dark(#ececea,#343434)');root.style.setProperty('--hm-focus','var(--hm-accent)');root.style.setProperty('font-size','14px');all('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===prefs.theme)));all('[data-accent-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.accentChoice===prefs.accent)));}
function appearanceControls(){return `<div class="hm-menu-title" style="padding:0">界面主题</div><div class="hm-theme-options">${[['light','Light','sun'],['dark','Dark','moon']].map(([v,l,i])=>`<button class="hm-theme-choice" data-theme-choice="${v}" aria-pressed="${prefs.theme===v}">${icon(i)}${l}</button>`).join('')}</div><div class="hm-menu-title" style="padding:0">主题色</div><div class="hm-colors">${Object.entries(accentColors).map(([v,c])=>`<button class="hm-color-choice" data-accent-choice="${v}" aria-label="${c.label}主题色" aria-pressed="${prefs.accent===v}"><span class="hm-swatch" style="--hm-swatch:light-dark(${c.light},${c.dark})"></span>${c.label}</button>`).join('')}</div><div class="hm-appearance-example"><a class="hm-link" href="#execution-records" data-reference="process">查看执行记录 ↗</a><div class="hm-menu-caption" style="margin-top:5px">链接、焦点与选中标记跟随主题色。</div></div>`}
function openAppearance(button){q('.hm-appearance-menu').innerHTML=appearanceControls();icons();toggleMenu('.hm-appearance-menu',button)}
function openSettings(){showDrawer('偏好设置',`${appearanceControls()}<h3 style="margin-top:25px">过程显示</h3><p class="hm-muted">每轮保留思考摘要与工具记录。正在执行的步骤自动展开，已完成的工具输入、输出可按需查看。</p><h3 style="margin-top:24px">原型场景</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${[['new','新对话'],['running','思考与工具'],['approval','等待确认'],['offline','断线恢复'],['complete','执行完成']].map(([v,l])=>`<button class="hm-secondary" data-scene="${v}">${l}</button>`).join('')}</div>`)}
function eventHtml(ev,index){const state={complete:'完成',running:ev.type==='thinking'?'思考中':'运行中',waiting:'等待确认',stopped:'已停止',unknown:'待同步'}[ev.status]||'待执行';return `<details class="hm-event" data-event-index="${index}" data-status="${ev.status}" ${ev.open?'open':''}><summary>${icon(ev.type==='thinking'?'brain':ev.name==='bash'?'terminal':ev.name==='edit'?'file-pen-line':'file-search')}${ev.type==='thinking'?'<span>思考摘要</span>':`<code>${esc(ev.name)}</code>`}<span class="hm-event-label">${esc(ev.label)}</span><span class="hm-event-status">${ev.status==='running'?'<span class="hm-pulse"></span>':''}<span>${state}</span><span class="hm-mono" data-event-time="${index}">${format(ev.ms||0)}</span></span></summary>${ev.type==='thinking'?`<p class="hm-thinking-summary">${esc(ev.summary||'正在理解任务，准备下一步。')}</p>`:`<div class="hm-event-detail"><div class="hm-io-label">输入</div><pre>${esc(ev.input||'—')}</pre><div class="hm-io-label">输出</div><pre>${esc(ev.output||(ev.status==='waiting'?'获得确认后执行':ev.status==='unknown'?'连接中断，等待同步结果':'等待工具返回…'))}</pre></div>`}</details>`}
function activityMarkup(events,{status='complete',duration=0,open=true}={}){const thoughts=events.filter(e=>e.type==='thinking').length,tools=events.filter(e=>e.type==='tool').length;return `<details class="hm-turn-process" ${open?'open':''} aria-label="第 ${S.turnIndex||1} 轮思考与工具记录"><summary>${icon('chevron-right')}<span>思考 ${thoughts} 次 · 工具 ${tools} 次</span><span class="hm-turn-result">${status==='complete'?'已完成':status==='waiting'?'等待确认':status==='unknown'?'状态待同步':status==='stopped'?'已停止':'执行中'}${duration?' · '+format(duration):''}</span></summary><div class="hm-event-list">${events.map(eventHtml).join('')}</div></details>`}
function processBlock(open=true){return activityMarkup([
{type:'thinking',label:'定位重复通知的来源',status:'complete',ms:2000,summary:'先检查完成事件与通知发送的关系，确认重复发生的位置。'},
{type:'tool',name:'read',label:'读取通知发送逻辑',status:'complete',ms:6000,input:'notification-service.ts\nnotification-store.ts',output:'已读取 2 个文件，找到完成通知的发送入口。'},
{type:'tool',name:'edit',label:'增加发送记录去重',status:'complete',ms:18000,input:'notification-service.ts\nnotification-store.ts\nnotification.test.ts',output:'已更新通知去重逻辑与相关测试。'},
{type:'tool',name:'bash',label:'验证去重与失败重试',status:'complete',ms:14000,input:'pnpm test notification',output:'✓ 首次完成：发送通知\n✓ 重复事件：不再发送\n✓ 发送失败：允许重试\n3 项检查通过（示例）'},
{type:'thinking',label:'核对结果与影响范围',status:'complete',ms:2000,summary:'相关检查已通过，可以说明本次变更和验证范围。'}
],{duration:42000,open})}
function simpleThinking(){return activityMarkup([{type:'thinking',label:'整理回答',status:'complete',ms:3000,summary:'根据当前对话整理关键概念，给出直接、可执行的说明。'}],{duration:3000,open:true})}
function paintActivity(turn){if(!turn.process)return;const expanded=new Map([...turn.process.querySelectorAll('.hm-event')].map(e=>[+e.dataset.eventIndex,e.open]));turn.events.forEach((e,i)=>{if(expanded.has(i))e.open=expanded.get(i)});turn.process.querySelector('.hm-event-list').innerHTML=turn.events.map(eventHtml).join('');const thoughtCount=turn.events.filter(e=>e.type==='thinking').length,toolCount=turn.events.filter(e=>e.type==='tool').length;turn.process.querySelector('summary>span').textContent=`思考 ${thoughtCount} 次 · 工具 ${toolCount} 次`;turn.process.querySelector('.hm-turn-result').textContent=turn.status==='complete'?'已完成 · '+format(turn.elapsed):turn.status==='stopped'?'已停止 · '+format(turn.elapsed):'执行中';icons()}
function completeTurnActivity(status){const turn=S.currentTurn;if(!turn)return;turn.status=status;turn.elapsed=elapsed();turn.events.forEach(e=>{if(e.status==='running'){e.status=status==='complete'?'complete':'stopped';e.ms=performance.now()-e.started}});paintActivity(turn);if(turn.answer){turn.answer.querySelector('.hm-caret')?.remove();turn.answer.classList.remove('hm-live-answer')}S.currentTurn=null;}
function startStreaming(kind='reply',append=true){const carried=kind==='approval'?S.activeMs:0;if(S.currentTurn)completeTurnActivity('stopped');resetRun();S.activeMs=carried;S.running=true;S.started=performance.now();S.runModel=S.model;S.phase='正在思考 · 理解任务';const seq=++S.seq,area=q('.hm-transcript');if(append)area.insertAdjacentHTML('beforeend',head());const t={id:S.turnIndex,events:[],stage:-1,status:'running',elapsed:0,process:null,answer:null};S.currentTurn=t;
area.insertAdjacentHTML('beforeend',activityMarkup([],{status:'running',open:true})+`<div class="hm-answer hm-live-answer" hidden><span class="hm-stream"></span><span class="hm-caret"></span></div>`);t.process=all('.hm-turn-process').at(-1);t.answer=all('.hm-live-answer').at(-1);runtime();scrollEnd(true);

function tick(){if(seq!==S.seq)return;const ms=performance.now()-S.started,stage=ms<2000?0:ms<5500?1:ms<9000?2:ms<11000?3:4;const active=t.events.at(-1);if(active?.status==='running'){active.ms=performance.now()-active.started;const d=t.process.querySelector(`[data-event-time="${t.events.length-1}"]`);if(d)d.textContent=format(active.ms)}const rt=q('.hm-run-time');if(rt)rt.textContent=format(elapsed());

function setScene(scene){clearTimeout(S.toastTimer);q('.hm-toast').hidden=true;S.drafts[S.scene]=q('textarea').value;resetRun();S.turnIndex=0;closeMenus();q('.hm-drawer').hidden=true;root.dataset.sidebar='';q('.hm-scrim').hidden=true;S.scene=scene;prefs.scene=scene;S.threadTitle=titles[scene]||'新对话';q('.hm-title').textContent=S.threadTitle;all('.hm-thread').forEach(b=>b.setAttribute('aria-current',String(b.dataset.scene===scene)));q('textarea').value=S.drafts[scene]||'';S.runModel=S.model;S.scrollFollow=true;let html='';if(scene==='complete')html=completeHtml();else if(scene==='new')html=emptyHtml();else if(scene==='approval'){S.waiting=true;S.activeMs=12000;S.waitStarted=performance.now();html=approvalHtml();S.timer=setInterval(()=>{const w=q('.hm-wait-time');if(w)w.textContent=format(performance.now()-S.waitStarted)},1000)}else if(scene==='offline'){S.offline=true;q('.hm-offline').hidden=false;html=offlineHtml()}else if(scene==='running'){html=`<div class="hm-date">今天 · 刚刚</div>${user('整理本周的项目进展，告诉我完成了什么、还有哪些待办。')}${head()}<div class="hm-answer"><p>我会检查本周的项目记录，再整理完成事项和需要跟进的问题。</p></div>`}else{const data=scene==='reading'?['简单介绍一下 Agent 是怎么完成一项任务的。','从目标到结果，每一步都有记录。','收到任务后，我会先理解你的目标，再按需要读取资料、使用工具，并检查结果。','如果某一步需要额外授权，会先停下来向你确认。你可以展开执行记录，查看具体做了什么。']:scene==='notes'?['我希望记忆能帮我减少重复解释，又能随时查看和修改。','让记忆可见，也可由你决定。','可以把长期偏好、项目背景和临时任务信息分开，避免把一次性的要求当成长期习惯。','每条记忆保留来源和更新时间，你可以逐条修正或删除。']:['把我的阅读笔记整理成一个便于回看的结构。','按问题组织，比按日期堆放更容易回看。','可以围绕“我想解决什么问题”建立主题，每篇笔记保留核心观点、证据和自己的疑问。','之后回到某个主题，就能看到观点是如何逐渐形成和变化的。'];html=`<div class="hm-date">昨天</div>${user(data[0])}${head()}${simpleThinking()}<div class="hm-answer"><h3>${data[1]}</h3><p>${data[2]}</p><p>${data[3]}</p></div>${actionbar()}`}

eMenus();S.threadTitle=S.threadTitle+' · 分支';q('.hm-title').textContent=S.threadTitle;toast('已创建示例分支，保留当前对话内容')}else if(a==='rename'){showDrawer('重命名对话',`<label for="hm-rename">对话标题</label><input id="hm-rename" class="hm-searchbox" style="margin:10px 0 14px" value="${esc(S.threadTitle)}"><button class="hm-primary" data-action="save-name">保存名称</button>`);q('#hm-rename').focus()}else if(a==='save-name'){const v=q('#hm-rename').value.trim();if(!v)return;S.threadTitle=v;q('.hm-title').textContent=v;const active=q('.hm-thread[aria-current="true"] span:first-child');if(active)active.textContent=v;q('.hm-drawer').hidden=true;toast('对话已重命名')}else if(a==='pin'){const active=q('.hm-thread[aria-current="true"]');if(active)q('.hm-threads').prepend(active);closeMenus();toast('已将当前对话置顶')}else if(a==='archive'){const active=q('.hm-thread[aria-current="true"]');if(active)active.hidden=true;setScene('new');toast('对话已归档（示例）')}else if(a==='attach')q('.hm-file-input').click();else if(a==='remove-attachment'){S.attachment='';q('.hm-attachment').hidden=true;q('.hm-file-input').value=''}else if(a==='approve'){S.waiting=false;stopClock();q('.hm-approval').innerHTML='<div class="hm-approval-head">'+icon('check')+'已允许本次读取</div>';q('.hm-count').textContent='0';q('.hm-approval-process')?.remove();startStreaming('approval',false);toast('这是模拟批准，没有发生真实授权')}else if(a==='deny'){stopClock();S.waiting=false;const pending=q('.hm-approval-process .hm-event[data-status="waiting"]');if(pending){pending.dataset.status='stopped';pending.querySelector('.hm-event-status').textContent='已拒绝';pending.querySelector('.hm-event-detail pre:last-child').textContent='没有执行该工具';q('.hm-approval-process .hm-turn-result').textContent='已停止'}q('.hm-approval').innerHTML='<div class="hm-approval-head">'+icon('shield-x')+'已拒绝 · 没有访问该站点</div>';q('.hm-transcript').insertAdjacentHTML('beforeend','<p class="hm-small hm-muted">可以把文档内容贴到对话中，我会根据你提供的内容继续。</p>');S.stopped=true;runtime();q('.hm-count').textContent='0'}else if(a==='approval-detail'){showDrawer('本次访问请求',`<span class="hm-badge">等待确认 · 示例</span><h3 style="margin-top:20px">读取迁移指南</h3><dl><dt>目标</dt><dd>docs.example.com/migration</dd><dt>方式</dt><dd>只读网页请求</dd><dt>有效期</dt><dd>一次操作</dd><dt>提交内容</dt><dd>不提交文件或表单</dd></dl><p class="hm-muted">这里应展示后端提供的准确授权范围。本原型不创建真实 Grant。</p>`)}else if(a==='reconnect'){const pending=q('.hm-event[data-status="unknown"]');if(pending){pending.dataset.status='complete';pending.querySelector('.hm-event-status').textContent='完成';pending.querySelector('.hm-event-detail pre:last-child').textContent='已同步结果：工作区可以正常访问。';q('.hm-turn-result').textContent='已完成 · 00:23'}S.offline=false;q('.hm-offline').hidden=true;S.activeMs=23000;q('.hm-transcript').insertAdjacentHTML('beforeend','<div class="hm-answer"><p>连接已恢复。工作区检查已经完成，服务可以正常访问。</p></div>');runtime();toast('已恢复连接（模拟），草稿仍然保留');scrollEnd(true)}else if(a==='changes'){showDrawer('本次改动',`<h3>3 个文件</h3><p class="hm-muted">以下内容为视觉示例。</p><button class="hm-menu-option">notification-service.ts <span class="hm-spacer"></span><span class="hm-diffadd">+24</span></button><button class="hm-menu-option">notification-store.ts <span class="hm-spacer"></span><span class="hm-diffadd">+8</span></button><button class="hm-menu-option">notification.test.ts <span class="hm-spacer"></span><span class="hm-diffadd">+6</span></button><pre><span class="hm-diffdel">− await send(event)</span>\n<span class="hm-diffadd">+ if (await wasSent(event.id)) {\n+   return existingReceipt\n+ }\n+ await sendOnce(event)</span></pre><p class="hm-muted">执行细节与产物按需打开，聊天保持可阅读的宽度。</p>`)}else if(a==='workspace'){showDrawer('工作空间',`<h3>himawari-agent</h3><dl><dt>主机</dt><dd>Hermes</dd><dt>目录</dt><dd>himawari-agent</dd><dt>连接</dt><dd>在线 · 示例状态</dd></dl><h3>管理</h3>${[['任务与自动化','后台任务、计划和主动建议'],['知识与记忆','记忆、摘要与反思'],['连接与权限','主机、Worker、能力与授权'],['运行诊断','执行追踪、健康与部署']].map(([n,d])=>`<div style="padding:12px 0;border-top:1px solid var(--hm-line)">${n}<div class="hm-muted hm-small">${d}</div></div>`).join('')}`)}else if(a==='inbox'){showDrawer('收件箱',`<span class="hm-badge">今天</span><h3 style="margin-top:18px">任务完成通知</h3><p>“修复任务完成通知”已完成。</p><button class="hm-secondary" data-scene="complete">回到对话</button>`)}else if(a==='settings'){openSettings()}
icons();});
q('textarea').addEventListener('input',()=>{S.drafts[S.scene]=q('textarea').value;composer()});
q('textarea').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(S.running){const value=q('textarea').value.trim();if(value){q('.hm-transcript').insertAdjacentHTML('beforeend',`<div class="hm-in-turn-update">补充要求：${esc(value)}</div>`);q('textarea').value='';S.drafts[S.scene]='';toast('补充要求已加入本轮（模拟）');scrollEnd(true)}}else send()}});
q('.hm-searchbox').addEventListener('input',e=>{const term=e.target.value.trim().toLowerCase();let count=0;all('.hm-thread').forEach(t=>{t.hidden=!t.textContent.toLowerCase().includes(term);if(!t.hidden)count++});q('.hm-search-empty').hidden=count>0});
q('.hm-file-input').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;S.attachment=f.name;q('.hm-attachment span').textContent=f.name;q('.hm-attachment').hidden=false;toast('附件仅在本地预览，不上传')});
q('.hm-scroller').addEventListener('scroll',()=>{const s=q('.hm-scroller');S.scrollFollow=s.scrollHeight-s.scrollTop-s.clientHeight<65;q('.hm-jump').hidden=S.scrollFollow});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();q('.hm-drawer').hidden=true;root.dataset.sidebar='';q('.hm-scrim').hidden=true;if(S.running)send()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q('[data-action="search"]').click()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();setScene('new');q('textarea').focus()}if(['ArrowDown','ArrowUp'].includes(e.key)){const menu=e.target.closest('[role="menu"]');if(menu){e.preventDefault();const buttons=[...menu.querySelectorAll('button')];let i=buttons.indexOf(document.activeElement);buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}}});
root.addEventListener('click',e=>{if(!e.composedPath().some(n=>n instanceof Element&&n.matches('.hm-popover,[data-action="model"],[data-action="mode"],[data-action="more"],[data-action="appearance"]')))closeMenus()});
window.addEventListener('pagehide',()=>{stopClock();clearTimeout(S.toastTimer)});
appearance();setScene('complete');
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{appearance();if(prefs.scene!==S.scene)setScene(prefs.scene)}});tweak.addSelect(prefs,'theme',{label:'外观',options:[{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});tweak.addSelect(prefs,'accent',{label:'主题色',options:Object.entries(accentColors).map(([value,c])=>({label:c.label,value}))});tweak.addSelect(prefs,'scene',{label:'交互场景',options:[{label:'执行完成',value:'complete'},{label:'流式输出',value:'running'},{label:'等待审批',value:'approval'},{label:'断线恢复',value:'offline'},{label:'新对话',value:'new'}]});}
})();
</script>
