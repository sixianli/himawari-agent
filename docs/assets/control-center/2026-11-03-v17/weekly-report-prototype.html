<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校准周报原型</title>
<style>
*{box-sizing:border-box}
:root{--page:#e6e5e1;--bg:#fbfbfa;--card:#fff;--side:#f2f2f0;--tx:#1b1b1b;--mu:#707070;--ln:rgba(0,0,0,.11);--fill:rgba(0,0,0,.055);--ac:#1b1b1b;--on:#fff;--sun:#d4930f;--red:#c9372c;--red-soft:#fbe9e7;--amb:#a86400;--amb-soft:#fbf0dc;--scrim:rgba(0,0,0,.28);--sh:0 4px 18px rgba(0,0,0,.08);--sh-up:0 18px 50px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0b0b0b;--bg:#1c1c1c;--card:#262626;--side:#202020;--tx:#ececec;--mu:#9a9a9a;--ln:rgba(255,255,255,.11);--fill:rgba(255,255,255,.07);--ac:#ececec;--on:#1c1c1c;--sun:#efb23c;--red:#ef7d72;--red-soft:#41231f;--amb:#e0a54a;--amb-soft:#3a2f1c;--scrim:rgba(0,0,0,.5);--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme=dark]{--page:#0b0b0b;--bg:#1c1c1c;--card:#262626;--side:#202020;--tx:#ececec;--mu:#9a9a9a;--ln:rgba(255,255,255,.11);--fill:rgba(255,255,255,.07);--ac:#ececec;--on:#1c1c1c;--sun:#efb23c;--red:#ef7d72;--red-soft:#41231f;--amb:#e0a54a;--amb-soft:#3a2f1c;--scrim:rgba(0,0,0,.5);--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}
html,body{margin:0}
body{background:var(--page);color:var(--tx);font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans","Noto Sans CJK SC",system-ui,sans-serif;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:0 18px;border-radius:999px}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.ic{width:20px;height:20px;flex:none;display:block}
.banner{position:fixed;top:8px;right:8px;z-index:50;pointer-events:none;background:var(--ac);color:var(--on);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;opacity:.9}
.proto{max-width:1240px;margin:0 auto 14px;padding:10px 12px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--fill) 0 6px,transparent 6px 12px);font-size:12px;color:var(--mu)}
.proto>b{display:block;font-weight:600;margin:0 0 6px;color:var(--tx)}
.proto .ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.proto .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.proto .grp>span{margin-right:2px}
.pseg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.pseg button{min-height:28px;padding:0 10px;font-size:12px;border-radius:9px;color:var(--mu)}
.pseg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:600}
.frame{max-width:1240px;margin:0 auto;background:var(--bg);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.12);display:flex;gap:0;min-height:760px;overflow:hidden}
.side{width:240px;flex:none;margin:10px 0 10px 10px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:12px 8px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 12px;font-size:15px;font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 30%,transparent 31%),radial-gradient(circle,var(--fill) 0 70%,transparent 71%)}
.ni{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:14px;font-size:14px}
.ni .ic{width:19px;height:19px;color:var(--sun)}
.ni.sel{background:var(--fill);font-weight:600}
.side .grow{flex:1}
.main{flex:1;min-width:0;padding:20px 28px 40px}
.inner{max-width:900px;margin:0 auto}
.top{display:none}
h1{font-size:20px;margin:6px 0 0;font-weight:600}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--ln);margin:12px 0 18px}
.tabs button{min-height:0;border-radius:0;padding:8px 0;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button[aria-selected=true]{color:var(--tx);font-weight:600;border-color:var(--tx)}
.stub{color:var(--mu);padding:28px 0;text-align:center}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 0 var(--ln),0 0 0 1px var(--ln);padding:16px 18px;margin:0 0 16px}
.card>h2{font-size:15.5px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mu);font-size:13px;margin:0 0 10px}
.muted{color:var(--mu);font-size:12.5px}
.ver{color:var(--mu);font-size:11.5px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.headline{font-weight:600;font-size:14.5px;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.line{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:8px 12px;margin:12px 0 0;font-size:13.5px}
.line .ic{width:18px;height:18px;margin-top:1px}
.line.ok{background:var(--fill)}
.line.warn{background:var(--amb-soft);color:var(--amb)}
.line.bad{background:var(--red-soft);color:var(--red)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cell{min-height:0;padding:8px 8px 9px;border-radius:14px;background:var(--fill);text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.cell .dn{font-size:11.5px;color:var(--mu)}
.cell .dd{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.cell .st{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cell .st .ic{width:16px;height:16px}
.cell.fail,.cell.none{background:var(--red-soft);color:var(--red)}
.cell.fail .dn,.cell.none .dn{color:var(--red);opacity:.8}
.cell.blocked{background:var(--amb-soft);color:var(--amb)}
.cell.blocked .dn{color:var(--amb);opacity:.8}
.cell.future{background:transparent;box-shadow:inset 0 0 0 1px var(--ln);color:var(--mu);cursor:default}
.cell.future .st{font-weight:400}
button.cell:not(.future){box-shadow:0 1px 3px rgba(0,0,0,.08)}
button.cell[aria-expanded=true]{box-shadow:0 0 0 2px var(--tx)}
.today{white-space:nowrap;font-size:10.5px;background:var(--ac);color:var(--on);border-radius:999px;padding:0 6px;margin-left:4px;font-weight:600}
.detail{margin:12px 0 0;background:var(--fill);border-radius:14px;padding:12px 14px}
.detail h3,.sheet h3{font-size:14px;margin:0 0 6px;font-weight:600}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px}
.checks li .ic{width:18px;height:18px;margin-top:1px}
.checks li.fail{color:var(--red)}
.checks li.blocked{color:var(--amb)}
.detail .close{margin-top:6px;min-height:36px;padding:0 14px;background:var(--card);font-size:13px}
.datef{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 0}
.datef label{font-size:13px;color:var(--mu)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--fill);border-radius:999px;padding:3px}
.stepper button{min-height:38px;width:38px;padding:0;display:grid;place-items:center;border-radius:50%}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:9.5em;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.bp{background:var(--ac);color:var(--on);font-weight:600}
.bs{background:var(--fill)}
.lk{display:inline-flex;align-items:center;gap:6px;background:var(--fill);min-height:36px;padding:0 14px;font-size:13px}
.lk .ic{width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--mu);text-align:left;padding:6px 8px;vertical-align:bottom}
td{padding:10px 8px;border-top:1px solid var(--ln);vertical-align:top;font-size:13.5px}
th:first-child,td:first-child{padding-left:0}
td.num,th.num{text-align:right}
td .iv{display:block;font-size:11.5px;color:var(--mu)}
td.few{color:var(--mu)}
.rd{display:block;font-size:12px;line-height:1.45;color:var(--mu);max-width:22em;margin:2px 0 0;font-weight:400}
.rs{display:flex;flex-wrap:wrap;gap:6px 32px}
.rs .r{min-width:0}
.rl{color:var(--mu);margin-right:6px}
td .iv{display:block;font-size:11.5px;color:var(--mu)}
tr.sub td:first-child{padding-left:14px;color:var(--mu)}
.otherrow td{padding:8px 0}
.otherrow .lk{margin-top:2px}
.tcards{display:none}
.how{margin:12px 0 0;border-radius:14px;background:var(--fill)}
.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 14px;min-height:40px;font-size:13px}
.how summary::-webkit-details-marker{display:none}
.how summary .ic{width:16px;height:16px;transition:transform .15s}
.how[open] summary .ic{transform:rotate(90deg)}
.how ul{margin:0;padding:0 16px 12px 34px;font-size:13px;color:var(--mu)}
.how li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--fill);border-radius:14px;padding:10px 12px;min-width:0}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:12.5px;color:var(--mu);overflow-wrap:anywhere}
.tile .x{font-size:11.5px;color:var(--mu);margin-top:2px}
.note{margin:10px 0 0;color:var(--mu);font-size:12.5px}
.muse{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.musefoot{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;font-size:13px;font-variant-numeric:tabular-nums}
.empty{background:var(--fill);border-radius:12px;padding:10px 12px;color:var(--mu);font-size:13px}
.foot{display:flex;justify-content:center;margin:4px 0 0}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.dlg{position:fixed;z-index:61;background:var(--card);box-shadow:var(--sh-up);padding:18px 20px 20px;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));border-radius:22px}
.dlg h3{font-size:16px;margin:0 0 6px}
.dlg p{margin:0 0 8px;color:var(--mu);font-size:13.5px}
.dlg p.strong{color:var(--tx);font-weight:600}
.br{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.grab{display:none;width:38px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 60px);overflow:auto}
.sheet .grab{display:block}
.sheet .wide{width:100%;margin-top:10px}
@media (max-width:640px){
 body{padding:8px 0 24px}
 .proto{margin:0 8px 10px;border-radius:12px}
 .frame{border-radius:0;box-shadow:none;min-height:0;display:block}
 .side{display:none}
 .main{padding:0 16px 28px}
 .top{display:flex;align-items:center;justify-content:space-between;position:relative;padding:6px 0}
 .rb{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
 .rb.ghost{visibility:hidden}
 .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;white-space:nowrap}
 h1{display:none}
 .tabs{margin-top:6px}
 .card{padding:14px 14px;border-radius:16px}
 .days{grid-template-columns:1fr;gap:6px}
 .cell{flex-direction:row;align-items:center;gap:8px;padding:0 12px;min-height:44px;width:100%}
 .cell .dn{flex:none;white-space:nowrap}
 .cell .dd{flex:1;min-width:0;white-space:nowrap}
 .cell .st{flex:none;max-width:50%;text-align:right}
 .detail{display:none}
 table{display:none}
 .tcards{display:block}
 .tc{background:var(--fill);border-radius:14px;padding:10px 12px;margin:0 0 8px}
 .tc h3{font-size:14px;margin:0 0 4px;font-weight:600}
 .tc .m{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
 .tc .m:first-of-type{border-top:0}
 .tc .m>span:first-child{color:var(--mu);min-width:0;flex:1}
 .tc .m>span:last-child{text-align:right;font-variant-numeric:tabular-nums;flex:none}
 .tc .m.few>span:last-child{color:var(--mu)}
 .tc .m .iv{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap}
 .tc.sub{margin-left:0}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .muse{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stepper output{min-width:8.5em;font-size:16px}
 .dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
 .dlg .grab{display:block}
 .dlg .br{flex-direction:column-reverse}
 .dlg .br button{width:100%}
}
#dev.phone{width:410px;max-width:100%;height:864px;margin:0 auto;border:10px solid #0d0d0d;border-radius:48px;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 16px 40px rgba(0,0,0,.22)}
#dev.phone .screen{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:10px}
#dev.phone .screen::-webkit-scrollbar{display:none}
#dev.phone .scrim,#dev.phone .sheet,#dev.phone .dlg{position:absolute}
#dev.phone .sheet{max-height:calc(100% - 60px);padding-bottom:18px}
#dev.phone .dlg{padding-bottom:18px}
#dev.phone .frame{border-radius:0;box-shadow:none;min-height:0;display:block}
#dev.phone .side{display:none}
#dev.phone .main{padding:0 16px 28px}
#dev.phone .top{display:flex;align-items:center;justify-content:space-between;position:relative;padding:6px 0}
#dev.phone .rb{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#dev.phone .rb.ghost{visibility:hidden}
#dev.phone .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;white-space:nowrap}
#dev.phone h1{display:none}
#dev.phone .tabs{margin-top:6px}
#dev.phone .card{padding:14px 14px;border-radius:16px}
#dev.phone .days{grid-template-columns:1fr;gap:6px}
#dev.phone .cell{flex-direction:row;align-items:center;gap:8px;padding:0 12px;min-height:44px;width:100%}
#dev.phone .cell .dn{flex:none;white-space:nowrap}
#dev.phone .cell .dd{flex:1;min-width:0;white-space:nowrap}
#dev.phone .cell .st{flex:none;max-width:50%;text-align:right}
#dev.phone .detail{display:none}
#dev.phone table{display:none}
#dev.phone .tcards{display:block}
#dev.phone .tc{background:var(--fill);border-radius:14px;padding:10px 12px;margin:0 0 8px}
#dev.phone .tc h3{font-size:14px;margin:0 0 4px;font-weight:600}
#dev.phone .tc .m{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
#dev.phone .tc .m:first-of-type{border-top:0}
#dev.phone .tc .m>span:first-child{color:var(--mu);min-width:0;flex:1}
#dev.phone .tc .m>span:last-child{text-align:right;font-variant-numeric:tabular-nums;flex:none}
#dev.phone .tc .m.few>span:last-child{color:var(--mu)}
#dev.phone .tc .m .iv{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap}
#dev.phone .tc.sub{margin-left:0}
#dev.phone .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
#dev.phone .muse{grid-template-columns:repeat(2,minmax(0,1fr))}
#dev.phone .stepper output{min-width:8.5em;font-size:16px}
#dev.phone .dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#dev.phone .dlg .grab{display:block}
#dev.phone .dlg .br{flex-direction:column-reverse}
#dev.phone .dlg .br button{width:100%}
</style>
</head>
<body>
<div class="banner" id="banner">原型 · 演示数据</div>
<div class="proto" id="proto"></div>
<div id="dev"><div class="screen" id="screen"><div class="frame" id="frame"></div></div><div id="overlay"></div></div>

function stateInfo(){if(ST.state==="a")return {kind:"none"};if(ST.state==="b0")return {kind:"wait"};if(ST.state==="b1"||ST.state==="b2")return {kind:"part"};return {kind:"done"}}
function renderProto(){
 const s=(k,opts)=>`<span class="pseg">${opts.map(([v,l])=>`<button type="button" data-p="${k}" data-v="${v}" aria-pressed="${ST[k]===v}">${l}</button>`).join("")}</span>`;
 document.getElementById("proto").innerHTML=`<b>原型控制（不属于页面）</b><div class="ctl">
 <span class="grp"><span>观察期</span>${s("state",[["a","未设起点"],["b1","观察中"],["b2","观察中 · 有没通过的天"],["c1","已出周报 · 全部通过"],["c2","已出周报 · 中途失败"]])}</span>
 <span class="grp"><span>Muse 对照</span>${s("muse",[["none","没有条目"],["demo","演示数字"]])}</span>
 <span class="grp"><span>语言</span>${s("lang",[["zh","中文"],["en","English"],["ja","日本語"]])}</span>
 <span class="grp"><span>${{zh:"设备",en:"Device",ja:"端末"}[ST.lang]}</span>${s("device",[["desktop",{zh:"电脑",en:"Desktop",ja:"PC"}[ST.lang]],["phone",{zh:"手机",en:"Phone",ja:"スマホ"}[ST.lang]]])}</span>
 <span class="grp"><span>主题</span>${s("theme",[["light","浅色"],["dark","深色"]])}</span></div>`;
}
function side(){const t=T();return `<nav class="side" aria-label="nav"><div class="brand"><span class="dot"></span>Himawari</div><div class="ni">${G.newc}${t.navNew}</div><div class="ni">${G.mem}${t.navMem}</div><div class="ni sel" aria-current="page">${G.rem}${t.navRem}</div><div class="ni">${G.file}${t.navFile}</div><div class="grow"></div><div class="ni">${G.set}${t.navSet}</div></nav>`}
function cellsHTML(d){const t=T();return `<div class="days">${d.cells.map((c,i)=>{const n=d.start+i,s=c[0],isToday=n===d.today,lab=`<span class="dn">${t.dayN(i+1)}${isToday?`<span class="today">${t.today}</span>`:""}</span><span class="dd">${fd(n)}</span><span class="st">${G[s==="pass"?"check":s]}${t.st[s]}</span>`;
 if(s==="future")return `<div class="cell future">${lab}</div>`;
 return `<button type="button" class="cell ${s}" data-day="${i}" aria-expanded="${ST.openDay===i}">${lab}</button>`}).join("")}</div>`}
function checksHTML(list){const t=T();return `<ul class="checks">${list.map(([k,key,a,b])=>{const f=t.ck[key];const txt=typeof f==="function"?f(a,b):f;const g=k==="ok"?G.check:k==="fail"?G.fail:G.blocked;return `<li class="${k}">${g}<span>${txt}</span></li>`}).join("")}</ul>`}
function detailTitle(d,i){const t=T(),c=d.cells[i];return t.detailTitle(i+1,fd(d.start+i),t.st[c[0]])}
function obsCard(){
 const t=T();let h=`<section class="card"><h2>${t.obsTitle}</h2>`;
 if(ST.state==="a"){
  h+=`<p class="sub">${t.obsExplain}</p><div class="datef"><label id="sl">${t.startLabel}</label><span class="stepper" role="group" aria-labelledby="sl"><button type="button" data-step="-1" aria-label="${t.prevDay}" ${ST.pick<=6?"disabled":""}>${G.chevl}</button><output>${fd(ST.pick)} · ${fw(ST.pick)}</output><button type="button" data-step="1" aria-label="${t.nextDay}">${G.chev}</button></span><button type="button" class="bp" data-act="start">${t.startBtn}</button></div>`;
 } else if(ST.state==="b0"){
  h+=`<p class="headline">${t.headWait(fd(ST.start),fd(ST.start+7))}</p>`;
  h+=cellsHTML({start:ST.start,today:5,cells:Array(7).fill(["future"])});
 } else {
  const d=DAYS[ST.state];
  if(ST.state==="b1")h+=`<p class="headline">${t.headIn(fd(d.start),d.today-d.start+1,fd(d.start+7))}</p>`;
  if(ST.state==="b2")h+=`<p class="headline">${t.headInBad(fd(d.start),d.today-d.start+1)}</p>`;
  if(ST.state==="c1"||ST.state==="c2")h+=`<p class="headline">${t.headDone(fd(d.start),fd(d.start+6))}</p>`;
  h+=cellsHTML(d);
  if(ST.openDay!==null&&!isPhone()){const c=d.cells[ST.openDay];h+=`<div class="detail" role="region"><h3>${detailTitle(d,ST.openDay)}</h3>${checksHTML(c[1])}<button type="button" class="close" data-act="closeDay">${t.close}</button></div>`}
  if(ST.state==="b2")h+=`<div class="line bad">${G.none}<span>${t.badLine(fd(7),fd(9))}</span></div>`;
  if(ST.state==="c1")h+=`<div class="line ok">${G.check}<span>${t.allPass}</span></div>`;
  if(ST.state==="c2")h+=`<div class="line warn">${G.fail}<span>${t.restart(fd(9),4)}</span></div>`;
 }
 h+=`<p class="ver">${t.version("41a6ce3")}</p></section>`;return h;
}
function ratioCells(x,r){const t=T();const [,rev,ks]=r;if(rev<5)return {few:t.few(rev)};const labels=t.rl[LBL[x]];return {vals:ks.map((k,i)=>{const [lo,hi]=wilson(k,rev);return {label:labels[i],main:t.ratio(pct(k/rev),k,rev),iv:t.iv(pct(lo),pct(hi))}})}}
function tableCard(){
 const t=T(),k=stateInfo().kind,nf=n=>new Intl.NumberFormat(LOC[ST.lang]).format(n);
 let h=`<section class="card"><h2>${t.typeTitle}</h2>`;
 if(k==="none"||k==="wait"){h+=`<p class="empty">${t.notStarted}</p></section>`;return h}
 const d=DAYS[ST.state];
 const rows=MAIN.map(x=>[x,0]).concat(ST.otherOpen?OTHER.map(x=>[x,1]):[]);
 if(k==="part"){
  h+=`<p class="sub">${t.scopeIn(fd(d.start))}</p><p class="empty">${t.notFull}</p>`;
  h+=`<table><thead><tr><th>${t.cols[0]}</th><th class="num">${t.cols[1]}</th><th class="num">${t.cols[2]}</th></tr></thead><tbody>${rows.map(([x,sub])=>`<tr class="${sub?"sub":""}"><td>${t.types[x]}${t.typeDesc[x]?`<span class="rd">${t.typeDesc[x]}</span>`:""}</td><td class="num">${nf(TD.part[x][0])}</td><td class="num">${nf(TD.part[x][1])}</td></tr>`).join("")}<tr class="otherrow"><td colspan="3">${otherBtn()}</td></tr></tbody></table>`;
  h+=`<div class="tcards">${rows.map(([x])=>`<div class="tc"><h3>${t.types[x]}</h3>${t.typeDesc[x]?`<p class="rd">${t.typeDesc[x]}</p>`:""}<div class="m"><span>${t.cols[1]}</span><span>${nf(TD.part[x][0])}</span></div><div class="m"><span>${t.cols[2]}</span><span>${nf(TD.part[x][1])}</span></div></div>`).join("")}${otherBtn()}</div>`;
  h+=howBlock()+`</section>`;return h;
 }
 h+=`<p class="sub">${t.scopeDone(fd(d.start),fd(d.start+6))}</p>`;
 h+=`<table><thead><tr><th>${t.cols[0]}</th><th class="num">${t.cols[1]}</th><th class="num">${t.cols[2]}</th><th>${t.cols[3]}</th></tr></thead><tbody>${rows.map(([x,sub])=>{const r=TD.done[x],rc=ratioCells(x,r);return `<tr class="${sub?"sub":""}"><td>${t.types[x]}${t.typeDesc[x]?`<span class="rd">${t.typeDesc[x]}</span>`:""}</td><td class="num">${nf(r[0])}</td><td class="num">${nf(r[1])}</td>${rc.few?`<td class="few">${rc.few}</td>`:`<td><div class="rs">${rc.vals.map(v=>`<div class="r"><span class="rl">${v.label}</span>${v.main}<span class="iv">${v.iv}</span></div>`).join("")}</div></td>`}</tr>`}).join("")}<tr class="otherrow"><td colspan="4">${otherBtn()}</td></tr></tbody></table>`;
 h+=`<div class="tcards">${rows.map(([x])=>{const r=TD.done[x],rc=ratioCells(x,r);return `<div class="tc"><h3>${t.types[x]}</h3>${t.typeDesc[x]?`<p class="rd">${t.typeDesc[x]}</p>`:""}<div class="m"><span>${t.cols[1]}</span><span>${nf(r[0])}</span></div><div class="m"><span>${t.cols[2]}</span><span>${nf(r[1])}</span></div>${rc.few?`<div class="m few"><span>${t.cols[3]}</span><span>${rc.few}</span></div>`:rc.vals.map(v=>`<div class="m"><span>${v.label}</span><span>${v.main}<span class="iv">${v.iv}</span></span></div>`).join("")}</div>`}).join("")}${otherBtn()}</div>`;
 h+=howBlock()+`</section>`;return h;
}
function otherBtn(){const t=T();return `<button type="button" class="lk" data-act="other" aria-expanded="${ST.otherOpen}">${t.other(OTHER.length)} · ${ST.otherOpen?t.collapse:t.expand}</button>`}
function howBlock(){const t=T();return `<details class="how" ${ST.howOpen?"open":""}><summary>${G.chev}${t.how}</summary><ul>${t.howItems.map(x=>`<li>${x}</li>`).join("")}</ul></details>`}
function statsCard(){
 const t=T(),k=stateInfo().kind,key=k==="done"?"done":k==="part"?"part":"none",v=STATS[key],nf=n=>new Intl.NumberFormat(LOC[ST.lang]).format(n);
 let scope=t.scopeLast7;if(k==="done"){const d=DAYS[ST.state];scope=t.scopeDone(fd(d.start),fd(d.start+6))}if(k==="part")scope=t.scopeIn(fd(DAYS[ST.state].start));
 return `<section class="card"><h2>${t.statTitle}</h2><p class="sub">${scope}</p><div class="stats"><div class="tile"><div class="v">${nf(v[0])}</div><div class="l">${t.m.spoke}</div></div><div class="tile"><div class="v">${nf(v[1])}</div><div class="l">${t.m.hits}</div></div><div class="tile"><div class="v">${nf(v[2])}</div><div class="l">${t.m.misfires}</div></div><div class="tile"><div class="v">${nf(v[3])}</div><div class="l">${t.m.missed}</div><div class="x">${t.m.reviewed(nf(v[4]))}</div></div></div><p class="note">${t.statNote}</p></section>`;
}
function museCard(){
 const t=T(),nf=n=>new Intl.NumberFormat(LOC[ST.lang]).format(n);
 let h=`<section class="card"><h2>${t.museTitle}</h2>`;
 if(ST.muse==="none"){h+=`<p class="empty">${t.museEmpty}</p></section>`;return h}
 const m=MUSE,total=m.both+m.museOnly+m.himaOnly+m.neither+m.noRec+m.unpaired,paired=total-m.unpaired;
 h+=`<div class="muse">${["both","museOnly","himaOnly","neither","noRec"].map(x=>`<div class="tile"><div class="v">${nf(m[x])}</div><div class="l">${t.mu[x]}</div></div>`).join("")}</div>`;
 h+=`<div class="musefoot"><span>${t.mu.unpaired} <b>${nf(m.unpaired)}</b></span><span>${t.mu.rate} <b>${t.ratio(pct(paired/total),paired,total)}</b></span></div><p class="note">${t.museDef}</p></section>`;
 return h;
}
function isPhone(){return ST.device==="phone"||window.matchMedia("(max-width:640px)").matches}
function renderFrame(){
 const t=T();document.getElementById("dev").className=ST.device==="phone"?"phone":"";document.documentElement.lang=LOC[ST.lang];document.documentElement.dataset.theme=ST.theme;
 document.getElementById("banner").textContent=t.banner;
 let body;
 if(ST.tab==="rem")body=`<p class="stub">${t.stub}</p>`;
 else body=obsCard()+tableCard()+statsCard()+museCard()+`<div class="foot"><button type="button" class="lk" data-act="goRem">${t.goRate}${G.arrow}</button></div>`;
 document.getElementById("frame").innerHTML=`${side()}<main class="main"><div class="inner"><div class="top"><button type="button" class="rb" aria-label="menu">${G.menu}</button><b class="ttl">${t.title}</b><span class="rb ghost"></span></div><h1>${t.title}</h1><div class="tabs" role="tablist"><button type="button" role="tab" data-tab="rem" aria-selected="${ST.tab==="rem"}">${t.tabRem}</button><button type="button" role="tab" data-tab="report" aria-selected="${ST.tab==="report"}">${t.tabRep}</button></div>${body}</div></main>`;
 renderOverlay();
}
function renderOverlay(){
 const t=T(),o=document.getElementById("overlay");
 if(ST.confirm){o.innerHTML=`<div class="scrim" data-act="cancel"></div><div class="dlg" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div><h3>${t.confirmTitle(fd(ST.pick))}</h3><p class="strong">${t.confirmFixed}</p><p>${t.confirmEarliest(fd(6),fd(5))}</p><div class="br"><button type="button" class="bs" data-act="cancel">${t.cancel}</button><button type="button" class="bp" data-act="ok">${t.confirm}</button></div></div>`;o.querySelector(".dlg").focus();return}
 if(ST.openDay!==null&&isPhone()&&DAYS[ST.state]){const d=DAYS[ST.state],c=d.cells[ST.openDay];o.innerHTML=`<div class="scrim" data-act="closeDay"></div><div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div><h3>${detailTitle(d,ST.openDay)}</h3>${checksHTML(c[1])}<button type="button" class="bs wide" data-act="closeDay">${t.closeSheet}</button></div>`;o.querySelector(".sheet").focus();return}
 o.innerHTML="";
}
function render(){renderProto();renderFrame()}
document.addEventListener("click",e=>{
 const p=e.target.closest("[data-p]");if(p){ST[p.dataset.p]=p.dataset.v;if(p.dataset.p==="state"){ST.openDay=null;ST.confirm=false;ST.tab="report"}render();return}
 const tb=e.target.closest("[data-tab]");if(tb){ST.tab=tb.dataset.tab;ST.openDay=null;render();return}
 const dy=e.target.closest("[data-day]");if(dy){const i=+dy.dataset.day;ST.openDay=ST.openDay===i?null:i;render();return}
 const st=e.target.closest("[data-step]");if(st){ST.pick=Math.max(6,ST.pick+ +st.dataset.step);render();return}
 const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
 if(act==="start")ST.confirm=true;
 if(act==="cancel")ST.confirm=false;
 if(act==="ok"){ST.confirm=false;ST.start=ST.pick;ST.state="b0"}
 if(act==="closeDay")ST.openDay=null;
 if(act==="other")ST.otherOpen=!ST.otherOpen;
 if(act==="goRem"){ST.tab="rem";window.scrollTo(0,0);document.getElementById("screen").scrollTop=0}
 render();
});
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("how"))ST.howOpen=e.target.open},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ST.confirm||ST.openDay!==null)){ST.confirm=false;ST.openDay=null;render()}});
window.matchMedia("(max-width:640px)").addEventListener("change",()=>renderFrame());
const q=new URLSearchParams(location.search);["device","state","muse","lang","theme","tab"].forEach(k=>{if(q.get(k))ST[k]=q.get(k)});if(q.get("day"))ST.openDay=+q.get("day");if(q.get("other"))ST.otherOpen=true;if(q.get("how"))ST.howOpen=true;if(q.get("confirm"))ST.confirm=true;
render();
</script>
</body>
</html>
