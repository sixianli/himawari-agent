w-workspace{flex:1;min-width:0;display:flex;flex-direction:column}#hw-review .hw-header{height:61px;flex:none;display:flex;align-items:center;gap:10px;padding:0 23px;border-bottom:1px solid var(--hw-line)}#hw-review .hw-header h1{flex:1;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}#hw-review .hw-body{display:flex;flex:1;min-height:0;position:relative}#hw-review .hw-main{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0}#hw-review .hw-transcript{overflow:auto;flex:1;min-height:0;padding:30px 30px 20px;scrollbar-width:thin}#hw-review .hw-transcript-inner{max-width:680px;margin:auto}#hw-review .hw-empty{height:100%;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding-bottom:40px}#hw-review .hw-empty h2{font-size:25px;letter-spacing:-.5px}#hw-review .hw-owner{max-width:88%;margin:0 0 30px auto;background:var(--hw-raised);padding:12px 17px;border-radius:16px 16px 4px 16px;width:fit-content}#hw-review .hw-agent-label{display:flex;gap:8px;align-items:center;margin-bottom:16px}#hw-review .hw-agent-label img{height:20px;width:20px;border-radius:4px}#hw-review .hw-process{color:var(--hw-muted);font-size:12px;margin:0 0 16px 28px}#hw-review .hw-answer{margin-left:28px}#hw-review .hw-answer p+p{margin-top:12px}#hw-review .hw-approval{border:1px solid var(--hw-line);border-radius:13px;background:var(--hw-panel);padding:18px;margin:17px 0 20px 28px}#hw-review .hw-approval h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}#hw-review .hw-approval p{color:var(--hw-muted);margin:8px 0 14px}#hw-review .hw-approval dl{display:grid;grid-template-columns:60px 1fr;gap:5px 12px;margin:12px 0 18px;font-size:13px}#hw-review dt{color:var(--hw-muted)}#hw-review dd{margin:0;overflow-wrap:anywhere}#hw-review .hw-actions{display:flex;gap:8px;flex-wrap:wrap}#hw-review .hw-file{border:1px solid var(--hw-line);padding:12px 16px;justify-content:flex-start;margin:16px 0 0;max-width:100%}#hw-review .hw-file small{display:block;color:var(--hw-muted);font-size:11px;text-align:left}#hw-review .hw-composer-wrap{padding:12px 30px 18px;width:100%;max-width:740px;margin:auto}#hw-review .hw-composer{border:1px solid var(--hw-line);background:var(--hw-input);border-radius:19px;padding:4px;position:relative}#hw-review .hw-composer:focus-within{border-color:var(--hw-focus)}#hw-review .hw-composer textarea,#hw-review .hw-composer textarea:focus{display:block;resize:none;border:0;box-shadow:none;outline:none;background:transparent;padding:14px 15px 6px;min-height:88px;border-radius:16px;font-size:14px}#hw-review .hw-tools{display:flex;align-items:center;padding:4px 7px 5px;gap:3px}#hw-review .hw-model{margin-left:auto;display:flex;gap:4px;align-items:center;min-width:0}#hw-review .hw-model button{font-size:12px;color:var(--hw-muted);white-space:nowrap}#hw-review .hw-send{background:var(--hw-text);color:var(--hw-bg);border-radius:10px;width:34px;min-height:34px;padding:7px;margin-left:5px}#hw-review .hw-hint{font-size:11px;color:var(--hw-muted);display:flex;justify-content:space-between;gap:10px;padding:8px 4px 0}#hw-review .hw-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--hw-panel);border-bottom:1px solid var(--hw-line);font-size:12px}#hw-review .hw-banner button{font-size:12px;flex:none}#hw-review .hw-input-status{font-size:12px;padding:0 4px 8px;color:var(--hw-muted)}

<style>

#hw-review .hw-run{width:7px;height:11px;flex:none;color:var(--hw-muted);display:inline-flex;justify-content:center;overflow:visible}
#hw-review .hw-run svg{width:11px;height:11px;flex:none}
#hw-review .hw-mode-line{display:flex;align-items:center;gap:6px;width:fit-content;min-height:28px;padding:3px 8px;margin:0 0 6px 2px;font-size:12px;color:var(--hw-muted);border-radius:8px}
#hw-review .hw-mode-line svg{width:14px;height:14px}
#hw-review .hw-env-pop{max-height:min(560px,calc(100vh - 260px));overflow:auto;position:absolute;left:0;bottom:calc(100% + 8px);z-index:9;width:440px;max-width:100%;padding:16px 18px 12px;border:1px solid var(--hw-line);border-radius:18px;background:var(--hw-panel);box-shadow:0 12px 35px #0004;font-size:13px}
#hw-review .hw-env-pop h3{font-size:14px;margin-bottom:4px}
#hw-review .hw-env-section{padding:12px 0;border-bottom:1px solid var(--hw-line)}
#hw-review .hw-env-section:last-child{border:0;padding-bottom:4px}
#hw-review .hw-env-section>strong{display:block;margin-bottom:6px}
#hw-review .hw-env-section p{font-size:12px;color:var(--hw-muted);margin-top:4px}
#hw-review .hw-env-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
#hw-review .hw-env-list li{display:flex;align-items:center;gap:8px;min-height:38px;font-size:13px;border-radius:8px;padding:2px 4px}
#hw-review .hw-env-list li svg{width:16px;height:16px;color:var(--hw-muted)}
#hw-review .hw-env-list .hw-env-name{min-width:0;flex:1;overflow-wrap:anywhere;display:flex;flex-direction:column;line-height:1.45}
#hw-review .hw-env-list .hw-env-name small{font-size:11px;color:var(--hw-muted)}
#hw-review .hw-env-list .hw-env-meta{margin-left:auto;font-size:11px;color:var(--hw-muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
#hw-review .hw-env-list button{font-size:12px;min-height:30px;padding:4px 8px;margin-left:auto;color:var(--hw-muted);white-space:nowrap;flex:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;display:inline-flex}
#hw-review .hw-env-list button span{overflow:hidden;text-overflow:ellipsis}
#hw-review .hw-mode-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hw-line);border-radius:999px;padding:2px 10px;font-size:12px}
#hw-review .hw-step-refused{color:var(--hw-muted)}
#hw-review .hw-callout{margin:10px 0 0;font-size:12px;color:var(--hw-muted);line-height:1.7}
.hw-caption{max-width:1240px;margin:12px auto 0;font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:light-dark(#686868,#a5a5a5)}
.hw-caption strong{color:light-dark(#282828,#dedede);font-weight:500}
@media(max-width:560px){body{padding:8px}#hw-review .hw-env-pop{width:100%}}

};
const scenes=[["chat","状态条收起"],["pop","状态条展开"],["nav","手机：展开会话列表"],["idle","没有程序在运行"]];
const threads=[{id:"t1",title:"整理季度报表",running:1},{id:"t2",title:"周报草稿"},{id:"t3",title:"代码审查：登录模块",running:1},{id:"t4",title:"迁移脚本检查",pending:1},{id:"t5",title:"读书笔记"}];
const allPrograms=[{name:"bash",kind:"服务",icon:"server",thread:"整理季度报表",since:"12:04 开始"},{name:"bash",kind:"后台任务",icon:"terminal",thread:"代码审查：登录模块",since:"12:13 开始"}];let programs=allPrograms;
const unavailable=[{name:"bash",icon:"terminal",why:"只能在进程级沙箱（SRT）里运行"},{name:"read",icon:"file",why:"安装声明没有逐项写明可在容器里运行"}];
const $=s=>document.querySelector(s);
function modeText(m){return m==="strict"?{name:"严格模式",line:"每个工具都在本轮对话专用的容器里运行。",icon:"box"}:{name:"默认模式",line:"工具在本机的进程级沙箱（SRT）里运行，限制它能碰到的文件和网络。停止只保证工具的进程组已结束，离开进程组的程序可能仍在运行。",icon:"shield"}}
function sidebar(){
  const row=t=>{const mark=t.pending?'<span class="hw-dot" title="待你确认"></span>':(t.running&&programs.length?'<span class="hw-run" title="有程序在运行" aria-hidden="true">'+I.run+'</span>':'<span class="hw-space"></span>');
    const label=t.title+(t.pending?"，待你确认":"")+(t.running&&programs.length?"，有程序在运行":"");
    return '<div class="hw-row '+(t.id==="t1"?"active":"")+'"><button class="hw-thread" aria-label="'+label+'">'+mark+'<span class="hw-name">'+t.title+'</span></button></div>'};
  return '<aside class="hw-sidebar" aria-label="会话导航"><div class="hw-brand"><img src="'+LOGO+'" alt="">Himawari</div><div class="hw-nav"><button>'+I.plus+'新对话</button></div><div class="hw-history"><div class="hw-group">最近</div>'+threads.map(row).join("")+'</div></aside>'}
function timeline(mode){
  const steps=[["brain",'<span class="hw-kind">思考摘要</span>',"先启动开发服务器，再读取报表模板","完成","2.1s"],["server","<code>service</code>","启动开发服务器 npm run dev","正在执行","12:04"]];
  if(mode==="strict")steps.push(["terminal","<code>bash</code>","统计 reports/ 下的文件数量","严格模式下不可用","—"]);
  else steps.push(["terminal","<code>bash</code>","统计 reports/ 下的文件数量","完成","0.8s"]);
  return '<details class="hw-timeline" open><summary>'+I.down+'<span>思考 1 次 · 工具 2 次</span><span class="hw-total-state">执行中</span></summary><div class="hw-timeline-track">'+steps.map((s,i)=>'<details class="hw-step '+(s[3]==="严格模式下不可用"?"hw-step-refused":"")+'" data-state="'+(s[3]==="正在执行"?"running":"done")+'"><summary><span class="hw-node"></span>'+I[s[0]]+s[1]+'<span class="hw-step-title">'+s[2]+'</span><span class="hw-step-meta"><span>'+s[3]+'</span><time>'+s[4]+'</time></span></summary></details>').join("")+'</div></details>'}
function envPanel(mode,compact){
  const m=modeText(mode);
  const modeSec='<div class="hw-env-section"><strong>当前模式</strong><span class="hw-mode-badge">'+I[m.icon]+m.name+'</span><p>'+m.line+'</p><p>模式由安装配置决定，页面上不能切换。</p></div>';
  const runSec='<div class="hw-env-section"><strong>仍在运行的程序</strong>'+(programs.length?'<ul class="hw-env-list">'+programs.map(p=>'<li>'+I[p.icon]+'<span class="hw-env-name"><span><code>'+p.name+'</code></span><small>'+p.kind+' · '+p.since+'</small></span><button aria-label="打开所属对话：'+p.thread+'"><span>'+p.thread+'</span>'+I.right+'</button></li>').join("")+'</ul>':'<p>没有正在运行的程序。</p>')+'<p>要停止某个程序，打开它所属的对话，在那一轮的执行过程里操作。</p></div>';
  const unSec=mode==="strict"?'<div class="hw-env-section"><strong>严格模式下不可用的工具</strong><ul class="hw-env-list">'+unavailable.map(u=>'<li>'+I[u.icon]+'<span class="hw-env-name"><code>'+u.name+'</code></span><span class="hw-env-meta">'+u.why+'</span></li>').join("")+'</ul><p>工具内部再发起的子任务也不可用。调用这些工具时，对应步骤会显示“严格模式下不可用”，不会改用其他方式执行。</p></div>':'<div class="hw-env-section"><strong>工具可用情况</strong><p>默认模式下没有因为模式而不可用的工具。</p></div>';
  return (compact?"":'<h3>执行环境</h3>')+modeSec+runSec+unSec}
function composer(scene,mode){
  const m=modeText(mode);
  const line='<div style="position:relative"><button type="button" class="hw-mode-line" aria-expanded="'+(scene==="pop")+'">'+I[m.icon]+m.name+' · '+(programs.length?programs.length+' 个程序在运行':'没有程序在运行')+' '+I.down+'</button>'+(scene==="pop"?'<div class="hw-env-pop" role="dialog" aria-label="执行环境">'+envPanel(mode,true)+'</div>':'')+'</div>';
  return '<div class="hw-composer-wrap">'+line+'<form class="hw-composer"><textarea aria-label="输入消息" placeholder="有什么想交给 Himawari？" rows="3"></textarea><div class="hw-tools"><button type="button" class="hw-icon" aria-label="添加附件">'+I.plus+'</button><div class="hw-model"><button type="button">GLM 5.3 Flash '+I.down+'</button><button type="button">最低</button></div><button class="hw-send" type="button" disabled aria-label="发送消息">'+I.up+'</button></div></form><div class="hw-hint"><span>需要你确认的操作，会在当前对话中询问</span><span>Enter 发送 · Shift Enter 换行</span></div></div>'}
function render(){
  const mode=$("#mode").value,sc=$("#scene");
  if(!sc.options.length)sc.innerHTML=scenes.map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join("");
  const scene=sc.value;programs=scene==="idle"?[]:allPrograms;
  document.getElementById("hw-review").className=$("#theme").value==="light"?"light":"";
  document.documentElement.style.colorScheme=$("#theme").value;
  const app=$("#app");app.className="hw-app"+($("#width").value==="phone"||scene==="nav"?" phone":"");if(scene==="nav")app.dataset.nav="open";else delete app.dataset.nav;
  app.innerHTML=sidebar()+'<div class="hw-workspace"><header class="hw-header"><button class="hw-icon hw-mobile-nav" aria-label="展开会话列表">'+I.panel+'</button><h1>整理季度报表</h1><button class="hw-icon" aria-label="设置">'+I.settings+'</button></header><div class="hw-body"><main class="hw-main"><div class="hw-transcript"><div class="hw-transcript-inner"><div class="hw-owner">启动开发服务器，然后统计一下 reports 目录里有多少份报表。</div><div class="hw-flow-agent"><img src="'+LOGO+'" alt="">Himawari</div>'+timeline(mode)+'</div></div>'+composer(scene==="pop"?"pop":"chat",mode)+'</main></div></div>';
  $("#caption").innerHTML="<strong>v5 执行环境显示</strong>：输入框上方一行小字写着当前模式和仍在运行的程序数量，点开弹出面板，列出当前模式及含义、仍在运行的后台或服务程序（点对话名跳到所属对话）、严格模式下不可用的工具。侧栏里有程序在运行的会话，名字前有灰色转圈标记，和待你确认的红点同一位置、不同样子；读屏软件读出“有程序在运行”。程序只显示工具名、类型和开始时间，不显示命令内容。页面里的程序、对话、时间都是演示数据，不代表已实现。";
}
["scene","mode","theme","width"].forEach(id=>$("#"+id).addEventListener("change",render));
render();
</script>
