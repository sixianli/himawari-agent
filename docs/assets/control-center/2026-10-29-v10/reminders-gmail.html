<title>Himawari 提醒页原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#fcfcfb;--sidebar:#f3f3f0;--surface:#ffffff;--muted-surface:#f0f1ed;--hover:#ebebe7;--sel:#e8e8e4;
  --text:#252921;--muted:#72786b;--border:#e5e6df;--accent:#87539c;--accent-soft:#f3ebf6;
  --danger:#a73c30;--danger-soft:#f8ecea;--warning:#806013;--warning-soft:#f6f0e0;--success:#42682a;--dot:#b5382c;
  --demo:#3d3e37;--demo-text:#f0efe9;--demo-line:#6b6c63;--page:#e9e8e2;--shade:rgba(30,30,30,.36);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans","Noto Sans SC","Noto Sans JP","Helvetica Neue","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1e1e;--sidebar:#262626;--surface:#282828;--muted-surface:#343434;--hover:#303030;--sel:#383838;
  --text:#d4d4d4;--muted:#929292;--border:#343434;--accent:#d38ce2;--accent-soft:#3a2d3e;
  --danger:#efa095;--danger-soft:#3a2826;--warning:#d6b55d;--warning-soft:#342f22;--success:#accd88;--dot:#ef8a7e;
  --demo:#111110;--demo-text:#e6e5df;--demo-line:#55564f;--page:#151515;--shade:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1e1e;--sidebar:#262626;--surface:#282828;--muted-surface:#343434;--hover:#303030;--sel:#383838;
  --text:#d4d4d4;--muted:#929292;--border:#343434;--accent:#d38ce2;--accent-soft:#3a2d3e;
  --danger:#efa095;--danger-soft:#3a2826;--warning:#d6b55d;--warning-soft:#342f22;--success:#accd88;--dot:#ef8a7e;
  --demo:#111110;--demo-text:#e6e5df;--demo-line:#55564f;--page:#151515;--shade:rgba(0,0,0,.55);color-scheme:dark}
html,body{background:var(--page);color:var(--text);font-family:var(--font)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{max-width:1180px;margin:0 auto 12px;background:var(--demo);color:var(--demo-text);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:12px}
.demo b{font-weight:600;margin-right:6px;opacity:.8}
.dg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.demo button{background:transparent;color:var(--demo-text);border:1px solid var(--demo-line);border-radius:12px;padding:3px 10px;cursor:pointer;font-size:12px}
.demo button.on{background:var(--demo-text);color:var(--demo);border-color:var(--demo-text)}
.demo .note{flex-basis:100%;opacity:.78;line-height:1.55}
.stage{max-width:1180px;margin:0 auto;display:flex;justify-content:center}
.win{width:100%;height:780px;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;position:relative;font-size:14px;line-height:1.6}
.win.phone{width:390px;max-width:100%;height:820px;border-radius:28px}
.side{width:232px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-sizing:border-box}
.phone .side{position:absolute;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}
.phone .side.open{transform:none;box-shadow:0 0 0 100vmax var(--shade)}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 18px}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer}
.nav:hover{background:var(--hover)}.nav.on{background:var(--sel)}
.nav svg{flex:none;color:var(--muted)}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--dot);margin-left:2px}
.grp{font-size:12px;color:var(--muted);padding:18px 10px 4px}
.conv{padding:6px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 22px;border-bottom:1px solid var(--border)}
.phone .top{padding-left:6px}
.ttl{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--text)}
.menu{display:none}.phone .menu{display:flex}
.body{flex:1;min-height:0;overflow-y:auto}
.col{max-width:872px;margin:0 auto;padding:28px 40px 48px;display:flex;flex-direction:column}
.phone .col{padding:18px 16px 40px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 14px -8px}
.ph h1{font-size:20px;font-weight:500;margin:0;flex:1}
.lnkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:4px 2px;white-space:nowrap}
.lnkbtn:hover{text-decoration:underline}
.gh{font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);padding:16px 0 2px}
.gh:first-of-type{padding-top:0}
.row{display:grid;grid-template-columns:112px 1fr auto;gap:2px 12px;padding:10px 4px;border-bottom:1px solid var(--border);align-items:start;transition:background .6s}
.phone .row{grid-template-columns:1fr}
.acts{display:flex;gap:4px;align-items:center}
.phone .acts{margin-left:-8px}
.row.urgent{box-shadow:inset 3px 0 0 var(--danger);background:var(--danger-soft);padding-left:14px}
.row.check{box-shadow:inset 3px 0 0 var(--warning);background:var(--warning-soft);padding-left:14px}
.row.hl{background:var(--accent-soft)}
.gh.urgent{color:var(--danger)}.gh.check{color:var(--warning)}
.when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.when.soon{color:var(--danger);font-weight:600}
.txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.txt .t{font-size:14.5px}
.key{font-size:13px;color:var(--muted);line-height:1.55}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta .src{display:inline-flex;align-items:center;gap:4px}
.pri{font-weight:600}.pri.high{color:var(--danger)}.pri.mid{color:var(--text)}.pri.low{color:var(--muted);font-weight:400}
.meta a,.meta button.l{color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:12px}
.meta a:hover,.meta button.l:hover{text-decoration:underline}
.rate{display:inline-flex;gap:8px}
.rate button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.rate button.on{color:var(--text);text-decoration:none;font-weight:600}
.act{background:none;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:14px;white-space:nowrap}
.act:hover{background:var(--hover)}
.foot{font-size:12.5px;color:var(--muted);padding-top:14px}
.aud{margin-top:22px;border-top:1px solid var(--border);padding-top:10px;font-size:13px}
.audh{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted)}
.audn{font-size:12.5px;color:var(--muted);padding:2px 0 6px}
.audr{display:grid;grid-template-columns:150px 1fr auto;gap:2px 12px;padding:7px 4px;border-bottom:1px solid var(--border);align-items:center}
.auds{min-width:0}
.phone .audr{grid-template-columns:1fr auto}.phone .auds{grid-column:1/-1;grid-row:2}
.audf{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audb{padding-top:10px}
.foot button{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:12.5px}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);padding:0 0 6px;font-variant-numeric:tabular-nums}
.sum b{color:var(--text);font-weight:600}.sum b.w{color:var(--warning)}.sum b.d{color:var(--danger)}
.lr{display:grid;grid-template-columns:48px 18px 1fr;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--border);align-items:start}
.lt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lv{padding-top:3px;display:flex}
.lm{min-width:0;display:flex;flex-direction:column;gap:2px}
.lh{font-size:14px}
.lh .v{color:var(--muted);margin-right:6px}
.lh .v.spoke{color:var(--text);font-weight:600}.lh .v.warn{color:var(--warning);font-weight:600}.lh .v.need{color:var(--danger);font-weight:600}.lh .v.held{color:var(--text)}
.lr.quiet .lh,.lr.quiet .lt{color:var(--muted)}
.lr.need{box-shadow:inset 3px 0 0 var(--danger);background:var(--danger-soft);padding-left:14px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.lr .btn{align-self:flex-start;margin-top:6px;font-size:13px;padding:5px 12px}
.ls{font-size:13px;color:var(--muted);line-height:1.55}
.connect{border:1px dashed var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin:4px 0 18px}
.connect h2{margin:0;font-size:15px;font-weight:600}
.connect p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.7}
.shade{position:absolute;inset:0;background:var(--shade);z-index:30;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:16px;width:680px;max-width:calc(100% - 32px);height:520px;max-height:calc(100% - 40px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.phone .shade{align-items:stretch}
.phone .modal{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}
.mh{display:flex;align-items:center;padding:16px 16px 16px 22px;border-bottom:1px solid var(--border)}
.mh h2{flex:1;margin:0;font-size:20px;font-weight:500}
.mb{flex:1;min-height:0;display:flex}
.phone .mb{flex-direction:column}
.mnav{width:156px;flex:none;background:var(--sidebar);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.phone .mnav{width:auto;flex-direction:row;overflow-x:auto;padding:8px 10px}
.mnav button{text-align:left;background:none;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.mnav button.on{background:var(--sel);color:var(--accent)}
.mc{flex:1;min-width:0;overflow-y:auto;padding:16px 24px 24px}
.mc h3{margin:0 0 6px;font-size:15px;font-weight:500}
.sr{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.sr>div{flex:1;min-width:0}
.sl{font-size:14px}.sd{font-size:12.5px;color:var(--muted);line-height:1.55}
.sw{width:38px;height:22px;border-radius:11px;background:var(--border);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:19px}
details{padding:2px 0 8px 46px;font-size:13px;color:var(--muted)}
.apps{padding:16px 0 4px}
.app{gap:14px}
.appic{width:32px;height:32px;border-radius:8px;background:var(--muted-surface);display:grid;place-items:center;flex:none;color:var(--text)}
.appic svg{width:17px;height:17px}
.appsmore{padding:4px 0 14px;border-bottom:1px solid var(--border)}
details summary{cursor:pointer}
details ul{margin:6px 0 2px;padding-left:18px;line-height:1.75}
.qp{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--border)}
.qh{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qh b{font-weight:400;color:var(--text);min-width:72px}
.qh input{font:inherit;color:var(--text);background:var(--muted-surface);border:0;border-radius:6px;padding:2px 6px;width:6ch;text-align:center}
.days{display:flex;gap:2px}
.dc{min-width:24px;height:24px;border-radius:12px;border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0 4px}
.dc.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:18px;padding:8px 16px;font-size:13px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none}}
</style>

<div class="stage"><div class="win" id="win"></div></div>

  let last="";
  for(const r of LOG){
    if(r.day!==last){out+=`<div class="gh">${t(r.day)}</div>`;last=r.day;}
    const rt=r.rate==="spoke"?rate("l-"+r.t,["useful","notNeeded"]):r.rate==="miss"?rate("l-"+r.t,["shouldHave"]):"";
    out+=`<div class="lr ${r.c||"quiet"}"><span class="lt">${r.t}</span><span class="lv"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="${DOT[r.v]}"/></svg></span><div class="lm"><span class="lh"><span class="v ${r.c}">${t(r.v)}</span>${esc(L(r.h))}</span>${r.s?`<span class="ls">${esc(L(r.s))}</span>`:""}${rt?`<div class="meta">${rt}</div>`:""}${r.fix?`<button class="btn" data-act="openTools">${t("reconnect")}</button>`:""}</div></div>`;
  }
  return out;
}
function modal(){
  if(!S.modal) return "";
  const tabs=["sGeneral","sNotif","sTools","sData"].map(k=>`<button data-tabm="${k}" class="${S.modal===k?"on":""}">${t(k)}</button>`).join("");
  let c="";
  if(S.modal==="sGeneral") c=`<h3>${t("sGeneral")}</h3><div class="sr"><div><div class="sl">${t("gName")}</div></div><span class="sd">Andy</span></div><div class="sr"><div><div class="sl">${t("gLang")}</div></div><span class="sd">${{zh:"中文",en:"English",ja:"日本語"}[S.lang]}</span></div>`;
  if(S.modal==="sNotif") c=`<h3>${t("sNotif")}</h3>
    <div class="sr"><div><div class="sl">${t("nPush")}</div><div class="sd">${t("nPushD")}</div></div><button class="sw ${S.push?"on":""}" data-tog="push" aria-pressed="${S.push}" aria-label="${t("nPush")}"></button></div>
    <div class="sr"><div><div class="sl">${t("nPro")}</div><div class="sd">${t("nProD")}</div></div><button class="sw ${S.pro?"on":""}" data-tog="pro" aria-pressed="${S.pro}" aria-label="${t("nPro")}"></button></div>
    <div class="sr" style="border-bottom:0;padding-bottom:0"><div><div class="sl">${t("nQuiet")}</div><div class="sd">${t("nQuietD")}</div></div></div>
    ${S.periods.map((p,pi)=>`<div class="qp"><div class="qh"><b>${t(p.n)}</b><input id="from-${pi}" type="text" inputmode="numeric" maxlength="5" value="${p.from}" aria-label="${t(p.n)} start"> ${t("to")} <input id="to-${pi}" type="text" inputmode="numeric" maxlength="5" value="${p.to}" aria-label="${t(p.n)} end"></div><div class="days">${DAYS[S.lang].map((d,di)=>`<button class="dc ${p.days[di]?"on":""}" data-day="${pi}-${di}" aria-pressed="${!!p.days[di]}">${d}</button>`).join("")}</div></div>`).join("")}
    <div style="padding-top:10px"><button class="btn">${t("addPeriod")}</button></div>`;
  if(S.modal==="sTools") c=`<h3>${t("sTools")}</h3>
    <div class="sr"><div><div class="sl">${t("tSearch")}</div><div class="sd">${t("tSearchD")}</div></div><button class="sw on" aria-pressed="true" aria-label="${t("tSearch")}"></button></div>
    <div class="apps"><div class="sl">${t("tApps")}</div><div class="sd">${t("tAppsD")}</div></div>
    <div class="sr app" style="border-bottom:0"><span class="appic" aria-hidden="true">${I.mail}</span><div><div class="sl">${t("tGmail")}</div><div class="sd">${S.connected?t("tGmailOn"):t("tGmailOff")}</div></div>${S.connected?`<button class="btn" data-act="disconnect">${t("tDisconnect")}</button>`:`<button class="btn pri" data-act="connect">${t("connBtn")}</button>`}</div>
    <details ${S.connected?"":"open"}><summary>${t("tWhat")}</summary><ul><li>${t("tW1")}</li><li>${t("tW2")}</li><li>${t("tW3")}</li><li>${t("tW4")}</li><li>${t("tW5")}</li></ul></details>
    <div class="sr" style="padding-left:46px;border-bottom:0"><div><div class="sl">${t("tVip")}</div><div class="sd">${t("tVipD")}</div></div><span class="sd">${t("tVipN").replace("{n}","12")}</span><button class="btn">${t("manage2")}</button></div>
    <div class="sd appsmore">${t("tAppsMore")}</div>
    <div class="sr"><div><div class="sl">${t("tAsk")}</div><div class="sd">${t("tAskD")}</div></div><span class="sd">${t("fixed")}</span></div>`;
  if(S.modal==="sData") c=`<h3>${t("sData")}</h3><div class="sr"><div><div class="sl">${t("dArch")}</div><div class="sd">${t("dArchD")}</div></div><button class="btn">${t("manage")}</button></div>
    <div class="sr"><div><div class="sl">${t("dLog")}</div><div class="sd">${t("dLogD")}</div></div><button class="btn" data-act="del" style="color:var(--danger)">${t("del")}</button></div>`;
  return `<div class="shade" data-act="closeModal"><section class="modal" role="dialog" aria-label="${t("settings")}"><div class="mh"><h2>${t("settings")}</h2><button class="ib" data-act="closeModal" aria-label="close">${I.close}</button></div><div class="mb"><nav class="mnav">${tabs}</nav><div class="mc">${c}</div></div></section></div>`;
}
function render(){
  document.documentElement.lang={zh:"zh-CN",en:"en",ja:"ja"}[S.lang];
  document.getElementById("demo").innerHTML=demo();
  const w=document.getElementById("win"), y=document.getElementById("scroll")?.scrollTop??0;
  w.className="win"+(S.device==="phone"?" phone":"");
  w.innerHTML=side()+`<main class="main"><div class="top"><button class="ib menu" data-act="drawer" aria-label="${t("openMenu")}">${I.menu}</button><div class="ttl">${t("reminders")}</div><button class="ib" data-act="openGeneral" aria-label="${t("settings")}">${I.gear}</button></div><div class="body" id="scroll"><div class="col">${S.view==="log"?logView():listView()}</div></div></main>`+modal()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"");
  const sc=document.getElementById("scroll"); if(sc) sc.scrollTop=y;
  try{localStorage.setItem("hw-rem-proto2",JSON.stringify({lang:S.lang,device:S.device}))}catch{}
}
let tt; function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2400);}
document.addEventListener("click",e=>{
  if(S.drawer&&!e.target.closest(".side")&&!e.target.closest("[data-act=drawer]")&&!e.target.closest(".demo")){S.drawer=false;render();return;}
  const b=e.target.closest("[data-set],[data-act],[data-rate],[data-gone],[data-day],[data-tabm],[data-tog]"); if(!b) return;
  if(b.dataset.act==="closeModal"&&e.target!==b&&!e.target.closest(".ib")) return;
  if(b.dataset.set){S[b.dataset.set]=b.dataset.set==="connected"?b.dataset.v==="true":b.dataset.v;S.drawer=false;render();return;}
  if(b.dataset.rate){const k=b.dataset.rate;S.rated[k]=S.rated[k]===b.dataset.v?undefined:b.dataset.v;render();return;}
  if(b.dataset.gone){S.gone[b.dataset.gone]=true;render();return;}
  if(b.dataset.day){const[p,d]=b.dataset.day.split("-").map(Number);S.periods[p].days[d]=S.periods[p].days[d]?0:1;render();return;}
  if(b.dataset.tabm){S.modal=b.dataset.tabm;render();return;}
  if(b.dataset.tog){S[b.dataset.tog]=!S[b.dataset.tog];render();return;}
  const a=b.dataset.act;
  if(a==="drawer"){S.drawer=!S.drawer;render();}
  else if(a==="aud"){S.audOpen=!S.audOpen;render();}
  else if(a==="audDone"){S.audDone=true;render();}
  else if(a==="log"){S.view="log";render();}
  else if(a==="list"){S.view="list";render();}
  else if(a==="openGeneral"){S.modal="sGeneral";render();}
  else if(a==="openNotif"){S.modal="sNotif";S.drawer=false;render();}
  else if(a==="openTools"){S.modal="sTools";S.drawer=false;render();}
  else if(a==="closeModal"){S.modal=null;render();}
  else if(a==="connect"){S.connected=true;S.modal=null;toast(t("tConnected"));}
  else if(a==="disconnect"){S.connected=false;toast(t("tDisconnected"));}
  else if(a==="del"){toast(t("tDel"));}
  else if(a==="simulate"){S.connected=true;S.view="list";S.modal=null;S.drawer=false;delete S.gone.m2;S.hl="m2";render();document.getElementById("row-m2")?.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>{S.hl=null;render()},2600);}
});
render();
</script>
