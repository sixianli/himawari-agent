<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敏感信息拦截记录原型</title>
<style>
*{box-sizing:border-box}
:root{--page:#e6e5e1;--bg:#fbfbfa;--card:#fff;--tx:#1b1b1b;--mu:#707070;--ln:rgba(0,0,0,.11);--fill:rgba(0,0,0,.055);--ac:#1b1b1b;--on:#fff;--sun:#d4930f;--red:#c9372c;--red-soft:#fbe9e7;--amb:#a86400;--amb-soft:#fbf0dc;--pur:#6b4fd8;--scrim:rgba(0,0,0,.28);--sh-up:0 18px 50px rgba(0,0,0,.25)}
:root[data-theme=dark]{--page:#0b0b0b;--bg:#1c1c1c;--card:#262626;--tx:#ececec;--mu:#9a9a9a;--ln:rgba(255,255,255,.11);--fill:rgba(255,255,255,.07);--ac:#ececec;--on:#1c1c1c;--sun:#efb23c;--red:#ef7d72;--red-soft:#41231f;--amb:#e0a54a;--amb-soft:#3a2f1c;--pur:#a796ff;--scrim:rgba(0,0,0,.5);color-scheme:dark}
html,body{margin:0}
body{background:var(--page);color:var(--tx);font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans","Noto Sans CJK SC",system-ui,sans-serif;padding:12px 16px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:0 18px;border-radius:999px}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;display:block}
.banner{position:fixed;top:8px;right:8px;z-index:50;pointer-events:none;background:var(--ac);color:var(--on);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;opacity:.9}
.proto{max-width:980px;margin:0 auto 14px;padding:10px 12px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--fill) 0 6px,transparent 6px 12px);font-size:12px;color:var(--mu)}
.proto>b{display:block;font-weight:600;margin:0 0 6px;color:var(--tx)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pseg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.pseg button{min-height:28px;padding:0 10px;font-size:12px;border-radius:9px;color:var(--mu)}
.pseg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:600}
.stage{position:relative;max-width:980px;margin:0 auto;height:680px;border-radius:18px;background:var(--bg);overflow:hidden}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));height:560px;background:var(--card);border-radius:22px;box-shadow:var(--sh-up);display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px 22px}
.dh h2{font-size:17px;margin:0;font-weight:600}
.x{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}
.x:hover{background:var(--fill)}
.db{flex:1;min-height:0;display:flex}
.nav{width:180px;flex:none;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;min-height:40px;padding:0 14px;border-radius:14px;color:var(--mu)}
.nav button[aria-pressed=true]{background:var(--fill);color:var(--tx);font-weight:600}
.content{flex:1;min-width:0;overflow:auto;padding:6px 22px 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row small{display:block;color:var(--mu);font-size:12.5px}
.bs{background:var(--fill);white-space:nowrap}
.danger{color:var(--red)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px 0 6px;background:var(--fill);font-size:13px;margin:0 0 10px}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.vh h3{margin:0;font-size:16px;font-weight:600}
.vh .muted{color:var(--mu);font-size:12.5px}
.seg{display:inline-flex;gap:2px;background:var(--fill);border-radius:999px;padding:3px;margin:0 0 12px;max-width:100%;overflow-x:auto}
.seg button{min-height:34px;padding:0 14px;font-size:13px;color:var(--mu);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.day{font-size:12.5px;color:var(--mu);margin:14px 0 6px;font-weight:500}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--fill);margin:0 0 8px}
.chip{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--card);box-shadow:0 0 0 1px var(--ln);white-space:nowrap;margin-top:1px}
.item .b{flex:1;min-width:0}
.item .w{font-size:13.5px;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.item .m.amb{color:var(--amb)}
.go{flex:none;min-height:34px;padding:0 12px;font-size:13px;color:var(--pur)}
.go:hover{background:var(--card)}
.empty{background:var(--fill);border-radius:14px;padding:18px;color:var(--mu);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;color:var(--mu);font-size:12.5px}
.confirm{background:var(--red-soft);color:var(--red);border-radius:14px;padding:10px 12px;margin:10px 0 0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.confirm .r{display:flex;gap:6px}
.bd{background:var(--red);color:#fff;font-weight:600;min-height:36px}
.bq{min-height:36px}
.grab{display:none;width:38px;height:5px;border-radius:3px;background:var(--ln);margin:6px auto 2px}
.phone .stage{max-width:390px;height:780px}
.phone .dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;height:calc(100% - 48px);border-radius:26px 26px 0 0}
.phone .grab{display:block}
.phone .db{flex-direction:column}
.phone .nav{width:auto;flex-direction:row;overflow-x:auto;padding:0 12px 6px}
.phone .nav button{white-space:nowrap;min-height:36px;padding:0 12px}
.phone .content{padding:6px 16px 18px}
.phone .dh{padding:4px 8px 4px 18px}
.phone .item{flex-wrap:wrap;gap:4px 10px}
.phone .item .b{flex:1 1 calc(100% - 90px)}
.phone .go{flex-basis:100%;text-align:left;min-height:32px;padding:0 0 0 calc(10px + 4.2em)}
</style>
</head>
<body>
<div class="banner">原型 · 演示数据</div>
<div class="proto">
  <b>敏感信息拦截记录（设置 → 数据）原型。所有内容都是演示数据，不代表真实记录。</b>
  <div class="ctl">
    <div class="grp"><span>宽度</span><span class="pseg" id="w"><button aria-pressed="true" data-v="desk">电脑 1280</button><button aria-pressed="false" data-v="phone">手机 390</button></span></div>
    <div class="grp"><span>主题</span><span class="pseg" id="th"><button aria-pressed="true" data-v="light">浅色</button><button aria-pressed="false" data-v="dark">深色</button></span></div>
    <div class="grp"><span>画面</span><span class="pseg" id="sc"><button aria-pressed="false" data-v="data">数据栏</button><button aria-pressed="true" data-v="list">记录列表</button><button aria-pressed="false" data-v="empty">没有记录</button></span></div>
  </div>
</div>

<div id="root">
<div class="stage">
  <div class="scrim"></div>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="grab"></div>
    <div class="dh"><h2 id="dt">设置</h2><button class="x" aria-label="关闭"><svg class="ic" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <div class="db">
      <nav class="nav" aria-label="设置类别">
        <button aria-pressed="false">个性化</button>
        <button aria-pressed="false">通用</button>
        <button aria-pressed="false">通知</button>
        <button aria-pressed="false">工具与权限</button>
        <button aria-pressed="true">数据</button>
      </nav>
      <section class="content" id="content"></section>
    </div>
  </div>
</div>
</div>

<template id="t-data">
  <div class="row">
    <span class="t">敏感信息拦截记录<small>共 7 条记录</small></span>
    <button class="bs" data-open>查看</button>
  </div>
  <div class="row">
    <span class="t">提醒检查记录<small>删除后无法恢复</small></span>
    <button class="bs danger">删除</button>
  </div>
</template>

<template id="t-list">
  <button class="back" data-back><svg class="ic" viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>数据</button>
  <div class="vh"><h3>敏感信息拦截记录</h3><span class="muted">只记类别和出处，不保存原文</span></div>
  <div class="seg" role="group" aria-label="筛选">
    <button aria-pressed="true">全部 7</button>
    <button aria-pressed="false">发给模型前遮住 5</button>
    <button aria-pressed="false">没记进记忆 2</button>
  </div>
  <div class="day">今天</div>
  <div class="item">
    <span class="chip">密码</span>
    <div class="b">
      <div class="w">对话「家里网络设置」· 你的话</div>
      <div class="m">14:02 第一次遮住，之后 4 次发送都已遮住</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="item">
    <span class="chip">密码</span>
    <div class="b">
      <div class="w">对话「家里网络设置」· 自动整理记忆</div>
      <div class="m amb">14:02 这条记忆没有保存，需要的话可以自己补记</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="item">
    <span class="chip">密钥</span>
    <div class="b">
      <div class="w">对话「部署脚本」· 命令输出</div>
      <div class="m">11:40 第一次遮住，之后 2 次发送都已遮住</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="item">
    <span class="chip">验证码</span>
    <div class="b">
      <div class="w">后台 · 邮件判断 · 一封收件箱里的邮件</div>
      <div class="m">09:15 遮住 1 次</div>
    </div>
    <button class="go">看邮件记录</button>
  </div>
  <div class="day">11 月 3 日</div>
  <div class="item">
    <span class="chip">银行卡号</span>
    <div class="b">
      <div class="w">对话「信用卡账单」· 你上传的文件</div>
      <div class="m">20:31 第一次遮住，之后 6 次发送都已遮住</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="item">
    <span class="chip">证件号</span>
    <div class="b">
      <div class="w">对话「签证材料」· 打开的网页</div>
      <div class="m">16:08 第一次遮住，之后 1 次发送都已遮住</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="item">
    <span class="chip">验证码</span>
    <div class="b">
      <div class="w">对话「银行登录」· 自动整理记忆</div>
      <div class="m amb">10:20 这条记忆没有保存，需要的话可以自己补记</div>
    </div>
    <button class="go">打开对话</button>
  </div>
  <div class="foot"><span>记录不会自动删除；删掉对话时一起删除</span><button class="bs danger" data-clear>清除记录</button></div>
  <div class="confirm" data-confirm hidden><span>清除全部拦截记录？对话本身不受影响。</span><span class="r"><button class="bd">清除</button><button class="bq" data-cancel>取消</button></span></div>
</template>

<template id="t-empty">
  <button class="back" data-back><svg class="ic" viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>数据</button>
  <div class="vh"><h3>敏感信息拦截记录</h3></div>
  <div class="empty">还没有拦下过敏感信息</div>
</template>

<script>
const root=document.documentElement,content=document.getElementById('content');
function seg(id,fn){const el=document.getElementById(id);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)})}
function show(v){content.innerHTML='';content.append(document.getElementById('t-'+v).content.cloneNode(true));
 content.querySelector('[data-open]')?.addEventListener('click',()=>pick('list'));
 content.querySelector('[data-back]')?.addEventListener('click',()=>pick('data'));
 const c=content.querySelector('[data-confirm]');content.querySelector('[data-clear]')?.addEventListener('click',()=>{c.hidden=false});
 content.querySelector('[data-cancel]')?.addEventListener('click',()=>{c.hidden=true});
 content.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>content.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))));}
function pick(v){document.querySelectorAll('#sc button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));show(v)}
seg('w',v=>document.body.classList.toggle('phone',v==='phone'));
seg('th',v=>root.dataset.theme=v);
seg('sc',show);
show('list');
</script>
</body>
</html>
