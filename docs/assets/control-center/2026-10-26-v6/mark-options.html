<title>Himawari 标志候选</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --page: #f3f1ea; --card: #fbfaf6; --line: #e2dfd4; --text: #2a2c25; --strong: #15160f; --muted: #6b6d62;
  --accent: #87539c; --petal: #e3a414; --petal-2: #f3c94a; --amber: #e7781f; --rose: #ef9a86; --seed: #2b2621; --leaf: #6f9a3a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --page: #141413; --card: #1d1d1c; --line: #31312e; --text: #d6d6d2; --strong: #f1f0eb; --muted: #9a9a94; --accent: #d38ce2; --petal: #f2c14e; --petal-2: #f8dc8a; --amber: #f0913a; --rose: #f2a593; --seed: #5e4427; --leaf: #9bc160; }
}
:root[data-theme="dark"] { color-scheme: dark; --page: #141413; --card: #1d1d1c; --line: #31312e; --text: #d6d6d2; --strong: #f1f0eb; --muted: #9a9a94; --accent: #d38ce2; --petal: #f2c14e; --petal-2: #f8dc8a; --amber: #f0913a; --rose: #f2a593; --seed: #5e4427; --leaf: #9bc160; }
.tone-dark { --card: #1e1e1d; --line: #343432; --text: #d6d6d2; --strong: #f1f0eb; --muted: #9a9a94; --petal: #f2c14e; --petal-2: #f8dc8a; --amber: #f0913a; --rose: #f2a593; --seed: #5e4427; --leaf: #9bc160; }
.tone-light { --card: #fcfbf8; --line: #e3e1d8; --text: #2a2c25; --strong: #12140e; --muted: #686a5f; --petal: #e3a414; --petal-2: #f3c94a; --amber: #e7781f; --rose: #ef9a86; --seed: #2b2621; --leaf: #6f9a3a; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; }
main { max-width: 1120px; margin: 0 auto; }
header { margin: 0 0 28px; max-width: 700px; display: grid; gap: 10px; }
h1 { font-size: 26px; color: var(--strong); margin: 0; font-weight: 650; letter-spacing: -0.2px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); line-height: 1.75; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-size: 16px; color: var(--strong); font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.card h2 span { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.4px; }
.card h2 .rec { margin-left: auto; font-size: 11.5px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 999px; padding: 2px 9px; letter-spacing: 0; }
.card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 13px; }
.card p b { color: var(--text); font-weight: 600; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { border-radius: 16px; background: color-mix(in srgb, var(--line) 32%, transparent); display: grid; place-items: center; padding: 18px 0 10px; gap: 8px; }
.big svg { width: 108px; height: 108px; overflow: visible; }
.big small { color: var(--muted); font-size: 11.5px; }
.uses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.use { border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.use svg { width: 26px; height: 26px; flex: none; overflow: visible; }
.use b { font-weight: 600; color: var(--strong); }
.use em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11px; }
.side { display: flex; align-items: center; gap: 8px; color: var(--strong); font-weight: 650; font-size: 15px; letter-spacing: -0.1px; padding: 2px 2px 0; }
.side svg { width: 20px; height: 20px; overflow: visible; }
.side span { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: auto; }
section { display: grid; gap: 14px; margin-top: 36px; }
section:first-of-type { margin-top: 0; }
section > h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.6px; }
.card h2 .chosen { margin-left: auto; font-size: 11.5px; color: var(--strong); background: color-mix(in srgb, var(--petal) 26%, transparent); border-radius: 999px; padding: 2px 9px; letter-spacing: 0; font-style: normal; }
details.old > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; }
details.old[open] > summary { margin-bottom: 14px; }

svg * { transform-box: view-box; }

.ma .disc { transform-origin: 24px 24px; }
.ma .sd { fill: color-mix(in srgb, var(--petal) var(--p), var(--seed)); transform-box: fill-box; transform-origin: center; }
.ma.on .disc { animation: turn 48s linear infinite; }
.ma.on .sd { animation: wave 2.6s ease-in-out infinite; animation-delay: calc((96 - var(--i)) * -0.022s); }

.mb .core { fill: var(--petal); }
.mb .ray { stroke: var(--petal); stroke-linecap: round; }
.mb .ray.minor { stroke-width: 1.5; opacity: 0.55; }
.mb .ray.major { stroke-width: 1.9; }
.mb.on .ray { animation: sweep 1.9s linear infinite; animation-delay: calc(var(--i) * -0.0792s); }
.mb.on .core { transform-origin: 24px 24px; animation: breathe 3.8s ease-in-out infinite; }

.mc .o0 { fill: var(--petal); }
.mc .o1 { fill: var(--petal-2); }
.mc .o2 { fill: var(--amber); }
.mc .o3 { fill: var(--rose); }
.mc .swirl { transform-origin: 24px 24px; }
.mc.on .swirl { animation: turn 7s linear infinite; }
.mc.on .orb { transform-origin: 24px 24px; animation: breathe 3.4s ease-in-out infinite; }
.mc .rim { fill: none; stroke: color-mix(in srgb, var(--amber) 40%, transparent); stroke-width: 0.6; }

.md .blades { transform-origin: 24px 24px; }
.md .blade { fill: var(--petal); }
.md .blade.alt { fill: color-mix(in srgb, var(--petal) 78%, var(--amber)); }
.md .seed { fill: var(--seed); }
.md.on .blades { animation: turn 11s linear infinite; }
.md.on .seed { transform-origin: 24px 24px; animation: breathe 3.6s ease-in-out infinite; }

.me .petal { fill: var(--petal); }
.me .seed { fill: var(--seed); }
.me .glint { fill: var(--petal-2); }
.me .look { }
.me.on .look { animation: look 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
.me .ring { transform-origin: 24px 24px; }
.me.on .ring { animation: sway 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }

.mf .lite { fill: var(--petal-2); }
.mf .deep { fill: var(--petal); }
.mf .seed { fill: var(--seed); }
.mf .fold { transform-origin: 24px 24px; }
.mf.on .fold { animation: tick 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }

.mg .hi { fill: none; stroke: var(--strong); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.mg .sundot { fill: var(--petal); }
.mg .sunglow { fill: var(--petal); opacity: 0; transform-box: fill-box; transform-origin: center; }
.mg.on .sun { animation: rise 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
.mg.on .sunglow { animation: halo 3.8s ease-in-out infinite; }

.mh .kernel { fill: var(--petal); }
.mh .body { transform-origin: 24px 44px; }
.mh .sprout { fill: var(--leaf); transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); }
.mh.on .body { animation: rock 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
.mh.on .sprout { animation: sprout 3.2s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }

.mi .link { stroke: var(--muted); stroke-width: 0.9; stroke-linecap: round; opacity: 0.6; fill: none; }
.mi .node { fill: var(--petal-2); transform-box: fill-box; transform-origin: center; }
.mi .hub { fill: var(--petal); }
.mi.on .link { stroke-dasharray: 1 1; animation: link 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.16s - 3.6s); }
.mi.on .node { animation: twinkle 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.16s - 3.6s); }

.mj .bar { stroke: var(--petal); stroke-width: 2.8; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%; }
.mj .core { fill: var(--petal-2); }
.mj.on .bar { animation: voice var(--d) ease-in-out infinite alternate; animation-delay: var(--dl); }

.mk .ink { fill: var(--strong); }
.mk .sundot { fill: var(--petal); }
.mk .mpath { fill: none; stroke: #fff; stroke-width: 11; stroke-dasharray: 100 100; stroke-dashoffset: 0; }
.mk.on .mpath { animation: brush 4.4s cubic-bezier(0.55, 0.1, 0.35, 1) infinite; }

.ml .spiral { fill: none; stroke: var(--petal); stroke-width: 2.3; stroke-linecap: round; }
.ml .start { fill: var(--strong); }
.ml.on .spiral { stroke-dasharray: 100 100; animation: brush 4.4s cubic-bezier(0.55, 0.1, 0.35, 1) infinite; }

.mm .px.p { fill: var(--petal); }
.mm .px.h { fill: var(--petal-2); }
.mm .px.s { fill: var(--seed); }
.mm .px.s2 { fill: color-mix(in srgb, var(--seed) 60%, var(--petal)); }
.mm.on .px.p, .mm.on .px.h { animation: pix 2.4s steps(1, end) infinite; animation-delay: var(--dl); }

@keyframes rise { 0%, 100% { transform: translateY(2.4px); } 50% { transform: translateY(-3.4px); } }
@keyframes halo { 0%, 100% { transform: scale(0.8); opacity: 0.12; } 50% { transform: scale(1.25); opacity: 0.26; } }
@keyframes rock { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes sprout { 0%, 15% { transform: scale(0); } 45%, 80% { transform: scale(1); } 100% { transform: scale(0); } }
@keyframes link { 0% { stroke-dashoffset: 1; } 40%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1; } }
@keyframes twinkle { 0%, 100% { opacity: 0.5; transform: scale(0.75); } 40%, 70% { opacity: 1; transform: scale(1.1); } }
@keyframes voice { from { transform: scaleY(0.35); } to { transform: scaleY(1.2); } }
@keyframes brush { 0% { stroke-dashoffset: 100; } 45%, 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
@keyframes pix { 0% { opacity: 1; } 50% { opacity: 0.35; } }

@keyframes turn { to { transform: rotate(360deg); } }
@keyframes wave { 0%, 100% { opacity: 0.42; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1.12); } }
@keyframes sweep { 0% { opacity: 1; } 70%, 100% { opacity: 0.16; } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94); } }
@keyframes look { 0%, 12%, 88%, 100% { transform: translate(0, 0.8px); } 30%, 42% { transform: translate(-2.4px, -1.6px); } 60%, 72% { transform: translate(2.2px, -1.8px); } }
@keyframes sway { 0%, 12%, 88%, 100% { transform: rotate(0deg); } 30%, 42% { transform: rotate(-6deg); } 60%, 72% { transform: rotate(6deg); } }
@keyframes tick { 0%, 30% { transform: rotate(0deg); } 50%, 80% { transform: rotate(22.5deg); } 100% { transform: rotate(45deg); } }
@media (prefers-reduced-motion: reduce) { svg *, svg { animation: none !important; } }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>

<main>
  <header>
    <h1>Himawari 标志候选</h1>
    <p>你已把 A 葵盘放进候选。第三轮往更远处想：从名字（ひまわり 的"ひ"）、东方笔墨、一粒种子、记忆连成的星图、说话的声音这几个方向各做了一个，每个都和 Himawari 的定位挂钩。每张卡上面两格是大图，左边是正在回答时的动态，右边是做完后静止的样子；下面是它在回答标题里（26 像素）和侧栏品牌位（20 像素）的实际大小。第二轮其余 5 个收在页面最下面。</p>
  </header>
  <section><h3>已入选</h3><div class="grid" id="g-pick"></div></section>
  <section><h3>第三轮 · 5 个新方向</h3><div class="grid" id="g-new"></div></section>
  <section><details class="old"><summary>第二轮其余 5 个方案</summary><div class="grid" id="g-old"></div></details></section>
</main>

<script>
let uid = 0;
const f2 = (n) => Math.round(n * 100) / 100;

const V = [
  {
    id: "ma", tag: "A", name: "葵盘", group: "pick",
    idea: "<b>每一粒葵花籽都是一条记忆。</b>真实的向日葵花盘按 137.5° 黄金角排籽，越往外越亮。回答时一道光从花心一圈圈向外涌，像在翻找记忆；平时就是一枚安静的花盘。",
    svg: () => {
      const N = 96, dots = [];
      for (let n = 1; n <= N; n++) {
        const r = 2.16 * Math.sqrt(n), a = (n * 137.508 * Math.PI) / 180;
        const rd = 0.82 + 0.78 * (n / N), p = Math.round(46 + 54 * Math.pow(n / N, 0.7));
        dots.push(`<circle class="sd" style="--i:${n};--p:${p}%" cx="${f2(24 + r * Math.cos(a))}" cy="${f2(24 + r * Math.sin(a))}" r="${f2(rd)}"/>`);
      }
      return `<g class="disc">${dots.join("")}</g>`;
    }
  },
  {
    id: "mb", group: "old", tag: "B", name: "日晷",
    idea: "<b>一个小太阳，也是一只表。</b>24 道光芒排成表盘刻度，呼应新界面\"每一秒都算清楚\"。回答时一道亮光沿刻度扫过，像秒针在走；做完停下，就是一枚干净的太阳。",
    svg: () => {
      const rays = Array.from({ length: 24 }, (_, i) => {
        const major = i % 6 === 0, r1 = 11.6, r2 = major ? 21.6 : 18.2;
        return `<line class="ray ${major ? "major" : "minor"}" style="--i:${i}" transform="rotate(${i * 15} 24 24)" x1="24" y1="${24 - r1}" x2="24" y2="${24 - r2}"/>`;
      }).join("");
      return `${rays}<circle class="core" cx="24" cy="24" r="6.8"/>`;
    }
  },
  {
    id: "mc", group: "old", tag: "C", name: "暖光",
    idea: "<b>向日葵追的那道光。</b>一颗内部缓缓流动的暖色光球，黄、橙、一点珊瑚色在里面慢慢转，像午后的太阳。回答时光在里面流动，做完就凝住。最现代、最接近 Apple Intelligence、Gemini 这类产品的质感。",
    svg: (u) => `<defs>
        <clipPath id="c${u}"><circle cx="24" cy="24" r="20"/></clipPath>
        <filter id="f${u}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
        <radialGradient id="h${u}" cx="34%" cy="26%" r="52%"><stop offset="0" stop-color="#fff" stop-opacity="0.62"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="s${u}" cx="50%" cy="50%" r="50%"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.16"/></radialGradient>
      </defs>
      <g class="orb"><g clip-path="url(#c${u})"><circle class="o0" cx="24" cy="24" r="20"/>
        <g filter="url(#f${u})"><g class="swirl"><circle class="o1" cx="15" cy="16" r="11"/><circle class="o2" cx="33" cy="31" r="11.5"/><circle class="o3" cx="34" cy="12" r="6.5"/><circle class="o1" cx="18" cy="35" r="6"/></g></g>
        <circle cx="24" cy="24" r="20" fill="url(#s${u})"/><circle cx="24" cy="24" r="20" fill="url(#h${u})"/></g>
        <circle class="rim" cx="24" cy="24" r="19.7"/></g>`
  },
  {
    id: "md", group: "old", tag: "D", name: "旋瓣",
    idea: "<b>原标志的现代版。</b>保留 v1 标志\"花瓣朝一个方向旋转\"的感觉，把手绘花瓣换成 12 片同样弧度的几何刀形瓣，深浅交替。回答时整朵花慢慢转起来，和现在品牌一脉相承，老用户一眼认得。",
    svg: () => `<g class="blades">${Array.from({ length: 12 }, (_, i) => `<path class="blade ${i % 2 ? "alt" : ""}" transform="rotate(${i * 30} 24 24)" d="M24 15.2C26.9 13 29.8 8.2 27.3 2.6 24.4 5.4 22.5 9.8 24 15.2z"/>`).join("")}</g><circle class="seed" cx="24" cy="24" r="7.6"/>`
  },
  {
    id: "me", group: "old", tag: "E", name: "看着你",
    idea: "<b>它永远朝向你。</b>花心就是一只眼睛，看着屏幕前的你。回答时它会抬眼往左上、右上\"想一想\"，花瓣跟着微微偏转，然后又回来看着你。最有生命感、最灵动，像一个小伙伴。",
    svg: () => `<g class="ring">${Array.from({ length: 14 }, (_, i) => `<ellipse class="petal" transform="rotate(${f2(i * (360 / 14))} 24 24)" cx="24" cy="6.6" rx="2.9" ry="4.6"/>`).join("")}</g>
      <circle class="seed" cx="24" cy="24" r="11.2"/>
      <g class="look"><circle class="glint" cx="20.6" cy="20.4" r="2.5"/><circle class="glint" cx="25.2" cy="19.4" r="0.95" opacity="0.7"/></g>`
  },
  {
    id: "mf", group: "old", tag: "F", name: "折纸",
    idea: "<b>一朵用纸折出来的向日葵。</b>8 片花瓣，每片一半亮一半深，像折痕在光下的明暗。回答时它一格一格地转，每次转半片花瓣再停一下，像钟表的机芯，克制而有节奏。",
    svg: () => `<g class="fold">${Array.from({ length: 8 }, (_, i) => `<g transform="rotate(${i * 45} 24 24)"><path class="lite" d="M24 24.6C17.4 19.2 15.6 10.4 24 3.4z"/><path class="deep" d="M24 3.4c8.4 7 6.6 15.8 0 21.2z"/></g>`).join("")}</g><circle class="seed" cx="24" cy="24" r="5.4"/>`
  },
  {
    id: "mg", tag: "G", name: "ひ", group: "new",
    idea: "<b>名字本身就是标志。</b>Himawari 是日语的\"向日葵\"（ひまわり），第一个假名\"ひ\"的形状本来就像一只托起的手。一笔墨色的\"ひ\"，碗里托着一颗小太阳，意思是它把你托在手心。回答时太阳在碗里缓缓升起、发光，像日出。",
    svg: () => `<path class="hi" d="M8.6 14.6 13.8 12.8C10.6 21.6 11.4 36 23.8 36 33.8 36 37.6 25.4 34.6 11.8 36.8 17 39.4 20.4 41.8 22.2"/><g class="sun"><circle class="sunglow" cx="23.6" cy="26" r="7.4"/><circle class="sundot" cx="23.6" cy="26" r="4"/></g>`
  },
  {
    id: "mh", tag: "H", name: "一粒籽", group: "new",
    idea: "<b>你说的每件事，都是一粒种子。</b>一粒金色的葵花籽，籽上的纹路是镂空的。它记下你的话，再慢慢长出东西来，正好对应\"记忆 + 主动\"。回答时种子轻轻摇晃，尖端冒出一对小芽。",
    svg: (u) => `<defs><mask id="k${u}"><rect width="48" height="48" fill="#000"/><g transform="translate(0 52) scale(1 -1)"><path fill="#fff" d="M24 8.4C31.6 8.4 35.6 15.6 33.4 25.2 31.4 33.6 27.6 39.6 24 44 20.4 39.6 16.6 33.6 14.6 25.2 12.4 15.6 16.4 8.4 24 8.4z"/><g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"><path d="M24 13v26"/><path d="M19.6 14.4C18 22 18.8 30 21.6 36.6"/><path d="M28.4 14.4C30 22 29.2 30 26.4 36.6"/></g></g></mask></defs>
      <g class="body"><rect class="kernel" width="48" height="48" mask="url(#k${u})"/><g class="sprout"><path d="M24 8.6C24 6 22.4 3.8 19.2 3.4 19 6.4 21 8.6 24 8.6z"/><path d="M24 8.6C24 5.4 25.8 2.8 29.4 2.4 29.6 5.8 27.4 8.6 24 8.6z"/></g></g>`
  },
  {
    id: "mi", tag: "I", name: "星图", group: "new",
    idea: "<b>记忆连成的星座。</b>中间最亮的那颗是你，周围每颗星是一条记忆，按向日葵的黄金角排开，再用细线连起来，就是它心里关于你的那张网。回答时线一根根接上、星星依次亮起，像在把相关的记忆串起来。",
    svg: () => {
      const pts = [[24, 24]];
      for (let n = 1; n <= 9; n++) { const r = 6.2 + 1.75 * n, a = (n * 137.508 * Math.PI) / 180; pts.push([24 + r * Math.cos(a), 24 + r * Math.sin(a)]); }
      const links = [];
      for (let n = 1; n < pts.length; n++) {
        let best = 0, bd = Infinity;
        for (let m = 0; m < n; m++) { const d = Math.hypot(pts[n][0] - pts[m][0], pts[n][1] - pts[m][1]); if (d < bd) { bd = d; best = m; } }
        links.push(`<path class="link" pathLength="1" style="--i:${n}" d="M${f2(pts[best][0])} ${f2(pts[best][1])}L${f2(pts[n][0])} ${f2(pts[n][1])}"/>`);
      }
      const nodes = pts.slice(1).map((p, i) => `<circle class="node" style="--i:${i + 1}" cx="${f2(p[0])}" cy="${f2(p[1])}" r="${f2(1.5 + 0.12 * i)}"/>`).join("");
      return `${links.join("")}${nodes}<circle class="hub" cx="24" cy="24" r="4"/>`;
    }
  },
  {
    id: "mj", tag: "J", name: "声瓣", group: "new",
    idea: "<b>会说话的向日葵。</b>Himawari 要能语音对话。16 片花瓣就是 16 根声波条，平时整齐排成一朵花；它开口回答时，花瓣像声音的波形一样此起彼伏。",
    svg: () => Array.from({ length: 16 }, (_, i) => {
      const d = (0.55 + ((i * 7) % 5) * 0.09).toFixed(2), dl = (-((i * 11) % 7) * 0.13).toFixed(2);
      return `<g transform="rotate(${i * 22.5} 24 24)"><line class="bar" style="--d:${d}s;--dl:${dl}s" x1="24" y1="7.6" x2="24" y2="15.2"/></g>`;
    }).join("") + `<circle class="core" cx="24" cy="24" r="5"/>`
  },
  {
    id: "mk", tag: "K", name: "圆相", group: "new",
    idea: "<b>一笔画成的圆，中间留给你。</b>东方书法里的\"圆相\"一笔起、一笔收，象征圆满和专注。墨色的圆里只有一颗小太阳，那就是你。回答时这一笔重新写一遍，写完停一停再收笔，像在认真想。",
    svg: (u) => {
      const N = 72, outer = [], inner = [];
      for (let k = 0; k <= N; k++) {
        const t = k / N, th = ((-52 + 322 * t) * Math.PI) / 180;
        const R = 17.2 + 0.7 * Math.sin(t * 5.5);
        const w = 5.4 * Math.pow(1 - t, 0.42) * Math.min(1, t * 14 + 0.25) + 0.35;
        outer.push([24 + (R + w / 2) * Math.sin(th), 24 - (R + w / 2) * Math.cos(th)]);
        inner.push([24 + (R - w / 2) * Math.sin(th), 24 - (R - w / 2) * Math.cos(th)]);
      }
      const d = "M" + outer.map((p) => `${f2(p[0])} ${f2(p[1])}`).join("L") + "L" + inner.reverse().map((p) => `${f2(p[0])} ${f2(p[1])}`).join("L") + "z";
      return `<defs><mask id="m${u}"><circle class="mpath" pathLength="100" transform="rotate(-142 24 24)" cx="24" cy="24" r="17.4"/></mask></defs><path class="ink" mask="url(#m${u})" d="${d}"/><circle class="sundot" cx="24" cy="24" r="3.4"/>`;
    }
  }
];

const svgOf = (v, on) => `<svg class="${v.id} ${on ? "on" : ""}" viewBox="0 0 48 48" aria-hidden="true">${v.svg(++uid)}</svg>`;
const cardOf = (v) => `
  <article class="card">
    <h2>${v.tag}<span>·</span>${v.name}${v.group === "pick" ? `<em class="chosen">已入选</em>` : ""}</h2>
    <p>${v.idea}</p>
    <div class="stage">
      <div class="big">${svgOf(v, true)}<small>回答进行中</small></div>
      <div class="big">${svgOf(v, false)}<small>做完后静止</small></div>
    </div>
    <div class="uses">
      <div class="use tone-dark">${svgOf(v, true)}<b>Himawari</b><em>深色</em></div>
      <div class="use tone-light">${svgOf(v, false)}<b>Himawari</b><em>浅色</em></div>
    </div>
    <div class="side">${svgOf(v, false)}Himawari<span>侧栏品牌位</span></div>
  </article>`;
for (const g of ["pick", "new", "old"]) document.getElementById(`g-${g}`).innerHTML = V.filter((v) => v.group === g).map(cardOf).join("");
</script>
