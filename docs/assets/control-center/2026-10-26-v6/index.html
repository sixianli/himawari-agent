<title>Himawari 对话界面 v6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: prototype bar on top, one framed app window (sidebar | conversation | file panel), scene note below. Tokens follow the existing control-center palette. */
:root {
  color-scheme: dark;
  --page: #161616;
  --bg: #1e1e1e;
  --side: #232323;
  --surface: #282828;
  --raise: #2e2e2e;
  --input: #2a2a2a;
  --line: #343434;
  --text: #d6d6d3;
  --strong: #f0f0ec;
  --muted: #9a9a96;
  --accent: #d38ce2;
  --petal: #f2c14e;
  --seed: #6a4e2c;
  --accent-soft: rgba(211, 140, 226, 0.14);
  --model: #d38ce2;
  --tool: #8ab9e7;
  --you: #d6b55d;
  --prep: #8a8a86;
  --ok: #accd88;
  --danger: #efa095;
  --add: rgba(172, 205, 136, 0.13);
  --del: rgba(239, 160, 149, 0.13);
  --send: #ecece8;
  --send-ink: #1e1e1e;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --c-kw: #d38ce2;
  --c-str: #accd88;
  --c-fn: #8ab9e7;
  --c-num: #d6b55d;
  --c-cm: #8d8d88;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #ecebe6; --bg: #fcfcfb; --side: #f3f3f0; --surface: #ffffff; --raise: #f4f4f1; --input: #ffffff;
    --line: #e3e4dd; --text: #2a2e26; --strong: #12150f; --muted: #686d61; --accent: #87539c; --petal: #e6a917; --seed: #2b2621;
    --accent-soft: rgba(135, 83, 156, 0.1); --model: #9a62b0; --tool: #2f6ea6; --you: #9a7414; --prep: #a3a79c;
    --ok: #42682a; --danger: #a73c30; --add: rgba(66, 104, 42, 0.1); --del: rgba(167, 60, 48, 0.09);
    --send: #1f221c; --send-ink: #ffffff; --shadow: 0 12px 40px rgba(30, 30, 20, 0.14);
    --c-kw: #87539c; --c-str: #42682a; --c-fn: #285f91; --c-num: #806013; --c-cm: #6f7468;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #ecebe6; --bg: #fcfcfb; --side: #f3f3f0; --surface: #ffffff; --raise: #f4f4f1; --input: #ffffff;
  --line: #e3e4dd; --text: #2a2e26; --strong: #12150f; --muted: #686d61; --accent: #87539c; --petal: #e6a917; --seed: #2b2621;
  --accent-soft: rgba(135, 83, 156, 0.1); --model: #9a62b0; --tool: #2f6ea6; --you: #9a7414; --prep: #a3a79c;
  --ok: #42682a; --danger: #a73c30; --add: rgba(66, 104, 42, 0.1); --del: rgba(167, 60, 48, 0.09);
  --send: #1f221c; --send-ink: #ffffff; --shadow: 0 12px 40px rgba(30, 30, 20, 0.14);
  --c-kw: #87539c; --c-str: #42682a; --c-fn: #285f91; --c-num: #806013; --c-cm: #6f7468;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.is-scrolling { scrollbar-color: color-mix(in srgb, var(--muted) 55%, transparent) transparent; }
@supports not (scrollbar-color: auto) {
  ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  .is-scrolling::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--muted) 55%, transparent); }
}
body {
  background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.proto-bar { max-width: 1280px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.proto-bar strong { color: var(--strong); font-weight: 600; margin-right: auto; }
.proto-bar label { display: flex; gap: 6px; align-items: center; }
.proto-bar select, .proto-bar .replay { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; }
.scene-note { max-width: 1280px; margin: 12px auto 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.scene-note b { color: var(--text); font-weight: 600; }

.stage { display: flex; justify-content: center; }
.app {
  container-type: inline-size; position: relative; width: min(100%, 1280px); height: 820px;
  display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
}
.stage[data-width="phone"] .app { width: min(100%, 390px); height: 800px; }

.sidebar { width: 252px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px 10px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; }
.brand-mark { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 100%; height: 100%; overflow: visible; }
.app.mark-accent { --petal: var(--accent); --seed: color-mix(in srgb, var(--accent) 50%, #1a1320); }
.disc .seeds { transform-box: view-box; transform-origin: 24px 24px; transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
.disc .sd { fill: color-mix(in srgb, var(--petal) var(--p), var(--seed)); transform-box: fill-box; transform-origin: center; }
.brand-mark:hover .disc .seeds { transform: rotate(40deg); }
.disc.busy .seeds { animation: turn 48s linear infinite; animation-delay: var(--t, 0s); }
.disc.busy .sd { animation: seedwave 2.6s ease-in-out infinite; animation-delay: calc(var(--t, 0s) - var(--w)); }
.disc.hero .seeds { animation: turn 90s linear infinite; animation-delay: var(--t, 0s); }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes seedwave { 0%, 100% { opacity: 0.42; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1.12); } }
.greet .hero-mark { width: 76px; height: 76px; margin: 0 auto 14px; display: block; }
@media (prefers-reduced-motion: reduce) { .disc .seeds, .disc .sd { animation: none !important; transition: none; } }
.brand b { font-size: 16px; color: var(--strong); font-weight: 650; letter-spacing: 0.2px; flex: 1; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raise); color: var(--text); }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text); text-align: left; width: 100%; }
.nav-btn:hover { background: var(--raise); }
.nav-btn .k { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.side-group { margin-top: 14px; padding: 0 10px 4px; font-size: 12px; color: var(--muted); }
.side-list { display: flex; flex-direction: column; gap: 1px; overflow: auto; min-height: 0; flex: 1; }
.conv { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--text); text-align: left; width: 100%; font-size: 13.5px; }
.conv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.conv:hover { background: var(--raise); }
.conv[aria-current="page"] { background: var(--raise); color: var(--strong); }
.conv .run-mark { width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid var(--muted); border-top-color: transparent; animation: spin 1s linear infinite; flex: none; }
.account { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; display: flex; align-items: center; gap: 10px; padding-left: 8px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 13px; }
.account .name { flex: 1; color: var(--text); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid transparent; }
.topbar h1 { font-size: 15px; font-weight: 600; color: var(--strong); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .menu { display: none; }
.thread { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.col { max-width: 728px; margin: 0 auto; padding: 18px 28px 32px; display: flex; flex-direction: column; gap: 26px; }

.u-wrap { align-self: flex-end; max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.u-wrap .u-msg { max-width: 100%; }
.u-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 28px; }
.u-copy { opacity: 0; transition: opacity 0.15s ease; }
.u-wrap:hover .u-copy, .u-wrap:focus-within .u-copy { opacity: 1; }
@media (hover: none) { .u-copy { opacity: 1; } }
.tick-wrap { display: inline-flex; width: 18px; justify-content: center; }
svg.i.tick { width: 17px; height: 17px; stroke-width: 2; }
svg.i.tick.sent { color: var(--muted); }
svg.i.tick.read { color: var(--accent); }
.tick-clock { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--muted); border-top-color: transparent; animation: spin 0.9s linear infinite; }
.u-msg { align-self: flex-end; max-width: 80%; background: var(--raise); border-radius: 18px; padding: 10px 16px; line-height: 1.7; font-size: 15px; color: var(--strong); }
.a-msg { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.a-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.a-head .brand-mark { width: 26px; height: 26px; }
.a-head b { color: var(--text); font-weight: 600; }

/* Process */
.proc { border-radius: 12px; }
.proc-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px 6px 6px; margin-left: -6px; border-radius: 10px; color: var(--muted); font-size: 13.5px; text-align: left; }
.proc-head:hover { background: var(--raise); }
.proc-head .chev { transition: transform 0.18s ease; }
.proc.open .proc-head .chev { transform: rotate(90deg); }
.proc-head .lead { color: var(--text); white-space: nowrap; }
.proc-head .lead b { font-weight: 600; font-variant-numeric: tabular-nums; }
.proc-head .spark { flex: 0 1 132px; min-width: 60px; }
.proc-head .longest { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proc-head .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise); gap: 1px; }
.stack i { display: block; height: 100%; }
.c-model { background: var(--model); } .c-tool { background: var(--tool); } .c-you { background: var(--you); } .c-prep { background: var(--prep); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; animation-delay: var(--t, 0s); flex: none; }
.shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--strong) 45%, var(--muted) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.8s linear infinite; animation-delay: var(--t, 0s); }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
@keyframes spin { to { transform: rotate(360deg); } }
.ai { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.ai * { transform-box: fill-box; transform-origin: center; }
.row.active .row-ic, .proc-head .live-ic { color: var(--accent); }
.a-globe .mer { animation: meridian 1.6s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
.a-globe .mer.b { animation-delay: calc(var(--t, 0s) + -0.8s); }
@keyframes meridian { 0% { transform: scaleX(1); } 50% { transform: scaleX(0.02); } 100% { transform: scaleX(-1); } }
.a-think .big { animation: twinkle 1.6s ease-in-out infinite; animation-delay: calc(var(--t, 0s) + 0s); }
.a-think .small { animation: twinkle 1.6s ease-in-out infinite; animation-delay: calc(var(--t, 0s) + -0.8s); }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(0.72) rotate(18deg); opacity: 0.55; } }
.a-memory .page { transform-origin: left center; animation: flip 1.4s ease-in-out infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes flip { 0%, 15% { transform: scaleX(1); } 55%, 100% { transform: scaleX(-1); opacity: 0.2; } }
.a-context .l1 { animation: drop 1.5s ease-out infinite; animation-delay: calc(var(--t, 0s) + 0s); }
.a-context .l2 { animation: drop 1.5s ease-out infinite; animation-delay: calc(var(--t, 0s) + -0.5s); }
@keyframes drop { 0% { transform: translateY(-3px); opacity: 0; } 40%, 100% { transform: translateY(0); opacity: 1; } }
.a-write .ink { stroke-dasharray: 14; animation: ink 1.2s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
.a-write .pen { animation: pen 1.2s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes ink { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
@keyframes pen { from { transform: translateX(-6px); } to { transform: translateX(3px); } }
.a-file .ln1, .a-file .ln2, .a-file .ln3 { stroke-dasharray: 7; animation: ink 1.5s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
.a-file .ln2 { animation-delay: calc(var(--t, 0s) + -1s); } .a-file .ln3 { animation-delay: calc(var(--t, 0s) + -0.5s); }
.a-grep .lens { animation: orbit 1.6s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes orbit { 0% { transform: translate(0, 0); } 25% { transform: translate(2px, -1.5px); } 50% { transform: translate(0, -3px); } 75% { transform: translate(-2px, -1.5px); } 100% { transform: translate(0, 0); } }
.a-term .cur { animation: blink 1s steps(1) infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes blink { 50% { opacity: 0; } }
.a-edit .pen { animation: wiggle 0.9s ease-in-out infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
.a-you .ring { animation: ripple 1.8s ease-out infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@keyframes ripple { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
.a-resume { animation: spin 1.4s linear infinite; animation-delay: calc(var(--t, 0s) + 0s); }
@media (prefers-reduced-motion: reduce) { .ai, .ai * { animation: none !important; } }

.proc-body { margin-top: 6px; padding: 6px 0 4px; border-top: 1px solid var(--line); }
.axis { display: grid; grid-template-columns: 22px minmax(0, 1fr) 168px 58px; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 2px 6px 4px; font-variant-numeric: tabular-nums; }
.axis .ticks { grid-column: 3; display: flex; justify-content: space-between; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row-btn { display: grid; grid-template-columns: 22px minmax(0, 1fr) 168px 58px; gap: 10px; align-items: center; width: 100%; padding: 7px 6px; border-radius: 8px; text-align: left; }
.row-btn:hover { background: var(--raise); }
.row-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.row-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row-label { color: var(--text); white-space: nowrap; }
.row.top .row-label { font-weight: 600; color: var(--strong); }
.row-target { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--raise); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.tag.top { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.track { position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--raise) 70%, transparent); }
.bar { position: absolute; top: 0; bottom: 0; display: flex; border-radius: 4px; overflow: hidden; min-width: 2px; }
.bar i { display: block; height: 100%; }
.row-dur { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 13px; }
.row.active .row-dur { color: var(--accent); }
.row.active .row-label { color: var(--strong); }
.row-quote { margin: -2px 0 4px 38px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.row-detail { margin: 2px 6px 10px 38px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.seg-list { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.seg-list span { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.seg-list em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail-meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); color: var(--text); }
pre.raw { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
.children { list-style: none; margin: 0 0 6px 30px; padding: 0 0 0 8px; border-left: 1px solid var(--line); }
.children .row-btn { padding-block: 4px; font-size: 13px; }
.children .row-ic { width: 18px; height: 18px; }
.no-track .row-btn, .no-track .axis { grid-template-columns: 22px minmax(0, 1fr) 58px; }
.no-track .track, .no-track .axis { display: none; }
.lanes { margin: 6px 6px 10px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: 12.5px; }
.lane-name { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.lane-name b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: auto; }
.lane-track { position: relative; height: 22px; border-radius: 6px; background: color-mix(in srgb, var(--raise) 70%, transparent); }
.lane-block { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; min-width: 3px; overflow: hidden; color: var(--bg); font-size: 11px; line-height: 18px; padding: 0 5px; white-space: nowrap; text-overflow: ellipsis; text-align: left; transition: filter 0.15s ease, box-shadow 0.15s ease; }
.lane-block.half-a { bottom: 50%; } .lane-block.half-b { top: 50%; }
.lane-block.half-a, .lane-block.half-b { font-size: 0; padding: 0; }
.lane-block:hover, .lane-block.sel { filter: brightness(1.15); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px currentColor; }
.lane-block.live { animation: pulse-w 1.4s ease-in-out infinite; }
@keyframes pulse-w { 50% { opacity: 0.55; } }
.lane-axis { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: -2px; }
.metro { list-style: none; margin: 8px 6px 6px; padding: 0; }
.metro > li { display: grid; grid-template-columns: 44px 18px minmax(0, 1fr); column-gap: 10px; }
.m-time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; padding-top: 7px; }
.m-rail { position: relative; display: flex; justify-content: center; }
.m-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.m-seg { position: absolute; top: 13px; width: 4px; border-radius: 2px; bottom: -13px; }
.m-node { position: relative; margin-top: 8px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1.5px currentColor; background: var(--bg); z-index: 1; }
.m-node.fill { background: currentColor; }
.metro > li:last-child .m-seg { display: none; }
.metro .row-btn { grid-template-columns: 22px minmax(0, 1fr) 58px; padding: 5px 6px; }
.metro .track { display: none; }
.metro li.par .m-rail::after { content: ""; position: absolute; left: 50%; top: -14px; width: 12px; height: 22px; border: 2px solid var(--line); border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.metro li.par .row-btn { padding-left: 20px; }
.ring-wrap { display: flex; gap: 18px; align-items: flex-start; margin: 8px 6px 6px; }

  const sum = rows.reduce((m, r) => m + Number(r[4] || 0), 0);
  return `<div class="grid-wrap"><table class="grid"><thead><tr><th class="rn"></th>${hd.map((h, c) => `<th style="${num[c] ? "text-align:right" : ""}">${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r, n) => `<tr><td class="rn">${n + 1}</td>${r.map((v, c) => `<td class="${num[c] ? "n" : ""}">${num[c] ? Number(v).toLocaleString("zh-CN") : esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td class="rn"></td><td colspan="${hd.length - 1}">合计（预览里算的，不改文件）</td><td class="n">${sum.toLocaleString("zh-CN")}</td></tr></tfoot></table></div>`;
}
const rawLines = (text) => `<div class="panel-body flush"><pre class="src">${text.split("\n").map((l) => `<span class="ln">${esc(l) || " "}</span>`).join("")}</pre></div>`;
const TABS = { md: [["preview", "预览"], ["raw", "原文"]], csv: [["preview", "表格"], ["raw", "原文"]], html: [["preview", "网页"], ["raw", "源码"]], img: [["preview", "适应窗口"], ["raw", "原始大小"]] };
function renderPanel() {
  const panel = document.getElementById("panel");
  if (!state.panel) { panel.hidden = true; return; }
  const f = FILES[state.panel];
  panel.hidden = false;
  panel.classList.toggle("wide", !!state.wide);
  const raw = state.tab === "raw";
  let body;
  if (f.kind === "md" && f.verse) body = raw ? rawLines(poemMd.join("\n")) : `<div class="panel-body"><article class="reader verse">${mdRender(poemMd.join("\n").replace(/([^\n])\n(?=[^\n])/g, "$1\u2028"))}</article></div>`.replace(/\u2028/g, "\n");
  else if (f.kind === "md") {
    const heads = [...tripMd.matchAll(/^## (.*)$/gm)].map((m) => m[1]);
    body = raw ? rawLines(tripMd) : `<div class="panel-body" id="reader-scroll"><nav class="toc" aria-label="目录">${heads.map((h) => `<button type="button" data-act="toc" data-id="${esc(h)}">${esc(h)}</button>`).join("")}</nav><article class="reader">${mdRender(tripMd)}</article></div>`;
  }
  else if (f.kind === "csv") body = raw ? rawLines(tripCsv) : `<div class="panel-body flush" style="padding:0">${csvGrid(tripCsv)}</div>`;
  else if (f.kind === "html") body = raw ? rawLines(tripHtml.replace(/></g, ">\n<")) : `<div class="viewer-bar">${ic("globe")}在隔离的沙箱里渲染：不能联网、不能读你的数据<span class="sp"></span></div><div class="web-frame" id="web-frame"></div>`;
  else if (f.kind === "img") body = `<div class="img-stage ${raw ? "actual" : ""}"><img src="${tripPng}" alt="${esc(f.name)}"></div>`;
  else body = `<div class="panel-body flush"><pre class="src">${(state.panel === "mem" ? diffLines : [["+", "import { describe, expect, it } from \"vitest\";"], ["+", "import { memoriesToCsv } from \"../src/memory.js\";"], ["+", ""], ["+", "describe(\"memoriesToCsv\", () => {"], ["+", "  it(\"quotes commas, quotes and line breaks\", () => {"], ["+", "    const csv = memoriesToCsv([item(\"喜欢蓝色, 也喜欢绿色\")]);"], ["+", "    expect(csv.split(\"\\r\\n\")[1]).toContain('\"喜欢蓝色, 也喜欢绿色\"');"], ["+", "  });"], ["+", "});"]]).map(([k, l]) => `<span class="ln ${k === "+" ? "add" : k === "-" ? "del" : ""}">${k === " " ? " " : k} ${esc(l)}</span>`).join("")}</pre></div>`;
  const tabs = TABS[f.kind];
  panel.innerHTML = `<div class="panel-head">${ic("file")}<span class="pn"><b>${f.name}</b><small>${f.path}</small></span>
    ${tabs ? `<div class="tabs" role="group" aria-label="显示方式">${tabs.map(([k, t]) => `<button type="button" data-act="tab" data-id="${k}" aria-pressed="${state.tab === k}">${t}</button>`).join("")}</div>` : `<span class="tag">改动</span>`}
    <button class="icon-btn widen" type="button" aria-label="${state.wide ? "收窄预览" : "放宽预览"}" title="${state.wide ? "收窄" : "放宽"}" data-act="wide">${ic("side")}</button>
    ${f.kind === "img" ? "" : `<button class="icon-btn" type="button" aria-label="复制文件内容" data-act="copyfile">${ic(state.copied === "file" ? "check" : "copy")}</button>`}
    <button class="icon-btn" type="button" aria-label="关闭预览" data-act="closepanel">${ic("close")}</button></div>${body}`;
  const frame = document.getElementById("web-frame");
  if (frame) frame.attachShadow({ mode: "open" }).innerHTML = tripHtml;
}
function renderNote() { document.getElementById("note").innerHTML = SCENES[state.scene].note; document.getElementById("p-replay").hidden = state.scene !== "live"; }
function render() { renderSidebar(); renderTop(); renderThread(); renderComposer(); renderPanel(); renderNote(); }

function startSim() {
  clearInterval(state.timer);
  state.sim = { t0: performance.now(), now: 0, approvedAt: null, stopped: false, done: false, collapsed: false };
  state.open.live = undefined;
  state.timer = setInterval(() => {
    const sim = state.sim; if (sim.stopped) return;
    sim.now = (performance.now() - sim.t0) / 1000;
    const end = sim.approvedAt == null ? Infinity : 28.7 + sim.approvedAt - 9.2;
    if (sim.now >= end && !sim.done) { sim.done = true; setTimeout(() => { sim.collapsed = true; state.open.live = false; renderThread(); renderComposer(); renderSidebar(); }, 900); renderComposer(); renderSidebar(); }
    if (!sim.done || !sim.collapsed) renderThread();
    if (sim.done && sim.collapsed) clearInterval(state.timer);
  }, 100);
}
function setScene(s) {
  state.scene = s; state.panel = null; state.row = null; state.pop = null; state.srcOpen = false; state.drawer = false;
  document.getElementById("p-scene").value = s;
  if (s === "live") startSim(); else clearInterval(state.timer);
  render();
}
async function copy(text, key) {
  try { await navigator.clipboard.writeText(text); } catch (e) { }
  state.copied = key; render(); setTimeout(() => { state.copied = null; render(); }, 1400);
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || (b.dataset.act === "noop" && b.closest(".act-pop"))) { if (state.pop && (!ev.target.closest(".pop") || b)) { const wasAct = state.pop.startsWith("act:"); state.pop = null; if (wasAct) renderThread(); else renderComposer(); } if (b) ev.preventDefault(); return; }
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "noop") { ev.preventDefault(); return; }
  if (a === "proc") { const k = id; const cur = state.open[k] ?? (state.scene === "live" && !state.sim.collapsed); state.open[k] = !cur; renderThread(); return; }
  if (a === "row") { state.row = state.row === id ? null : id; renderThread(); return; }
  if (a === "group") { state.groups[id] = !state.groups[id]; renderThread(); return; }
  if (a === "src") { state.srcOpen = !state.srcOpen; renderThread(); return; }
  if (a === "file") { state.panel = state.panel === id ? null : id; state.tab = "preview"; renderThread(); renderPanel(); return; }
  if (a === "closepanel") { state.panel = null; renderThread(); renderPanel(); return; }
  if (a === "tab") { state.tab = id; renderPanel(); return; }
  if (a === "copy") { const md = document.querySelector(".a-msg .md")?.cloneNode(true); md?.querySelectorAll(".cite").forEach((c) => c.remove()); copy(md?.innerText || "", id); return; }
  if (a === "copyuser") { copy(SCENES[state.scene].user, "user"); return; }
  if (a === "copycode") { copy(document.querySelector(".code pre")?.innerText || "", "code"); return; }
  if (a === "copyfile") { const k = FILES[state.panel].kind; copy(state.panel === "poem" ? poemMd.join("\n") : state.panel === "guide" ? tripMd : k === "csv" ? tripCsv : k === "html" ? tripHtml : document.querySelector(".panel .src")?.innerText || "", "file"); return; }
  if (a === "wide") { state.wide = !state.wide; renderPanel(); return; }
  if (a === "toc") { const h = [...document.querySelectorAll(".reader h2")].find((x) => x.textContent === id); const sc = document.getElementById("reader-scroll"); if (h && sc) sc.scrollTo({ top: h.offsetTop - 56, behavior: "smooth" }); return; }
  if (a === "approve") { state.sim.approvedAt = state.sim.now; renderThread(); return; }
  if (a === "deny") { state.sim.stopped = true; state.sim.now = state.sim.now; clearInterval(state.timer); render(); return; }
  if (a === "stop") { state.sim.stopped = true; clearInterval(state.timer); state.open.live = true; render(); return; }
  if (a === "pop") { state.pop = state.pop === "model" ? null : "model"; renderComposer(); return; }
  if (a === "actmenu") { state.pop = state.pop === "act:" + id ? null : "act:" + id; renderThread(); return; }
  if (a === "plus") { state.pop = null; document.getElementById("picker").click(); return; }
  if (a === "model") { if (state.model !== id) { state.model = id; state.effort = defaultEffort(MODELS[id][2]); } renderComposer(); return; }
  if (a === "more") { state.moreModels = true; renderComposer(); return; }
  if (a === "effort") { state.effort = id; renderComposer(); return; }
  if (a === "unattach") { state.attach = state.attach.filter((t) => t.id !== id); state.attachErr = null; renderComposer(); return; }
  if (a === "drawer") { state.drawer = !state.drawer; renderSidebar(); return; }
  if (a === "goto") { const map = { news: "news", poem: "poem", trip: "trip", long: "long", "": "empty" }; if (id in map) setScene(map[id]); return; }
});
document.addEventListener("submit", (ev) => { ev.preventDefault(); });
const scrollTimers = new WeakMap();
function revealScrollbar(el) {
  el.classList.add("is-scrolling");
  clearTimeout(scrollTimers.get(el));
  scrollTimers.set(el, setTimeout(() => el.classList.remove("is-scrolling"), 900));
}
document.addEventListener("scroll", (ev) => { if (ev.target instanceof Element) revealScrollbar(ev.target); }, true);
document.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse") return;
  for (let el = ev.target instanceof Element ? ev.target : null; el && el !== document.body; el = el.parentElement) {
    const cs = getComputedStyle(el);
    if (el.scrollHeight > el.clientHeight + 1 && /(auto|scroll)/.test(cs.overflowY)) { const r = el.getBoundingClientRect(); if (ev.clientX > r.right - 16) revealScrollbar(el); return; }
  }
}, { passive: true });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { if (state.pop) { state.pop = null; renderComposer(); } else if (state.panel) { state.panel = null; renderThread(); renderPanel(); } }
  if (ev.target.id === "draft" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) ev.preventDefault();
});
document.getElementById("p-scene").addEventListener("change", (e) => setScene(e.target.value));
document.getElementById("p-mark").addEventListener("change", (e) => { document.getElementById("app").classList.toggle("mark-accent", e.target.value === "accent"); });
document.getElementById("p-theme").addEventListener("change", (e) => { if (e.target.value) document.documentElement.setAttribute("data-theme", e.target.value); else document.documentElement.removeAttribute("data-theme"); });
document.getElementById("p-width").addEventListener("change", (e) => { document.getElementById("stage").dataset.width = e.target.value; });
document.getElementById("p-replay").addEventListener("click", () => setScene("live"));
render();
</script>
