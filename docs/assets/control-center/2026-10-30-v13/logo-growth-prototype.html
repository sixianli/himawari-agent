<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生长 加螺旋</title>
<style>
:root{--bg:#1c1c1e;--panel:#242426;--line:#333336;--tx:#f2f2f2;--mut:#8e8e93;--gold:#f5b335}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;padding:32px 20px 64px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px;font-weight:600}p.sub{color:var(--mut);margin:0 0 20px;max-width:760px}
.bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.bar button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.bar button.on{border-color:var(--gold);color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;display:grid;grid-template-columns:260px 1fr;gap:26px}
.stage{display:flex;align-items:center;justify-content:center;min-height:240px;border-radius:14px;background:radial-gradient(circle at 50% 45%,#2a2a2d,#1e1e20)}
.card h2{font-size:17px;margin:0 0 4px;font-weight:600}.card h2 span{color:var(--gold);margin-right:8px}
.idea{color:var(--tx);margin:0 0 10px}.motion{color:var(--mut);margin:0 0 14px;font-size:13px}
.uses{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.uses figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:11px}
.tile{width:88px;height:88px;border-radius:20px;background:linear-gradient(160deg,#2e2e31,#151517);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #ffffff12}
.side{display:flex;align-items:center;gap:9px;padding:8px 12px;background:#171718;border-radius:10px}.side b{font-size:15px}.side small{display:block;color:var(--mut);font-size:9px;letter-spacing:3px;margin-top:-3px}
svg{display:block;overflow:visible}
@media (max-width:720px){.card{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Himawari 标志 · 「生长 · 原版精修」加斐波那契螺旋</h1>
<p class="sub">出发点有两个：名字"向日葵"的本义是始终朝向太阳；愿景第一句是"始终朝向你"，还有"时间站在 Himawari 这边"。原版精修本来就按斐波那契螺旋（黄金角 137.5°）排列，只是点太稀看不出螺旋线。下面 4 种做法让螺旋显出来，第一张是原版对照。</p>
<div class="bar"><span style="color:var(--mut)">状态：</span>
<button data-s="idle" class="on">空闲</button><button data-s="think">思考中</button><button data-s="load">等待加载</button>
<button id="rm" style="margin-left:auto">模拟"减少动态效果"：关</button></div>
<div id="list"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',G=Math.PI*(3-Math.sqrt(5)),TAU=Math.PI*2;
let state='idle',forceRM=false;const mq=matchMedia('(prefers-reduced-motion: reduce)');
const reduced=()=>forceRM||mq.matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
let uid=0;
function defs(svg){const d=el('defs',{},svg);const id='g'+(uid++);
 const pg=el('linearGradient',{id:id+'p',x1:0,y1:1,x2:0,y2:0},d);el('stop',{offset:0,'stop-color':'#e08a12'},pg);el('stop',{offset:1,'stop-color':'#ffd25a'},pg);
 const dg=el('radialGradient',{id:id+'d',cx:.5,cy:.45,r:.6},d);el('stop',{offset:0,'stop-color':'#2a170a'},dg);el('stop',{offset:1,'stop-color':'#5a3510'},dg);
 const sg=el('radialGradient',{id:id+'s',cx:.4,cy:.35,r:.75},d);el('stop',{offset:0,'stop-color':'#fff1c2'},sg);el('stop',{offset:.45,'stop-color':'#ffc23d'},sg);el('stop',{offset:1,'stop-color':'#d9780d'},sg);
 return id}

const C3=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],clamp(t)))).join(',')})`;
const NEW=[255,236,170],GOLD=[245,178,48],AMB=[214,128,20],BRN=[92,52,16],DK=[34,18,6];
function grower(opt){return {
 build(svg,px){const small=px<40;const n=small?(opt.nSmall||60):(opt.n||120);if(opt.extra)opt.extra(svg,px);const C=[];for(let i=0;i<n+2;i++)C.push(el('circle',{},svg));
  return {C,n,T:opt.startEmpty?0:n+8,last:null,small,t0:null}},
 frame(o,t,s){const rm=reduced();if(o.t0==null)o.t0=t;
  let rate=rm?0:s==='think'?(opt.thinkRate||7):s==='load'?1.2:(opt.idleRate??.35);
  if(opt.startEmpty&&!rm&&o.T<o.n)rate=Math.max(rate,o.n/1.6);
  if(rm&&opt.startEmpty)o.T=o.n+8;
  const dt=o.last==null?0:Math.min(.05,t-o.last);o.last=t;o.T+=dt*rate;
  const T=o.T,base=Math.floor(T),c=(opt.R||40)/Math.sqrt(o.n);
  o.C.forEach((e,k)=>{const i=base-k,age=T-i;if(age<0||age>o.n||i<0&&opt.startEmpty){e.setAttribute('r',0);return}
   const r=c*Math.sqrt(age),a=i*G+(opt.spin?t*opt.spin:0),u=age/o.n;
   if(opt.keep&&!opt.keep(r,a,u)){e.setAttribute('r',0);return}
   const born=clamp(age/1.2),fade=opt.noFade?1:clamp((o.n-age)/6);
   e.setAttribute('cx',r*Math.cos(a));e.setAttribute('cy',r*Math.sin(a));
   const st=opt.style(u,i,age,s,o.small,r);
   e.setAttribute('r',st.r*born*(o.small?(opt.smallScale||1.25):1));e.setAttribute('fill',st.c);e.setAttribute('opacity',(st.o??1)*fade)})}}}

const baseCol=(u,age,s)=>u<.06||(s==='load'&&age<3)?C3(NEW,NEW,0):u<.5?C3(BRN,AMB,u/.5):C3(AMB,GOLD,(u-.5)/.5);
const shade=(col,k)=>col.replace(/rgb\((\d+),(\d+),(\d+)\)/,(m,r,g,b)=>`rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`);
const mod=(a,n)=>((a%n)+n)%n;
const CONCEPTS=[
{title:'对照：原版精修（120 点）',idea:'你选的那一版，作为对照。它的每颗种子都已经按黄金角 137.5° 排列，这正是真实向日葵的排法，但只有 120 颗点而且大小差得多，螺旋线在眼睛里连不起来。',
 motion:'与原版相同。',
 ...grower({style:(u,i,age,s)=>({r:.7+2.5*Math.sqrt(u),c:baseCol(u,age,s)})})},
{title:'A　加密到 233 点',idea:'只把点数从 120 提到 233（也是斐波那契数），点的大小差变小。点一密，眼睛自然会看到顺时针 13 条、逆时针 21 条螺旋交错，就像真花盘。颜色和动效完全不变，改动最小。',
 motion:'与原版相同，生长时螺旋线跟着缓缓转动。',
 ...grower({n:233,nSmall:89,R:41,style:(u,i,age,s)=>({r:.9+1.5*Math.sqrt(u),c:baseCol(u,age,s)})})},
{title:'B　隔条加深（21 条螺旋）',idea:'在 A 的基础上，把 21 条螺旋臂隔一条加深一点：同一条螺旋上的种子编号除以 21 的余数相同，余数为偶数的整条臂亮 10%，奇数的暗 10%。螺旋会像花纹一样清楚地浮出来，但仍然只有圆点、只有一种色系。',
 motion:'生长时，亮暗相间的 21 条螺旋臂整体缓缓转动，像真实花盘在旋。思考时转得快。',
 ...grower({n:233,nSmall:89,R:41,style:(u,i,age,s)=>({r:.9+1.5*Math.sqrt(u),c:shade(baseCol(u,age,s),mod(i,21)%2?.78:1.08)})})},
{title:'C　双向交织（13 × 21）',idea:'同时标出两组螺旋：顺时针 13 条、逆时针 21 条。两组的亮暗叠在一起，形成真实向日葵最有名的那种菱形交织纹路。数学感最强，在大图上最惊艳；小尺寸下会退化成普通花盘，不会乱。',
 motion:'生长时交织纹路同时向两个方向流动。',
 ...grower({n:233,nSmall:89,R:41,style:(u,i,age,s)=>({r:.9+1.5*Math.sqrt(u),c:shade(baseCol(u,age,s),((mod(i,13)%2)^(mod(i,21)%2))?.75:1.08)})})},
{title:'D　只亮两条主螺旋',idea:'其余种子保持原版颜色，只有两条从花心通到边缘的螺旋臂是亮金色（顺、逆时针各一条）。它们像"时间线"：最新的种子在花心，沿着这条线一路走到最老的边缘。生长时亮线会转动，提示"这是一个斐波那契螺旋"。',
 motion:'生长时亮线绕着花心慢慢转；思考时转得快，像一根指针在扫过记忆。',
 ...grower({n:233,nSmall:89,R:41,style:(u,i,age,s)=>{const on=mod(i,21)===0||mod(i,34)===0;return {r:(.9+1.5*Math.sqrt(u))*(on?1.15:1),c:on&&u>.06?C3([255,222,130],[255,200,80],u):baseCol(u,age,s)}}})}
];
CONCEPTS.forEach(c=>{if(c.title.includes('日冕')){const f=c.frame;c.frame=(o,t,s)=>{f(o,t,s);const ring=o.C[0].ownerSVGElement.__ring;if(ring){const rm=reduced();let op=.45;if(!rm){if(s==='think')op=.4+.5*Math.pow(.5+.5*Math.sin(t*7),3);else if(s==='load')op=.3+.4*(.5+.5*Math.sin(t*2.5));else op=.4+.1*Math.sin(t*.8)}ring.setAttribute('opacity',op)}}}});
const insts=[];
function mount(host,px,c,interactive){const s=el('svg',{viewBox:'-50 -50 100 100',width:px,height:px});host.prepend(s);const o=c.build(s,px);const inst={c,o,mouse:null};insts.push(inst);
 if(interactive){s.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect();inst.mouse={x:(e.clientX-r.left)/r.width*100-50,y:(e.clientY-r.top)/r.height*100-50}});s.addEventListener('pointerleave',()=>inst.mouse=null)}}
const list=document.getElementById('list');
CONCEPTS.forEach((c,i0)=>{const i='G'+i0;{const card=document.createElement('div');card.className='card';
 card.innerHTML=`<div class="stage"></div><div><h2><span>${i0+1}</span>${c.title}</h2><p class="idea">${c.idea}</p><p class="motion">${c.motion}</p>
 <div class="uses"><figure><div class="tile"></div>App 图标</figure><figure><div class="side"><span class="s28"></span><div><b>Himawari</b><small>ひまわり</small></div></div>侧栏 28px</figure><figure><span class="s20"></span>20px</figure><figure><span class="s16"></span>16px</figure></div></div>`;
 list.appendChild(card);
 mount(card.querySelector('.stage'),200,c,true);mount(card.querySelector('.tile'),56,c);mount(card.querySelector('.s28'),28,c);mount(card.querySelector('.s20'),20,c);mount(card.querySelector('.s16'),16,c)}});
function draw(now){const t=now/1000;const st=reduced()?'idle':state;insts.forEach(({c,o,mouse})=>c.frame(o,t,reduced()?state:st,reduced()?null:mouse));requestAnimationFrame(draw)}
requestAnimationFrame(draw);
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
const rmb=document.getElementById('rm');rmb.onclick=()=>{forceRM=!forceRM;rmb.textContent='模拟"减少动态效果"：'+(forceRM?'开':'关');rmb.classList.toggle('on',forceRM)};
</script></body></html>
