title = "Himawari fixed Gitleaks defaults"

[extend]
useDefault = true

[[allowlists]]
description = "Qualification evidence maps a repository path to the SHA-256 of that file; see ADR 0157"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)test/qualification/evidence/workspace-authorization-lifecycle/''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+/[^"]+\.[A-Za-z0-9]{1,8}": "[0-9a-f]{64}",?\s*$''']
