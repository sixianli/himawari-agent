title = "Himawari fixed Gitleaks defaults"

[extend]
useDefault = true

[[allowlists]]
description = "Qualification evidence maps a repository path to the SHA-256 of that file; see ADR 0157"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)test/qualification/evidence/workspace-authorization-lifecycle/''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+/[^"]+\.[A-Za-z0-9]{1,8}": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "已删除的证据清单里的 git 对象号（40 位），文件名在键里，默认规则当成密钥；只限该文件的历史"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)\.agents/tasks/round2-tool-execution/evidence\.jsonl$''']
regexTarget = "match"
regexes = ['''^[^"\s]+\.[A-Za-z0-9]+": "[0-9a-f]{40}"$''']

[[allowlists]]
description = "ADR 0157 白名单漏掉的一行：资格证据回读文件里不带目录的日志文件名对应的 SHA-256"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)test/qualification/evidence/workspace-authorization-lifecycle/p4-completion-01/archive-readback\.json$''']
regexTarget = "match"
regexes = ['''^p4-save-secrets-final\.log": "0803b00889e1a37bf2645a12f203d89c5a695b27538e322db7e962339e6a416a"$''']

[[allowlists]]
description = "Web Push 公开测试向量（RFC 8291）里的 auth 值，只限这两个已审阅的测试和夹具文件"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)(?:test/integration/production-web-push-control\.test\.ts|packages/gateway-contracts/test/gateway-v2\.fixture\.ts)$''']
regexTarget = "secret"
regexes = ['''^BTBZMqHH6r4Tts7J_aSIgg$''']

[[allowlists]]
description = "已删除的旧推送通道单元测试里的 22 位占位设备值（提交 f73b0b76，已在 9dcdb6e 删除），只限该文件的历史"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)apps/agent-service/test/production-reminder-push\.unit\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^F5u42Bd3HyW8KxkUqo2gRA$''']

[[allowlists]]
description = "前台结果单元测试里的合成 Bearer 令牌"
condition = "AND"
targetRules = ["curl-auth-header"]
paths = ['''(?:^|/)apps/agent-service/test/production-foreground-result\.unit\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^R2T14BEARERVALUE0001$''']

[[allowlists]]
description = "记忆抽取评测数据集里的假 GitHub 令牌（已离线核对）"
condition = "AND"
targetRules = ["github-pat"]
paths = ['''(?:^|/)test/fixtures/memory-capture-eval/dataset\.json$''']
regexTarget = "secret"
regexes = ['''^gh[p]_Zk3Qw8Lm2VxN9sTdR4bYf7HcJ1pUa6EoXe5G$''']

[[allowlists]]
description = "沙箱探针脚本里的 tmpfs 大小参数，不是密钥"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)test/qualification/evidence/isolated-tool-execution/p0-platform-probe-01/probe\.sh$''']
regexTarget = "secret"
regexes = ['''^tmpfs-size=1048576$''']

[[allowlists]]
description = "已删除的诊断说明里的线程编号（UUID），只限该文件的历史"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)scripts/operations/cache-zero-diagnosis/README\.md$''']
regexTarget = "secret"
regexes = ['''^f504128e-d710-44e1-a304-6b61c370ef24$''']

[[allowlists]]
description = "PR 273 复核记录里模型原样引用的合成启动令牌（测试里的 tokenValue 样例），只限这两个记录文件"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)\.agents/reviews/pr-273/round-[14]/deepseek-v4\.1-flash\.md$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "敏感信息拦截记录清除接口测试里的幂等键，不是密钥"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)apps/agent-service/test/production-http-composition\.unit\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^sensitive-interceptions-clear-01$''']

[[allowlists]]
description = "白名单测试里用来核对回读文件那一行的同一个文件摘要，只限这个测试文件"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)test/tooling/gitleaks-allowlist\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^0803b00889e1a37bf2645a12f203d89c5a695b27538e322db7e962339e6a416a$''']

[[allowlists]]
description = "PR 274 第 7 轮复核记录第 37 行：讨论遮盖规则时引用的私钥开头标记，后面是说明文字，没有密钥，只限这一个记录文件"
condition = "AND"
targetRules = ["private-key"]
paths = ['''(?:^|/)\.agents/reviews/pr-274/round-7/deepseek-v4\.1-flash\.md$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN PRIVATE KEY----- is used \.\.\.`''']

[[allowlists]]
description = "PR 274 第 7 轮复核记录第 117 行：列举没覆盖到的私钥开头标记，后面是说明文字，没有密钥，只限这一个记录文件"
condition = "AND"
targetRules = ["private-key"]
paths = ['''(?:^|/)\.agents/reviews/pr-274/round-7/deepseek-v4\.1-flash\.md$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN ENCRYPTED PRIVATE KEY-----`、`DSA PRIVATE KEY` ''']

[[allowlists]]
description = "PR 317 拆分测试文件的提交 206eb64e 里遮盖测试的假私钥开头标记（后面是重复的说明文字，没有密钥），只限这个测试文件；当前版本已改成 join 拼写"
condition = "AND"
targetRules = ["private-key"]
paths = ['''(?:^|/)test/tooling/opencode-review-merge-gate\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN PRIVATE KEY----- \$\{"说明"\.repeat\(5000\)\}''']

[[allowlists]]
description = "遮盖测试里用 join 拼出的假私钥结尾（MIIEvR2T14TAILBODY 后接 END 标记），只限这个测试文件"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)apps/agent-service/test/pi-coding-program\.unit\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^MIIEvR2T14TAILBODY$''']

[[allowlists]]
description = "DeepSeek 网页提供方单元测试里网址查询串的假令牌，用来核对遮盖；只限这个测试文件（含提交 e5edb5469 里的同一行）"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)packages/platform-node/test/deepseek-web-provider\.unit\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^abcdef123456$''']

[[allowlists]]
description = "PR 312 第 3 轮判断、PR 316 第 1 轮和 PR 319 第 1 轮复核记录里原样引用的 deepseek 测试假令牌（值见 regexes），只限这几个记录文件，按 ADR 0177 锚定到具体文件"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)\.agents/reviews/(?:pr-312/round-3/judgments\.md|pr-316/round-1/(?:deepseek-v4\.1-flash|glm-5\.3-flash)(?:\.prompt)?\.md|pr-319/round-1/glm-5\.3-flash\.md)$''']
regexTarget = "secret"
regexes = ['''^abcdef123456$''']

[[allowlists]]
description = "本机向量模型出包脚本里三个模型的 tokenizer 文件 SHA-256（逐个精确值，历史提交里以文件名为键），见 ADR 0224"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)scripts/embedding-models/build-artifact\.py$''']
regexTarget = "secret"
regexes = ['''^(?:aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4|9da9b391de9bb545e047bdfd5d9abefe32ee41937acf6c3b06aae33d85d0a4b4|def76fb086971c7867b829c23a26261e38d9d74e02139253b38aeb9df8b4b50a|977648852447cb6587327ff3205b0a84cf2fc9f05621d6c8e88a497caafab2e1|4d777ef5bdc1aa36227abdfb77c3e49e7b9c892d16e1b6bda41c393504828be4|17bd5d6e9364ca49a534e1502076593317c298d4a663623091ed45388f004874)$''']

[[allowlists]]
description = "保险箱合约夹具里用固定假钥匙算出的四个密文（wrappedKey、password 字段的 base64，逐个精确值），手机和服务器测试互相解开用；只限这一个夹具文件（Andy 2026-11-25 同意）"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)clients/apple/Tests/HimawariCoreTests/Fixtures/vault-contract\.json$''']
regexTarget = "secret"
regexes = ['''^(?:OJcMhbm3WDiSpM1vIJuD1qnNNVIJ0hTf75YUIS9f/c6Qo98Y9w4CnxSW0UGHkewWlVHlFpwsGvui/nsG|tByJMmanrteJYrzRyAz6eC7I\+9mY5n5XMjMmS01n940gxxayiFeZE/6q|XGIcgad/HQpwhhB3ypIea5eB2sEm5ufBGncMjFIZKSwR44rKumK8mSkH|uZP0fC70wm4e\+scCIDFNsUTSMXyWlwzXpo70DxbK9KJ6kd4XjfSuZN9OQSvjdn9coV0ImLS4JBvMBl2U)$''']

[[allowlists]]
description = "安全例外清单里 arm64 onnxruntime 原生库那条的旧版审阅说明（PR 737 的一个提交），原文引了 OpenSSL 内置的 PEM 开头、结尾标记常量，两两相连，中间没有密钥内容；只认这一个文件里这一段原文，现行文件已改成不含标记的说法"
condition = "AND"
targetRules = ["private-key"]
paths = ['''(?:^|/)ci/security-exceptions\.json$''']
regexTarget = "secret"
regexes = ['''^-{5}BEGIN RSA PRIVATE KEY-{5}\\" 与 \\"-{5}END EC PRIVATE KEY-{5}\\"、\\"-{5}BEGIN EC PRIVATE KEY-{5}\\" 与 \\"-{5}END PRIVATE KEY-{5}$''']
