name: arm64 rehearsal
on:
  push:
    branches: [claude/project-thread-adskmq]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  rehearsal:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node 22.22.3
      - run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - run: sudo bash scripts/ci/prepare-hosted.sh "$PWD/.ci-output/tools/bin/node"
      - name: build like build-candidate.sh
        run: |
          run=reh
          export PATH=$PWD/.ci-output/tools/bin:/usr/bin:/bin HIMAWARI_CI_TOOLS=$PWD/.ci-output/tools HIMAWARI_CI_PYTHON=$PWD/.ci-output/tools/python/python/bin/python3
          scratch=$(mktemp -d /tmp/hXXXX); chmod 700 "$scratch"
          set +e
          env -u GITHUB_ACTIONS TMPDIR=$scratch HIMAWARI_TEST_TEMP_ROOT=$scratch node scripts/ci/local.mjs --check build --tools "$HIMAWARI_CI_TOOLS" --output ".ci-output/$run" > build.log 2>&1
          echo "build-rc=$?"
          set -e
          tail -n 60 build.log
          ls -la .ci-output/$run .ci-output/$run/build-linux-arm64 || true
          if grep -q PUBLIC_ARTIFACT_CONTAINS_SECRET build.log; then
            mkdir -p "$RUNNER_TEMP/unpacked" && tar -xzf .ci-output/$run/build-linux-arm64/linux-arm64-abi*-1.tar.gz -C "$RUNNER_TEMP/unpacked"
            node --input-type=module -e '
            import { readdirSync, readFileSync, lstatSync } from "node:fs";
            import { join, relative } from "node:path";
            import { gunzipSync } from "node:zlib";
            import { findBuildSecrets } from "./scripts/ci/security-source.mjs";
            import { redactText } from "./scripts/ci/redact-text.mjs";
            const root = process.argv[1];
            const walk = (dir) => { for (const name of readdirSync(dir)) { const full = join(dir, name); const stat = lstatSync(full); if (stat.isDirectory()) walk(full); else if (stat.isFile()) { const rel = relative(root, full); if (redactText(rel, { sentinels: [] }) !== rel) console.log("REHEARSAL_SECRET_NAME", rel); check(rel, readFileSync(full)); } } };
            const check = (name, bytes) => {
              const findings = findBuildSecrets({ name, bytes });
              const text = bytes.toString("utf8");
              const redacted = redactText(text, { sentinels: [] }) !== text;
              if (findings.length || redacted) console.log("REHEARSAL_SECRET_HIT", name, JSON.stringify(findings.map((f) => [f.rule, f.line])), "redactText=" + redacted);
              if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) { try { check(name + "!gunzip", gunzipSync(bytes)); } catch {} }
            };
            check("NAME_CHECK", Buffer.from(""));
            walk(root);
            ' "$RUNNER_TEMP/unpacked" | head -50
          fi
          /usr/bin/python3 -I scripts/delivery-mode/hermes/layer3-verdict.py ".ci-output/$run/local-summary.json" "$(git rev-parse HEAD)" build
          mkdir -p rehearsal/materials
          cp .ci-output/$run/build-linux-arm64/linux-arm64-abi*-1.tar.gz rehearsal/materials/
          find .ci-output/$run -maxdepth 2 | sort
          cp .ci-output/$run/build-linux-arm64/context.json rehearsal/materials/context.json || { echo "REHEARSAL_NO_REPORT_CONTEXT"; cp .ci-output/$run/context.json rehearsal/materials/context.json; }
          /usr/bin/python3 -I - .ci-output/$run/build-linux-arm64/build/build.json rehearsal/materials/linux-arm64-abi*-1.tar.gz rehearsal/materials/context.json "$(git rev-parse HEAD)" <<'PY'
          import hashlib, json, os, sys
          build = json.load(open(sys.argv[1]))
          artifact, context = sys.argv[2], sys.argv[3]
          assert build["status"] == "passed"
          assert build["archiveSha256"] == hashlib.sha256(open(artifact, "rb").read()).hexdigest()
          assert build["archiveBytes"] == os.path.getsize(artifact)
          assert build["manifest"]["context"]["testedSha"] == sys.argv[4]
          assert json.load(open(context))["testedSha"] == sys.argv[4]
          print("REHEARSAL_BUILD_RECORD_OK", build["manifest"]["sourceTreeSha256"])
          PY
      - name: walkthrough like run-release-walkthrough.sh
        run: |
          .ci-output/tools/bin/node node_modules/playwright/cli.js install chromium
          sudo apt-get install -y -q fd-find
          mkdir -p "$RUNNER_TEMP/pitools" && ln -s "$(command -v fdfind)" "$RUNNER_TEMP/pitools/fd" && ln -s "$(command -v rg)" "$RUNNER_TEMP/pitools/rg"
          artifact=$(ls rehearsal/materials/linux-arm64-abi*-1.tar.gz)
          walk=$PWD/rehearsal/walkthrough; mkdir -p "$walk"
          scratch=$(mktemp -d /tmp/hXXXX); chmod 700 "$scratch"
          export PATH=$PWD/.ci-output/tools/bin:/usr/bin:/bin HIMAWARI_CI_TOOLS=$PWD/.ci-output/tools HIMAWARI_CI_PYTHON=$PWD/.ci-output/tools/python/python/bin/python3 HIMAWARI_TEST_PI_TOOLBIN=$RUNNER_TEMP/pitools
          set +e
          env -u GITHUB_ACTIONS -u CI TMPDIR=$scratch HIMAWARI_TEST_TEMP_ROOT=$scratch HIMAWARI_PRODUCT_PATH_E2E=1 HIMAWARI_PRODUCT_PATH_BROWSER_CHANNEL=chromium \
            HIMAWARI_PRODUCT_PATH_OUTPUT="$walk/product-path" HIMAWARI_TEST_ARTIFACT="$PWD/$artifact" HIMAWARI_TEST_CONTEXT="$PWD/rehearsal/materials/context.json" \
            node node_modules/vitest/vitest.mjs run --config vitest.workspace.ts --project qualification-product-path test/integration/product-path-browser.test.ts \
            -t 'release acceptance in a real browser' --reporter=default > "$walk/vitest.log" 2>&1
          code=$?
          tail -n 120 "$walk/vitest.log"
          ls -la "$walk/product-path" || true
          exit $code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-logs
          path: |
            build.log
            rehearsal/walkthrough
          if-no-files-found: ignore
