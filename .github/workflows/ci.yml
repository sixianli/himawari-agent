  browser:
    name: browser / ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: chromium
            runner: ubuntu-24.04
