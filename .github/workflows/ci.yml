name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: 明确的比较基线 commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check policy --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 保留本次完整报告
        id: artifact
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-${{ github.run_id }}-${{ github.run_attempt }}-policy-${{ env.CI_MATRIX }}
          path: .ci-output/public/reports/
          if-no-files-found: error
          retention-days: 30
      - name: 保留失败诊断
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-policy-${{ env.CI_MATRIX }}
          path: .ci-output/public/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  static:
    name: static
    runs-on: ubuntu-24.04
    needs:
      - policy
    timeout-minutes: 15
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check static --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 保留本次完整报告
        id: artifact
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-${{ github.run_id }}-${{ github.run_attempt }}-static-${{ env.CI_MATRIX }}
          path: .ci-output/public/reports/
          if-no-files-found: error
          retention-days: 30
      - name: 保留失败诊断
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-static-${{ env.CI_MATRIX }}
          path: .ci-output/public/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  build:
    name: build / ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    needs:
      - policy
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
          - key: macos-arm64
            runner: macos-15
            os: darwin
            arch: arm64
            node: 22.22.3
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: NEGATIVE CONTROL — upstream-install — draft PR 2 only
        run: |-
          .ci-output/tools/bin/node --input-type=module <<'HIMAWARI_NEGATIVE_CONTROL'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import * as fs from "node:fs";
          import path from "node:path";
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          assert.equal(process.env.GITHUB_REPOSITORY, "sixianli/himawari-agent");
          assert.equal(process.env.GITHUB_EVENT_NAME, "pull_request");
          assert.equal(event.number, 2);
          assert.equal(event.pull_request?.number, 2);
          assert.equal(event.pull_request?.draft, true);
          assert.equal(event.pull_request?.head?.ref, "codex/ci-negative-controls");
          assert.equal(event.pull_request?.head?.repo?.full_name, "sixianli/himawari-agent");
          assert.equal(event.pull_request?.base?.repo?.full_name, "sixianli/himawari-agent");
          assert.match(process.env.GITHUB_RUN_ID ?? "", /^[1-9][0-9]*$/);
          assert.match(process.env.GITHUB_RUN_ATTEMPT ?? "", /^[1-9][0-9]*$/);
          assert.match(process.env.GITHUB_SHA ?? "", /^[a-f0-9]{40}$/);
          assert.equal(fs.realpathSync(process.cwd()), fs.realpathSync(process.env.GITHUB_WORKSPACE));
          const sha256 = bytes => createHash("sha256").update(bytes).digest("hex");
          const identity = { case: "upstream-install", repository: process.env.GITHUB_REPOSITORY, pr: event.number, headSha: event.pull_request.head.sha, testedSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: Number(process.env.GITHUB_RUN_ATTEMPT) };
          console.log(JSON.stringify({ negativeControl: "authorized-draft-only", ...identity }));
          assert.ok(["linux-x64", "macos-arm64"].includes(process.env.CI_MATRIX));
          const filename = "package-lock.json";
          assert.equal(fs.lstatSync(filename).isSymbolicLink(), false);
          const before = fs.readFileSync(filename);
          const lock = JSON.parse(before);
          assert.equal(lock.lockfileVersion, 3);
          const entry = lock.packages["node_modules/ajv"];
          assert.ok(entry && !entry.optional && !entry.link);
          assert.match(entry.integrity, /^sha512-[A-Za-z0-9+/]+=*$/);
          const wrong = "sha512-" + Buffer.alloc(64).toString("base64");
          assert.notEqual(entry.integrity, wrong);
          entry.integrity = wrong;
          fs.writeFileSync(filename, JSON.stringify(lock, null, 2) + "\n");
          console.log(JSON.stringify({ ...identity, injection: "runner-only-ajv-integrity", beforeSha256: sha256(before), afterSha256: sha256(fs.readFileSync(filename)), expectedNextStep: "real-npm-ci-integrity-failure" }));
          HIMAWARI_NEGATIVE_CONTROL
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check build --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 保留本次完整报告
        id: artifact
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ env.CI_MATRIX }}
          path: .ci-output/public/reports/
          if-no-files-found: error
          retention-days: 30
      - name: 保留失败诊断
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ env.CI_MATRIX }}
          path: .ci-output/public/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: 按平台传递不可变 artifact ID
        run: .ci-output/tools/bin/node scripts/ci/artifact-output.mjs
        id: identity
        env:
          CI_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
    outputs:
      linux: ${{ steps.identity.outputs.linux }}
      macos: ${{ steps.identity.outputs.macos }}
  test:
    name: test / ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    needs:
      - policy
      - build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
          - key: macos-arm64
            runner: macos-15
            os: darwin
            arch: arm64
            node: 22.22.3
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
