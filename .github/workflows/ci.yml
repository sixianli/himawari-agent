        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 取 main 存的依赖和浏览器下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/himawari-ci/npm
            ~/.cache/himawari-ci/native
            .ci-output/browsers
          key: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'ci/toolchain-lock.json', 'scripts/ci/install-dependencies.mjs') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 准备 GitHub 托管机器上的沙箱和浏览器依赖
        run: sudo bash scripts/ci/prepare-hosted.sh "$PWD/.ci-output/tools/bin/node"
      - name: 安装工具测试用的 Chromium
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install --only-shell chromium
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check tooling --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "tooling-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tooling-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tooling-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "tooling/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04-arm
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 取 main 存的依赖和浏览器下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/himawari-ci/npm
            ~/.cache/himawari-ci/native
            .ci-output/browsers
          key: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'ci/toolchain-lock.json', 'scripts/ci/install-dependencies.mjs') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 执行共享检查
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check security --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "security-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/security-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-security-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "security/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  required:
    name: ci/required
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - policy
      - static
      - build
      - tests
      - tooling
      - security
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - name: 草稿和被取消的运行直接判失败
        id: entry
        env:
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          CI_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$CI_DRAFT" != false ]; then echo "CI_DRAFT_UNVERIFIED 草稿 PR 不跑 CI，标成准备合并后才跑完整检查"; exit 1; fi
          if [ "$CI_CANCELLED" != false ]; then echo "CI_UPSTREAM_CANCELLED 上游作业被取消，这一轮不算数"; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: main 上失败的运行满两次必须认领到事故清单
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node scripts/check-incident-runs.mjs; fi
      - name: PR 的 CI 红过两次必须在说明里写复盘
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REFLECTION_AGGREGATE_JOB: ci/required
        run: if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node scripts/check-pr-reflection.mjs; fi
      - name: 改核心目录的 PR 必须写安全依据并点名 CI 会跑的测试
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node scripts/check-pr-safety.mjs; fi
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE" --without-scanners
      - name: 安装汇总器最小依赖
        run: .ci-output/tools/bin/node scripts/ci/install-gate-dependencies.mjs
      - name: 从本次运行的缓存取 policy-default 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/policy-default
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-policy-default
      - name: 从本次运行的缓存取 static-default 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/static-default
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-static-default
      - name: 从本次运行的缓存取 build-linux-x64 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/build-linux-x64
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-x64
      - name: 从本次运行的缓存取 tests-integration-1 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tests-integration-1
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tests-integration-1
      - name: 从本次运行的缓存取 tests-integration-2 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tests-integration-2
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tests-integration-2
      - name: 从本次运行的缓存取 tests-others 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tests-others
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tests-others
      - name: 从本次运行的缓存取 tooling-default 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tooling-default
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tooling-default
      - name: 从本次运行的缓存取 security-default 的报告
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/security-default
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-security-default
      - name: 从共享目录取本次各任务的报告并核对摘要
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs collect --to .ci-output/reports
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: 核对全部 job 与报告，把汇总结论写进本步骤日志和作业摘要
        run: .ci-output/tools/bin/node scripts/ci/required.mjs --reports .ci-output/reports --output .ci-output/gate --base "$CI_BASE"
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
