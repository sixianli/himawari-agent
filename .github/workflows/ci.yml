          name: report-${{ github.run_id }}-${{ github.run_attempt }}-security-${{ env.CI_MATRIX }}
          path: .ci-output/public/reports/
          if-no-files-found: error
          retention-days: 30
      - name: 保留失败诊断
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-security-${{ env.CI_MATRIX }}
          path: .ci-output/public/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  required:
    name: ci/required
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - policy
      - static
      - build
      - test
      - node-floor
      - browser
      - coverage
      - security
    timeout-minutes: 5
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE" --without-scanners
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation
      - name: 下载当前 attempt 的完整报告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: report-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-output/reports
      - name: 核对全部 job 与报告
        run: .ci-output/tools/bin/node scripts/ci/required.mjs --reports .ci-output/reports --output .ci-output/gate --base "$CI_BASE"
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: 保留汇总结论
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-output/gate/
          if-no-files-found: error
          retention-days: 30
