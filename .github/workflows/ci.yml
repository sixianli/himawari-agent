name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: 明确的比较基线 commit SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}-${{ github.event.pull_request.draft == true && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  policy:
    name: policy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 只装检查工作流要用的最小依赖
        run: .ci-output/tools/bin/node scripts/ci/install-gate-dependencies.mjs
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check policy --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "policy-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/policy-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-policy-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "policy/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  static:
    name: static
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 取 main 存的依赖和浏览器下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/himawari-ci/npm
            ~/.cache/himawari-ci/native
            .ci-output/browsers
          key: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'ci/toolchain-lock.json', 'scripts/ci/install-dependencies.mjs') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 准备 GitHub 托管机器上的沙箱和浏览器依赖
        run: sudo bash scripts/ci/prepare-hosted.sh "$PWD/.ci-output/tools/bin/node"
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check static --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "static-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/static-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-static-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "static/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  build:
    name: build / ${{ matrix.key }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ${{ matrix.runner }}
    needs:
      - policy
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 取 main 存的依赖和浏览器下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/himawari-ci/npm
            ~/.cache/himawari-ci/native
            .ci-output/browsers
          key: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'ci/toolchain-lock.json', 'scripts/ci/install-dependencies.mjs') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check build --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "build-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/build-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "build/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
    outputs:
      linux-x64: ${{ steps.share.outputs.linux-x64 }}
  tests:
    name: tests / ${{ matrix.key }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ${{ matrix.runner }}
    needs:
      - policy
      - build
    timeout-minutes: 60
    outputs:
      integration-1: ${{ steps.share.outputs.integration-1 }}
      integration-2: ${{ steps.share.outputs.integration-2 }}
      others: ${{ steps.share.outputs.others }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: integration-1
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
            projects: [integration]
            shard:
              index: 1
              count: 2
          - key: integration-2
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
            projects: [integration]
            shard:
              index: 2
              count: 2
          - key: others
            runner: ubuntu-24.04
            os: linux
            arch: x64
            node: 22.22.3
            projects: [unit, contracts, e2e, pi-compat]
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: 把本次运行的共享目录指到本机临时目录
        run: mkdir -p "$RUNNER_TEMP/ci-share" && echo "HIMAWARI_CI_SHARE=$RUNNER_TEMP/ci-share" >> "$GITHUB_ENV"
      - name: 算出本周的缓存周号
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: 取 main 存的工具下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/himawari-ci/downloads
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchain-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 取 main 存的依赖和浏览器下载缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/himawari-ci/npm
            ~/.cache/himawari-ci/native
            .ci-output/browsers
          key: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'ci/toolchain-lock.json', 'scripts/ci/install-dependencies.mjs') }}-${{ steps.week.outputs.week }}
          restore-keys: ci-deps-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 准备 GitHub 托管机器上的沙箱和浏览器依赖
        run: sudo bash scripts/ci/prepare-hosted.sh "$PWD/.ci-output/tools/bin/node"
      - name: 安装集成测试用的 Chromium
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install --only-shell chromium
      - name: 从本次运行的缓存取 Linux 构建
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/build-linux-x64
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-build-linux-x64
          fail-on-cache-miss: true
      - name: 从共享目录取本次 Linux 构建并核对摘要
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.linux-x64 }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs get --name build-linux-x64 --digest "$CI_BUILD_DIGEST" --to .ci-output/input
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check tests --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check --baseline-candidate initial-only --input .ci-output/input/result.json
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进本次运行的共享目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "tests-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把共享目录里本作业的报告存进本次运行的缓存
        if: ${{ always() && steps.share.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ci-share/${{ github.run_id }}-${{ github.run_attempt }}/tests-${{ env.CI_MATRIX }}
          key: ci-share-${{ github.run_id }}-${{ github.run_attempt }}-tests-${{ env.CI_MATRIX }}
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "tests/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  tooling:
    name: tooling
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04-arm
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
