name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: 明确的比较基线 commit SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  policy:
    name: policy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ci-arm
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check policy --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "policy-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "policy/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  static:
    name: static
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ci-arm
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 安装布局检查用的 Chromium
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install --only-shell chromium
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check static --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "static-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "static/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  build:
    name: build / ${{ matrix.key }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ${{ matrix.runner }}
    needs:
      - policy
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ci-vps
            os: linux
            arch: x64
            node: 22.22.3
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check build --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "build-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "build/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
    outputs:
      linux-x64: ${{ steps.share.outputs.linux-x64 }}
  browser:
    name: browser / ${{ matrix.key }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build
    timeout-minutes: 90
    outputs:
      chromium: ${{ steps.share.outputs.chromium }}
      firefox: ${{ steps.share.outputs.firefox }}
      webkit: ${{ steps.share.outputs.webkit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: chromium
            runner: ci-vps
            os: linux
            arch: x64
            node: 22.22.3
            browser: chromium
          - key: firefox
            runner: ci-vps
            os: linux
            arch: x64
            node: 22.22.3
            browser: firefox
          - key: webkit
            runner: ci-vps
            os: linux
            arch: x64
            node: 22.22.3
            browser: webkit
    env:
      CI_NODE: ${{ matrix.node }}
      CI_MATRIX: ${{ matrix.key }}
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 从 CI 服务器取本次 Linux 构建并核对摘要
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.linux-x64 }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs get --name build-linux-x64 --digest "$CI_BUILD_DIGEST" --to .ci-output/input
      - name: 安装锁定 Playwright 对应引擎
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install "$CI_MATRIX"
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check browser --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check --input .ci-output/input/result.json
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "browser-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "browser/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  tests:
    name: tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ci-vps
    needs:
      - policy
      - build
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 安装集成测试用的 Chromium
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install --only-shell chromium
      - name: 从 CI 服务器取本次 Linux 构建并核对摘要
        env:
          CI_BUILD_DIGEST: ${{ needs.build.outputs.linux-x64 }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs get --name build-linux-x64 --digest "$CI_BUILD_DIGEST" --to .ci-output/input
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check tests --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check --baseline-candidate initial-only --input .ci-output/input/result.json
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "tests-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "tests/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  tooling:
    name: tooling
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ci-arm
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check tooling --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "tooling-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "tooling/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ci-arm
    needs:
      - policy
    timeout-minutes: 60
    outputs:
      default: ${{ steps.share.outputs.default }}
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check security --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把本次完整报告放进 CI 服务器上本次运行的目录
        id: share
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs put --name "security-$CI_MATRIX" --from .ci-output/public/reports --output-key "$CI_MATRIX"
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "security/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  required:
    name: ci/required
    if: always()
    runs-on: ci-vps-gate
    needs:
      - policy
      - static
      - build
      - browser
      - tests
      - tooling
      - security
    timeout-minutes: 15
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ${{ inputs.base_sha || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - name: 草稿和被取消的运行直接判失败
        id: entry
        env:
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          CI_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$CI_DRAFT" != false ]; then echo "CI_DRAFT_UNVERIFIED 草稿 PR 不跑 CI，标成准备合并后才跑完整检查"; exit 1; fi
          if [ "$CI_CANCELLED" != false ]; then echo "CI_UPSTREAM_CANCELLED 上游作业被取消，这一轮不算数"; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE" --without-scanners
      - name: 安装汇总器最小依赖
        run: .ci-output/tools/bin/node scripts/ci/install-gate-dependencies.mjs
      - name: 从 CI 服务器取本次各任务的报告并核对摘要
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs collect --to .ci-output/reports --remote-jobs policy,static,tooling,security
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: 核对全部 job 与报告，把汇总结论写进本步骤日志和作业摘要
        run: .ci-output/tools/bin/node scripts/ci/required.mjs --reports .ci-output/reports --output .ci-output/gate --base "$CI_BASE"
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: 删除 CI 服务器上本次运行的目录
        if: ${{ always() && steps.entry.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/run-share.mjs remove
