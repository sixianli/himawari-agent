name: Apple
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: apple/changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      client: ${{ steps.scope.outputs.client }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 看这次改动有没有碰苹果客户端（iPhone 和 Mac），没碰就不占 Mac 机器；main 上从这些检查上次全部通过的提交算起，凌晨审计从上次审计过的提交算起
        id: scope
        env:
          BASE: ${{ github.event_name == 'push' && '--since-green' || github.event_name == 'schedule' && '--since-audit' || github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/apple-scope.mjs "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  iphone:
    name: apple/iphone
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.client == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 显示 Xcode 版本
        run: xcodebuild -version && swift --version
      - name: 选一台最新系统的 iPhone 模拟器，编译期间先让它开机
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(part) for part in re.findall(r"\d+", key.rsplit(".", 1)[-1])]
          ios = sorted((key for key in runtimes if ".SimRuntime.iOS-" in key), key=version)
          phones = [device for device in runtimes[ios[-1]] if device["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
      - name: 跑 HimawariCore 单元测试
        working-directory: clients/apple
        run: swift test
      - name: 不签名编译 iPhone App 和它的 UI 测试
        run: >-
          xcodebuild build-for-testing
          -project clients/apple/App/Himawari.xcodeproj
          -scheme Himawari
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO
          -quiet
      - name: 等模拟器开机完成
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: 在示例场景里真点、真滑、真打字的 UI 测试（聊天输入框、断连提示、Himawari 页和设置各页、位置一直允许开关）
        run: >-
          set -o pipefail;
          xcodebuild test-without-building
          -project clients/apple/App/Himawari.xcodeproj
          -scheme Himawari
          -configuration Debug
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/dd"
          -only-testing:HimawariUITests/ChatComposerTests
          -only-testing:HimawariUITests/SettingsPagesTests
          -only-testing:HimawariUITests/SensesPageTests
          -resultBundlePath feature-ui-tests.xcresult
          | tee feature-ui-tests.log
          | grep -E 'UI_|error:|Test Case .* (passed|failed)|\*\* TEST'
      - name: UI 测试没过时打印失败原因
        if: ${{ failure() }}
        run: |
          test -d feature-ui-tests.xcresult || exit 0
          xcrun xcresulttool get test-results tests --path feature-ui-tests.xcresult --compact | python3 -c '
          import json, sys
          def walk(node, name=""):
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("UI_TEST_FAILURE", name, "::", child.get("name", ""))
                  walk(child, child.get("name", name) if child.get("nodeType") == "Test Case" else name)
          for plan in json.load(sys.stdin).get("testNodes", []):
              walk(plan)
          ' | sort -u | head -100 || true
      - name: 保存 UI 测试结果包
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-ui-tests
          path: feature-ui-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
      - name: 不签名编译原生 Mac App
        run: >-
          xcodebuild build
          -project clients/apple/App/Himawari.xcodeproj
          -scheme HimawariMac
          -configuration Debug
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
  iphone-accessibility-build:
    name: apple/iphone-accessibility-build
    needs: [changes, iphone]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'push' && needs.changes.outputs.client == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact: accessibility-build-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 为模拟器编译一次 App 和无障碍审计测试，三份审计共用
        run: >-
          xcodebuild build-for-testing
          -project clients/apple/App/Himawari.xcodeproj
          -scheme Himawari
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO
          -quiet
      - name: 打包编译结果
        run: tar -C "$RUNNER_TEMP/dd/Build" -czf "$RUNNER_TEMP/accessibility-build.tgz" Products
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accessibility-build.tgz
          retention-days: 1
          if-no-files-found: error
  iphone-accessibility:
    name: apple/iphone-accessibility ${{ matrix.shard }}
    needs: [changes, iphone-accessibility-build]
    if: ${{ !cancelled() && needs.iphone-accessibility-build.result == 'success' && github.event_name != 'pull_request' && github.event_name != 'push' && needs.changes.outputs.client == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.iphone-accessibility-build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: 解开同一次运行编译好的 App 和测试
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -C "$RUNNER_TEMP/dd/Build" -xzf "$RUNNER_TEMP/accessibility-build.tgz"
          xctestrun="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 1 -name 'Himawari_*.xctestrun' | head -1)"
          test -n "$xctestrun"
          echo "xctestrun=$xctestrun" >> "$GITHUB_OUTPUT"
      - name: 选一台最新系统的 iPhone 模拟器
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(part) for part in re.findall(r"\d+", key.rsplit(".", 1)[-1])]
          ios = sorted((key for key in runtimes if ".SimRuntime.iOS-" in key), key=version)
          phones = [device for device in runtimes[ios[-1]] if device["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
      - name: 每个示例场景跑苹果的无障碍审计（浅色全部审计项，深色对比度）
        env:
          TEST_RUNNER_HIMAWARI_AUDIT_SHARD: ${{ matrix.shard }}
        run: >-
          set -o pipefail;
          xcodebuild test-without-building
          -xctestrun "${{ steps.build.outputs.xctestrun }}"
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -only-testing:HimawariUITests/AccessibilityAuditTests
          -resultBundlePath accessibility-audit.xcresult
          | tee accessibility-audit.log
          | grep -E 'A11Y_AUDIT_|error:|Test Case .* (passed|failed)|\*\* TEST'
      - name: 列出这次审计发现的问题
        if: ${{ always() }}
        run: grep -E 'A11Y_AUDIT_' accessibility-audit.log | sort -u || true
      - name: 测试没跑完时打印失败原因
        if: ${{ failure() }}
        run: |
          xcrun xcresulttool get test-results tests --path accessibility-audit.xcresult --compact | python3 -c '
          import json, sys
          def walk(node):
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("A11Y_AUDIT_FAILURE", child.get("name", ""))
                  walk(child)
          for plan in json.load(sys.stdin).get("testNodes", []):
              walk(plan)
          ' | sort -u | head -200 || true
      - name: 保存测试结果包
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-audit-${{ strategy.job-index }}
          path: accessibility-audit.xcresult
          retention-days: 7
  scroll:
    name: apple/scroll
    needs: [changes, iphone-accessibility]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'push' && needs.changes.outputs.client == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 编译开了优化的调试版 iPhone App（模拟器）
        run: >-
          xcodebuild build
          -project clients/apple/App/Himawari.xcodeproj
          -scheme Himawari
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          SWIFT_OPTIMIZATION_LEVEL=-O
          COMPILER_INDEX_STORE_ENABLE=NO
          CODE_SIGNING_ALLOWED=NO
          -quiet
      - name: 长对话上下滚动，量掉帧
        run: >-
          bash clients/apple/scripts/scroll-bench.sh
          --app "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Himawari.app"
          --loads realistic,plain,long,table,code
          --runs 2
          --profile realistic
          --out "$RUNNER_TEMP/scroll-bench"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scroll-bench
          path: |
            ${{ runner.temp }}/scroll-bench/*.json
            ${{ runner.temp }}/scroll-bench/*.txt
          if-no-files-found: ignore
  claim:
    name: apple/claim
    needs: [iphone, iphone-accessibility-build, iphone-accessibility, scroll]
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: main 上失败时找出改了苹果客户端的 PR，在 PR 上留言请它的线程认领
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            node scripts/ci/main-claim.mjs apple.yml apple apple/iphone-accessibility-build apple/iphone-accessibility apple/scroll
          else
            node scripts/ci/main-claim.mjs apple.yml apple apple/iphone
          fi
