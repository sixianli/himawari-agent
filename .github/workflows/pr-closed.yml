name: Cancel CI of closed PR
on:
  pull_request:
    types:
      - closed
permissions: {}
concurrency:
  group: CI-pull_request-${{ github.event.pull_request.number }}--ready
  cancel-in-progress: true
jobs:
  cancel:
    name: cancel-closed-pr-ci
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - run: "true"
