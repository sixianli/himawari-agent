name: Main confirmation
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: main-confirmation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    name: main/evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.verify.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 查找已合并 PR 的完整验收记录，从 ci/required 的日志取汇总结论
        id: candidate
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-evidence.mjs discover
      - name: 无法证明一致时选择完整 CI
        if: always()
        id: verify
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-evidence.mjs verify
      - name: 把路径选择写进作业摘要
        if: always()
        run: node scripts/ci/ci-summary.mjs --title "main 路径选择" --from .ci-output/main-evidence
  full:
    needs: plan
    if: always() && (needs.plan.result != 'success' || needs.plan.outputs.mode != 'light')
    uses: ./.github/workflows/ci.yml
  confirm:
    name: main/confirmation
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.mode == 'light'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_NODE: 22.22.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache runner
      - name: 准备 GitHub 托管机器上的沙箱和浏览器依赖
        run: sudo bash scripts/ci/prepare-hosted.sh "$PWD/.ci-output/tools/bin/node"
      - name: 重新查找并取回本次确认的 PR 汇总结论
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-evidence.mjs discover
      - name: 在实际 main 提交上构建并验证安装启动及安全检查
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/main-confirm.mjs
      - name: 把 main 确认报告写进作业摘要
        if: always()
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "main 确认报告" --from .ci-output/main-public
