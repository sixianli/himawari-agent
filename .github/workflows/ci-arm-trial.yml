name: CI ARM trial
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  policy:
    name: arm-trial / policy
    runs-on: ci-arm
    timeout-minutes: 60
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ""
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check policy --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "arm-trial policy/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  static:
    name: arm-trial / static
    runs-on: ci-arm
    timeout-minutes: 60
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ""
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 安装布局检查用的 Chromium
        run: .ci-output/tools/bin/node node_modules/playwright/cli.js install --only-shell chromium
      - name: 执行共享检查
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check static --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "arm-trial static/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
  security:
    name: arm-trial / security
    runs-on: ci-arm
    timeout-minutes: 60
    env:
      CI_NODE: 22.22.3
      CI_MATRIX: default
      CI_BASE: ""
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-output/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: 安装并核验固定工具
        run: node scripts/ci/install-tools.mjs --directory .ci-output/tools --node "$CI_NODE"
      - name: 隔离安装依赖及 SQLite 探针
        run: node scripts/ci/install-dependencies.mjs --tools .ci-output/tools --evidence .ci-output/installation --cache .ci-output/npm-cache
      - name: 执行共享检查
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/run.mjs --check security --matrix "$CI_MATRIX" --base "$CI_BASE" --tools .ci-output/tools --output .ci-output/check
      - name: 核验公开输出白名单
        env:
          HIMAWARI_CI_GITHUB_TOKEN: ${{ github.token }}
        run: .ci-output/tools/bin/node scripts/ci/publish.mjs --input .ci-output/check --output .ci-output/public --tools .ci-output/tools
        if: always()
        id: publish
      - name: 把失败诊断写进作业摘要
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: .ci-output/tools/bin/node scripts/ci/ci-summary.mjs --title "arm-trial security/$CI_MATRIX 失败诊断" --from .ci-output/public/diagnostics --failed-logs .ci-output/public/reports
