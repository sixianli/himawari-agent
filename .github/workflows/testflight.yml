name: TestFlight
on:
  push:
    branches: [main]
    paths:
      - clients/apple/**
      - .github/workflows/testflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  APPLE_TEAM_ID: WS6PVS5YQP
  HIMAWARI_BUILD_NUMBER: ${{ github.run_number }}
  HIMAWARI_SERVER_ORIGIN: ${{ vars.HIMAWARI_SERVER_ORIGIN }}
jobs:
  upload:
    name: testflight/upload
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'sixianli/himawari-agent' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 检查签名密钥是否已填
        id: keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 HIMAWARI_SERVER_ORIGIN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::testflight 环境还缺：$missing，这次只归档、核对权限，不上传"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 没有密钥时只打 Release 归档并核对权限仍在签名里
        if: ${{ steps.keys.outputs.ready != 'true' }}
        run: clients/apple/scripts/testflight.sh archive
      - name: 归档并上传 TestFlight（苹果云端签名）
        if: ${{ steps.keys.outputs.ready == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: clients/apple/scripts/testflight.sh upload
      - name: 写运行摘要
        if: ${{ steps.keys.outputs.ready == 'true' }}
        run: echo "已上传 TestFlight，build 号 $HIMAWARI_BUILD_NUMBER（提交 ${GITHUB_SHA::8}）" >> "$GITHUB_STEP_SUMMARY"
  claim:
    name: testflight/claim
    needs: upload
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: main 上失败时找出改了苹果客户端的 PR，在 PR 上留言请它的线程认领
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-claim.mjs testflight.yml apple testflight/upload
