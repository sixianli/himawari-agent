name: Tmp icon compare
on:
  push:
    branches: [claude/project-thread-tbaibb]
    paths: [tmp-icon-compare/**, .github/workflows/tmp-icon-compare.yml]
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: mkdir -p out && swift tmp-icon-compare/icons-compare.swift out && ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icons-compare
          path: out/*.png
