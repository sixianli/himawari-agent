name: ARM integration trial
on:
  pull_request:
    paths:
      - .github/workflows/arm-integration-trial.yml
permissions:
  contents: read
jobs:
  checkout-probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ci-arm, ci-vps]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: git log -1 --format=%H
