# opencode 模型表：给 opencode 派活时允许用哪些模型、按什么顺序换。
# 这是唯一的来源。改完运行 `python3 .agents/opencode-models.py export` 重新生成
# `.opencode/allowed-models.txt`（启动脚本 oc-launch.sh 只认那个文件），再用 `check` 确认一致。
# 原则在 docs/adr/0061-opencode-model-table.md；每个模型的行只记事实，不记理由。
#
# 字段：
#   id        完整模型 ID，不带 #档位
#   pool      free（限时免费，不占额度）| go（opencode Go 套餐共享额度池）
#   order     新会话的尝试顺序，小的先试；0 表示不进入自动顺序，只按规则手动选
#   context   上下文上限（token，约数）；超过它的任务要换模型
#   status    active | paused | withdrawn；只有 active 的模型会导出到白名单
#   skip_for_context  true 表示因上下文不够而换模型时跳过它
#   min_variant  新会话允许的最低推理档位；空字符串表示没有下限。可用档位不记在表里：启动脚本每次向 opencode 服务实时查询（GET /api/model）
#   note      一句事实说明
#   updated   最后核实日期

[[model]]
id = "opencode/deepseek-v4.1-flash-free"
pool = "free"
order = 1
context = 200000
status = "active"
skip_for_context = false
min_variant = "high"
note = "免费限时；可能被限流（HTTP 429、FreeUsageLimitError）；可能用请求内容训练，用户已同意（G115）；档位随 opencode 版本变（2026-10-15 没有 #max，2026-10-21 v2.0.32 有），所以不记在表里"
updated = "2026-10-21"

